function contextOf(text, wrong){
  const sentences = text.split(/(?<=[.!?\n])/);
  const s = (sentences.find(x=>x.includes(wrong)) || "").trim();
  if(!s) return "";
  let ctx = s.replace(wrong, "____");
  if(ctx.length > 40){ const i = ctx.indexOf("____"); ctx = ctx.slice(Math.max(0,i-18), i+22).trim(); }
  return ctx;
}
/* ===== AI 다홍펜 선생님 (공부방 다홍펜과 같은 워커 · 같은 방식) =====
   목표 글자 수를 채우면 부를 수 있어요 → 틀린 곳을 노란 형광펜으로 칠해요 → 스스로 고치거나 정답을 보고 고쳐요.
   1 · 2학년은 다홍펜이 바로 고쳐 줘요(초록 형광펜). 다 고쳐야 제출할 수 있어요. 칭찬 · 응원 한마디(AI 피드백)도 함께.
   워커: { text, level:"grade4", name } → { errors:[{wrong,right,kind,hint,why}], praise, cheer } */
const PEN_MAX_CHECK = 3;   // 일기 하나에 다홍펜 검사는 세 번까지
// 학년(profiles.grade): 숫자 하나로 -2~0 = 5~7세, 1~6 = 초1~초6, 7~9 = 중1~중3, 10~12 = 고1~고3 (예전 1~6학년 값은 그대로 초1~초6)
const GRADES = [[-2,"5세"],[-1,"6세"],[0,"7세"],[1,"초1"],[2,"초2"],[3,"초3"],[4,"초4"],[5,"초5"],[6,"초6"],[7,"중1"],[8,"중2"],[9,"중3"],[10,"고1"],[11,"고2"],[12,"고3"]];
const hasGrade = g => g!==undefined && g!==null && g!=="" && !Number.isNaN(Number(g));
const gradeName = g => hasGrade(g) ? (GRADES.find(x=>x[0]===Number(g))?.[1] || "") : "";
const gradeOptions = (sel=1) => GRADES.map(([v,l])=>`<option value="${v}" ${v===Number(sel)?"selected":""}>${l}</option>`).join("");
// AI 다홍펜 워커에 보내는 학년 이름: age5~7 · grade1~6 · middle1~3 · high1~3
const gradeLevel = g => { const n=hasGrade(g)?Number(g):2; return n<=0?`age${n+7}`:n<=6?`grade${n}`:n<=9?`middle${n-6}`:`high${n-9}`; };
// 아이 일기 최소 글자 수: 학년별 기본값 (공부방과 같게 초2 60자 · 초4 150자). 부모가 우리 가족 탭에서 아이마다 바꿀 수 있어요 (profiles.diaryGoal)
// 학년별 기본 최소 글자 수 (2026-09-29 낮춤: 초3 80 · 초4 100 · 초5~6 150)
const PEN_GOAL_DEFAULT = {"-2":10,"-1":20,0:30,1:40,2:60,3:80,4:100,5:150,6:150,7:300,8:300,9:300,10:400,11:400,12:400};
const penGoalDefault = p => (hasGrade(p?.grade) && PEN_GOAL_DEFAULT[Number(p.grade)]) || 60;
const penGoalOf = p => Number(p?.diaryGoal) || penGoalDefault(p);
const penAuto = g => (hasGrade(g)?Number(g):2) <= 2;   // 7세 이하 · 초1 · 초2는 다홍펜이 바로 고쳐 줘요
const countChars = s => String(s||"").replace(/\s/g,"").length;
const PEN_ENDS = /[.?!…~。)"'”’\]]$|\p{Extended_Pictographic}$/u;
const PEN_HOW = {self:"스스로 고쳤어요", hint:"정답 보고 고쳤어요", ai:"AI 다홍펜이 고쳐 줬어요", other:"다른 말로 고쳤어요", kept:"그대로 두었어요", left:"그대로예요"};
const PRAISE_SELF = ["👍 스스로 찾아서 고쳤어요! 정말 대단해요!","🦸 혼자 고치다니, 맞춤법 영웅이에요!","🧠 똑똑해요! AI 선생님 도움 없이 고쳤어요!"];
// 틀린 말이 글 어디에 있는지 (고친 말 안에 틀린 말이 들어 있는 경우는 건너뛰어요)
function penAt(er,text){
  const off=er.right.indexOf(er.wrong); let i=text.indexOf(er.wrong);
  while(i>=0){ if(off<0 || !text.startsWith(er.right,i-off)) return i; i=text.indexOf(er.wrong,i+1); }
  return -1;
}
const penLeft = (er,text) => !er.kept && penAt(er,text)>=0;
// 줄 끝(문장 끝)에 마침표가 없는 곳: 다홍펜이 놓쳐도 꼭 잡혀요
function penPeriod(text,known){
  const out=[]; let pos=0;
  for(const line of text.split("\n")){
    const body=line.replace(/\s+$/,""), end=pos+body.length; pos+=line.length+1;
    if(countChars(body)<4 || PEN_ENDS.test(body)) continue;
    if([...known,...out].some(er=>{ const i=penAt(er,text); return i>=0 && i+er.wrong.length===end; })) continue;
    const words=[...body.matchAll(/\S+/g)]; let tail="";
    for(let n=1;n<=words.length;n++){ const t=body.slice(words[words.length-n].index); if(text.indexOf(t)===end-t.length && text.lastIndexOf(t)===end-t.length){ tail=t; break; } }
    if(!tail) continue;
    out.push({wrong:tail,right:tail+".",kind:"문장부호",hint:"문장이 끝났어요. 끝에 무엇을 찍어야 할까요?",
      why:"문장이 끝나면 마침표(.)를 찍어요. 묻는 말이면 물음표(?), 놀란 말이면 느낌표(!)예요."});
  }
  return out;
}
// 쉼표 · 마침표 · 물음표 · 느낌표 바로 뒤에 글자가 붙어 있으면 한 칸 띄어요 (1,000 · 3.5 는 그대로)
function penSpace(text,known){
  const out=[];
  for(const m of text.matchAll(/[,.!?](?=[^\s.,!?)"'”’~…])/g)){
    const i=m.index, c=m[0], prev=text[i-1]||"", rest=text.slice(i+1);
    if(c==="," && /\d/.test(prev) && /^\d{3}(?!\d)/.test(rest)) continue;
    if(c==="." && /\d/.test(prev) && /^\d/.test(rest)) continue;
    const start=Math.max(text.lastIndexOf(" ",i)+1, text.lastIndexOf("\n",i)+1);
    const e1=text.slice(i).search(/\s/), end=e1<0?text.length:i+e1, wrong=text.slice(start,end);
    if(!wrong || text.indexOf(wrong)!==text.lastIndexOf(wrong)) continue;
    if([...known,...out].some(er=>{ const j=penAt(er,text); return j>=0 && j<end && j+er.wrong.length>start; })) continue;
    const cut=i-start+1;
    out.push({wrong,right:wrong.slice(0,cut)+" "+wrong.slice(cut),kind:"띄어쓰기",hint:"문장 부호 뒤에 글자가 딱 붙어 있어요. 어디를 한 칸 띄우면 될까요?",why:"쉼표(,)나 마침표(.) 뒤에는 한 칸 띄어 써요."});
  }
  return out;
}
// 어떻게 고쳤는지: ai(다홍펜이 고쳐 줌) · hint(정답 보고) · self(스스로) · other(다른 말로) · kept(그대로 두기) · left(아직)
function penHow(er,text){
  if(penAt(er,text)>=0) return er.kept?"kept":"left";
  return er.applied ? (er.auto?"ai":"hint") : !text.includes(er.right) ? "other" : er.shown ? "hint" : "self";
}
// 일기에 저장하는 모양(aiResult): 부모 화면 · 받아쓰기 퀴즈 · 예전 일기 가져오기와 같은 모양
function penResult(d){
  const p=d.pen;
  return {praise:p.praise||"", feedback:p.cheer||"", checks:p.checks||1, original:p.original||"", auto:!!p.auto, checkedAt:Date.now(),
    corrections:p.errors.map(er=>({wrong:er.wrong,right:er.right,explain:er.why||"",hint:er.hint||"",kind:er.kind||"",how:penHow(er,d.text)}))};
}
function penFromResult(r){
  if(!r) return null;
  return {praise:r.praise||"", cheer:r.feedback||"", checks:r.checks||1, original:r.original||"", auto:!!r.auto,
    errors:(r.corrections||[]).map(c=>({wrong:c.wrong,right:c.right,why:c.explain||"",hint:c.hint||"",kind:c.kind||"",
      shown:c.how==="hint"||c.how==="kept", applied:c.how==="ai"||c.how==="hint", auto:c.how==="ai", kept:c.how==="kept"}))};
}
async function callPen(text){
  if(DEMO){
    await new Promise(r=>setTimeout(r,700));
    return { errors:DEMO_DICT.filter(([w])=>text.includes(w)).map(([w,r,e])=>({wrong:w,right:r,kind:"맞춤법",hint:"소리 내어 읽어 보고, 바르게 쓰는 말을 떠올려 볼까요?",why:e})),
      praise:"오늘 있었던 일이 생생하게 느껴지는 일기예요!", cheer:"조금만 고치면 더 반짝이는 일기가 돼요!" };
  }
  let last;
  for(let i=0;i<2;i++){   // 선생님이 가끔 바빠서 못 받을 때가 있어요: 한 번 더 불러요
    try{
      const r=await fetch(SPELL_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text,level:gradeLevel(S.me.grade),name:S.me.name})});
      if(r.ok) return await r.json();
      last=new Error("다홍펜 "+r.status);
    }catch(e){ last=e; }
  }
  throw last;
}

/* 퀴즈 오답 보기 만들기: 헷갈리기 쉬운 글자를 바꿔 봐요 */
function variants(word){
  const out = new Set();
  const pairs = [["되","돼"],["데","대"],["게","께"],["거","꺼"],["세","새"],["웬","왠"],["안","않"],["로서","로써"],["히","이"],["며칠","몇일"],["며","몇"],["됐","됬"]];
  for(const [a,b] of pairs){ if(word.includes(a)) out.add(word.replace(a,b)); if(word.includes(b)) out.add(word.replace(b,a)); }
  const swap = {1:5,5:1,3:7,7:3,10:15,15:10,11:10};
  for(let i=0;i<word.length;i++){
    const c = word.charCodeAt(i) - 0xAC00; if(c<0 || c>11171) continue;
    const jung = Math.floor((c%588)/28);
    if(swap[jung]!==undefined) out.add(word.slice(0,i) + String.fromCharCode(0xAC00 + c + (swap[jung]-jung)*28) + word.slice(i+1));
  }
  if(word.includes(" ")) out.add(word.replace(" ","")); 
  out.delete(word);
  return [...out];
}

/* ---------- 💬 가족 채팅 ----------
   groups/{gid}/chats: {profileId, text, photo{url,path,thumb,thumbPath,w,h}, createdAt, deleted}
   사진은 일기 사진과 같은 곳(groups/{gid}/diaries/chat/…)에 올려서 저장소 규칙을 바꾸지 않아도 돼요 */
function startChat(){
  S.chatUnsub?.(); S.chats=[]; S.chatReady=false; S.chatJump=true;
  S.chatUnsub=B.watchChats(S.gid,list=>{ S.chats=list; S.chatReady=true; onChats(); });
}
const chatSeenKey = () => `iinote-chatseen-${S.gid}-${S.me?.id}`;
function chatUnread(){
  if(!S.me || !S.chatReady) return 0;
  const k=chatSeenKey(), last=S.chats.at(-1)?.createdAt||0;
  if(ls.get(k,null)===null){ ls.set(k,String(last)); return 0; }   // 처음에는 지난 이야기를 '새 메시지'로 세지 않아요
  const seen=Number(ls.get(k,"0"));
  return S.chats.filter(m=>m.profileId!==S.me.id && !m.deleted && (m.createdAt||0)>seen).length;
}
function markChatSeen(){ const last=S.chats.at(-1)?.createdAt||0; if(S.me && last>Number(ls.get(chatSeenKey(),"0"))) ls.set(chatSeenKey(),String(last)); chatDots(); }
// 채팅 목록은 두 곳에 있어요: 컴퓨터는 종이 판 오른쪽 채팅 기둥, 휴대폰은 '가족 채팅' 탭. 지금 눈에 보이는 것만 써요
const chatBoxes = () => [...document.querySelectorAll(".chat-list")].filter(b=>b.offsetParent!==null);
function chatDots(){
  const n = chatBoxes().length ? 0 : chatUnread();
  document.querySelectorAll('[data-act="tab"][data-v="chat"],[data-act="chat-side"]').forEach(b=>{ let d=b.querySelector(".cdot");
    if(n){ if(!d){ d=document.createElement("i"); d.className="cdot"; b.appendChild(d); } d.textContent=n>9?"9+":n; } else d?.remove(); });
}
// 새 메시지가 오면: 채팅이 보이면 목록만 바꾸고(쓰던 글 그대로), 안 보이면 탭 · 채팅 단추에 빨간 숫자만
function onChats(){
  if(S.phase!=="app" || !S.me) return;
  document.querySelectorAll(".chat-list").forEach(box=>{ const bottom=box.scrollHeight-box.scrollTop-box.clientHeight<120; box.innerHTML=chatItems(); if(bottom) box.scrollTop=box.scrollHeight; });
  if(chatBoxes().length) markChatSeen(); else chatDots();
}
function afterChatRender(){
  // 채팅을 처음 열 때만 맨 아래로 (사진 크게 보기를 열고 닫아도 보던 자리 그대로)
  const boxes=chatBoxes(); if(!boxes.length){ chatDots(); return; }
  if(S.chatJump){ boxes.forEach(b=>b.scrollTop=b.scrollHeight); S.chatJump=false; }
  markChatSeen(); cleanOldChats();
}

async function cleanOldChats(){
  if(!isParent() || S.chatCleaned===S.gid) return; S.chatCleaned=S.gid;

function viewChat(){

function chatItems(){
  if(!S.chatReady) return `<p class="empty">불러오는 중…</p>`;
  if(!S.chats.length) return `<p class="empty">아직 이야기가 없어요. 첫 인사를 남겨 보세요 👋</p>`;
  let out="", day="";
  for(const m of S.chats){
    const t=new Date(m.createdAt||0), ds=ymd(t), p=prof(m.profileId), mine=m.profileId===S.me.id, del=!m.deleted && (mine||isParent());
    if(ds!==day){ day=ds; out+=`<div class="chat-day"><span>${fmtLong(ds)}</span></div>`; }
    out+=`<div class="cm ${mine?"me":""}">${mine?"":av(p,32)}<div class="cm-b">${mine?"":`<b class="cm-n">${esc(p?.name||"알 수 없음")}</b>`}
      <div class="cm-row"><div class="cm-bub" style="--pc:${p?.color||"#1F2A44"}">${m.deleted?`<em>지운 메시지예요</em>`
        :`${m.photo?`<button type="button" class="cm-ph" data-act="chat-ph" data-id="${esc(m.id)}" aria-label="사진 크게 보기"><img src="${esc(m.photo.thumb||m.photo.url)}" alt="" loading="lazy"></button>`:""}${m.text?`<p>${esc(m.text)}</p>`:""}`}</div>
      <span class="cm-t">${pad(t.getHours())}:${pad(t.getMinutes())}${del?`<button type="button" class="cm-del" data-act="chat-del" data-id="${esc(m.id)}" aria-label="메시지 지우기">지우기</button>`:""}</span></div></div></div>`;
  }
  return out;
}
// ta = 보낸 곳의 글 칸 (채팅 기둥 또는 채팅 탭)
async function sendChat(file, ta){
  const text=String(ta?.value||"").trim();
  if((!text && !file) || S.chatBusy) return;
  const btn=ta?.form?.querySelector(".chat-send"); S.chatBusy=true; if(btn){ btn.disabled=true; btn.textContent="보내는 중…"; }
  try{
    const data={profileId:S.me.id,text:text.slice(0,1000),createdAt:Date.now()};
    if(file){
      const {big,thumb}=await makePhotoPair(file), id=rid(), base=`groups/${S.gid}/diaries/chat`;
      const r=await B.uploadMedia(`${base}/${id}.jpg`,big.blob), th=thumb?.blob?await B.uploadMedia(`${base}/${id}_t.jpg`,thumb.blob):null;
      data.photo={url:r.url,path:r.path,thumb:th?.url||"",thumbPath:th?.path||"",w:big.w||0,h:big.h||0};
    }
    await B.add(S.gid,"chats",data);
    if(ta && ta.value.trim()===text){ ta.value=""; ta.style.height=""; S.chatDraft=""; }
  }catch(e){ console.error(e); toast(e.message?.includes("사진")?e.message:"보내지 못했어요. 다시 눌러 주세요"); }
  finally{ S.chatBusy=false; document.querySelectorAll(".chat-send").forEach(b=>{ b.disabled=false; b.textContent="보내기"; }); if(ta?.isConnected) ta.focus(); }
}

  else S.phase="picker";
  render();
}

function quadNews(){
  const vis=new Map(visibleDiaries().map(d=>[d.id,d]));

  S.comments.forEach(c=>{ const d=vis.get(c.diaryId); if(!d || c.deleted || c.profileId===S.me.id) return;
    const par=c.parentId&&S.comments.find(x=>x.id===c.parentId), owner=prof(d.profileId);
    const what = par&&par.profileId===S.me.id ? "내 댓글에 답글" : d.profileId===S.me.id ? "내 일기에 댓글" : `${owner?.name||""} 일기에 댓글`;

function streakOf(pid){ let d=todayStr(); if(!submittedOn(pid,d)) d=addDays(d,-1); let n=0; while(submittedOn(pid,d)){ n++; d=addDays(d,-1); } return n; }
function quadSticker(){

// 4. 성장 기록: 이번 달 일기 수, 평균 글자 수, 글 길이 변화, 자주 틀린 낱말
function quadGrowth(){
  const kids=sortedProfiles().filter(p=>p.type==="child"), pool=kids.length?kids:sortedProfiles();
  const p=pool.find(x=>x.id===S.growId)||pool[0]; if(!p) return "";
  const month=todayStr().slice(0,7);
  const all=S.diaries.filter(d=>d.profileId===p.id && d.status==="submitted").sort((a,b)=>a.date.localeCompare(b.date));
  const mon=all.filter(d=>d.date.startsWith(month));
  const avg=mon.length?Math.round(mon.reduce((s,d)=>s+(d.text||"").length,0)/mon.length):0;
  const ws=S.quizWords.filter(w=>w.profileId===p.id);
  const learned=ws.filter(w=>(w.correctStreak||0)>=3).length;
  const pts=all.slice(-12).map(d=>(d.text||"").length);
  let chart=`<p style="margin:0">2편부터 그려져요</p>`;
  if(pts.length>1){ const mx=Math.max(...pts,1);
    const xy=pts.map((v,i)=>`${(i/(pts.length-1)*300).toFixed(1)},${(56-v/mx*50).toFixed(1)}`).join(" ");
    chart=`<svg viewBox="0 0 300 60" preserveAspectRatio="none" role="img" aria-label="최근 일기 ${pts.length}편의 글자 수: ${pts.join(", ")}"><polyline points="${xy}" fill="none" stroke="var(--sky)" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`; }
  const wrong=ws.filter(w=>(w.correctStreak||0)<3).sort((a,b)=>(b.wrongCount||1)-(a.wrongCount||1)).slice(0,4);
  // 누구 기록인지 고르는 단추는 제목 줄 오른쪽에 작게
  const chips=pool.length>1?`<div class="qg-who" role="group" aria-label="누구의 기록">${pool.map(x=>`<button class="${x.id===p.id?"on":""}" data-act="grow" data-v="${x.id}" aria-pressed="${x.id===p.id}" title="${esc(x.name)}">${av(x,26)}</button>`).join("")}</div>`:"";
  return `<section class="block q-cell" aria-labelledby="h-qg"><div class="block-h"><h2 id="h-qg">성장 기록 <small class="muted">${esc(p.name)}</small></h2>${chips}</div>
    <div class="q-body">
      <div class="qg-stats"><div title="이번 달 일기">📔<b>${mon.length}편</b></div><div title="평균 글자 수">✏️<b>${avg}자</b></div><div title="${p.type==="child"?"익힌 낱말":"모든 일기"}">${p.type==="child"?"🌱":"📚"}<b>${p.type==="child"?learned:all.length}${p.type==="child"?"개":"편"}</b></div></div>
      <div class="qg-chart">📈 글 길이 (최근 ${pts.length}편)${chart}</div>
      ${p.type==="child"?`<div class="qg-words" aria-label="자주 틀린 낱말"><em>틀린 낱말</em>${wrong.length?wrong.map(w=>`<span>${esc(w.wrong)}→${esc(w.right)}</span>`).join(""):"없어요 👍"}</div>`:""}
    </div></section>`;
}

// 한 줄 일정: "14시 태권도" · "15:30 피아노" · "오후 3시 수영" · "14시 30분 학원" → 시간은 떼어서 시간 칸으로 (없으면 하루 종일)
function parseSchedule(s){
  s=String(s||"").trim();
  const m=s.match(/^(오전|오후)?\s*(\d{1,2})\s*(?::\s*(\d{2})|시\s*(?:(\d{1,2})\s*분|반)?)\s*(.+)$/);
  if(m){ let h=+m[2], mi=m[3]!=null?+m[3]:m[4]!=null?+m[4]:/시\s*반/.test(s)?30:0;
    if(m[1]==="오후" && h<12) h+=12; if(m[1]==="오전" && h===12) h=0;
    if(h<24 && mi<60) return {time:`${pad(h)}:${pad(mi)}`, title:m[5].trim()}; }
  return {time:"", title:s};
}

    <div id="feed-wrap">${viewFeed()}</div>`;
}

/* ---------- 일기 PDF로 저장 (A4 · 컬러 · 구성 10가지) ----------
   새 라이브러리 없이 브라우저의 '인쇄 → PDF로 저장'을 써요. 기기 안에서 만들고 어디에도 보내지 않아요.
   표지 한 장 + 고른 구성대로 일기 쪽. 종이 일기책은 출시 예정 */
// [키, 이름, 설명, 가로 A4인지]
const PDF_LAYOUTS = [
  ["basic","기본","일기마다 한 장 · 글 아래 사진",false],
  ["day","하루 모음","그날 가족 일기를 한 장에",false],
  ["top","위 사진 · 아래 글","사진을 크게, 글은 가로로",false],
  ["topv","위 사진 · 세로 글","사진 아래 글을 세로쓰기로",false],
  ["left","왼쪽 사진 · 오른쪽 글","A4 가로",true],
  ["right","왼쪽 글 · 오른쪽 사진","A4 가로",true],
  ["picture","사진 + 원고지","위 사진 한 장 · 아래 원고지 칸",false],
  ["grid","원고지","글만 원고지 칸에",false],
  ["two","두 편씩","한 장에 일기 두 편",false],
  ["album","앨범","사진 가득 · 짧은 글",false]
];
// 구성 미리보기 (사진 = 색 네모, 글 = 줄)
function pdfThumb(k){
  const land=PDF_LAYOUTS.find(x=>x[0]===k)?.[3], W=land?56:40, H=land?40:56;
  const ph=(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="var(--sky)" opacity=".55"/>`;
  const ln=(x,y,w,n,gap=4)=>Array.from({length:n},(_,i)=>`<line x1="${x}" y1="${y+i*gap}" x2="${x+w}" y2="${y+i*gap}" stroke="var(--ink3)" stroke-width="1.2"/>`).join("");
  const vl=(x,y,h,n)=>Array.from({length:n},(_,i)=>`<line x1="${x-i*4}" y1="${y}" x2="${x-i*4}" y2="${y+h}" stroke="var(--ink3)" stroke-width="1.2"/>`).join("");
  const gr=(x,y,c,r,s)=>{ let o=""; for(let i=0;i<=c;i++) o+=`<line x1="${x+i*s}" y1="${y}" x2="${x+i*s}" y2="${y+r*s}" stroke="var(--coral)" stroke-width=".7"/>`; for(let j=0;j<=r;j++) o+=`<line x1="${x}" y1="${y+j*s}" x2="${x+c*s}" y2="${y+j*s}" stroke="var(--coral)" stroke-width=".7"/>`; return o; };
  const body={
    basic: ln(6,10,28,6)+ph(6,36,28,14),
    day: `<rect x="5" y="5" width="30" height="14" rx="2" fill="none" stroke="var(--coral)"/><rect x="5" y="21" width="30" height="14" rx="2" fill="none" stroke="var(--sage)"/><rect x="5" y="37" width="30" height="14" rx="2" fill="none" stroke="var(--butter)"/>`+ln(8,10,24,2)+ln(8,26,24,2)+ln(8,42,24,2),
    top: ph(5,5,30,22)+ln(6,32,28,5),
    topv: ph(5,5,30,22)+vl(33,30,21,7),
    left: ph(4,5,22,30)+ln(30,9,22,7),
    right: ln(4,9,22,7)+ph(30,5,22,30),
    picture: ph(5,5,30,20)+gr(5,29,6,4,5),
    grid: gr(5,6,6,9,5),
    two: ln(6,8,28,4)+`<line x1="4" y1="28" x2="36" y2="28" stroke="var(--coral)" stroke-dasharray="2 2"/>`+ln(6,34,28,4),
    album: ph(4,4,15,15)+ph(21,4,15,15)+ph(4,21,32,20)+ln(8,46,24,2)
  }[k]||"";
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><rect x=".5" y=".5" width="${W-1}" height="${H-1}" rx="3" fill="var(--surface)" stroke="var(--line)"/>${body}</svg>`;
}
function viewPdf(){
  const ps=sortedProfiles(), t=todayStr(), first=t.slice(0,8)+"01", cur=S.pdfLay||"basic";
  return `<div class="sub-top"><button class="btn btn-ghost sm" data-act="back">${ic("back")}나가기</button></div>

    <fieldset class="span2 pdf-who"><legend>누구의 일기</legend>${ps.map(p=>`<label class="pdf-ck"><input type="checkbox" name="who" value="${esc(p.id)}" checked>${av(p,26)}${esc(p.name)}</label>`).join("")}</fieldset>

    <p>차곡차곡 쌓인 일기를 고른 구성 그대로 예쁜 종이책으로 받아 볼 수 있게 준비하고 있어요. 그때까지는 PDF로 모아 두세요.</p></section>`;

function pdfRange(v){
  const t=todayStr(), d=toDate(t);
  const r={month:[t.slice(0,8)+"01",t], year:[t.slice(0,4)+"-01-01",t],
    last:[ymd(new Date(d.getFullYear(),d.getMonth()-1,1)), ymd(new Date(d.getFullYear(),d.getMonth(),0))],
    all:[S.diaries.map(x=>x.date).sort()[0]||t, t]}[v];
  if(!r) return;
  document.getElementById("pdf-from").value=r[0]; document.getElementById("pdf-to").value=r[1];
}
// 원고지 칸: 한 칸에 한 글자, 줄바꿈은 그 줄을 비워요
function pdfWongoji(text,cols){
  const cells=[];
  for(const line of String(text||"").split("\n")){
    const ch=[...line]; ch.forEach(c=>cells.push(c===" "?"":c));
    const rest=(cols - ch.length%cols)%cols; if(rest || !ch.length) for(let i=0;i<(ch.length?rest:cols);i++) cells.push("");
  }
  return `<div class="wg" style="--cols:${cols}">${cells.map(c=>`<i>${esc(c)}</i>`).join("")}</div>`;
}
function makePdf(form){
  const fd=new FormData(form), lay=fd.get("lay")||"basic", who=fd.getAll("who"), from=fd.get("from")||"0000", to=fd.get("to")||"9999";
  const withPh=!!fd.get("photos"), withCm=!!fd.get("cmts"), land=!!PDF_LAYOUTS.find(x=>x[0]===lay)?.[3];
  S.pdfLay=lay;
  const list=visibleDiaries().filter(d=>d.status==="submitted" && who.includes(d.profileId) && d.date>=from && d.date<=to)
    .sort((a,b)=>a.date.localeCompare(b.date)||(a.createdAt||0)-(b.createdAt||0));
  if(!list.length){ toast("고른 기간에 올린 일기가 없어요"); return; }
  const w=window.open("","_blank"); if(!w){ toast("새 창이 막혔어요. 팝업을 허용해 주세요"); return; }
  const people=who.map(prof).filter(Boolean), total=list.length, fam=S.group?.name||"우리집 일기장";
  const nPh=list.reduce((s,d)=>s+(d.photos||[]).length,0), nCm=list.reduce((s,d)=>s+S.comments.filter(c=>c.diaryId===d.id).length,0);
  const dotDate=s=>{ const d=toDate(s); return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}.`; };
  const colorOf=p=>p?.color||"#1F2A44";
  const chip=p=>`<span class="who" style="--pc:${colorOf(p)};--pt:${onColor(colorOf(p))}"><i>${esc((p?.name||"?").slice(0,1))}</i>${esc(p?.name||"")}</span>`;
  // 일기 한 편의 조각들
  const head=d=>{ const p=prof(d.profileId), m=MOODS.find(x=>x[0]===d.mood);
    return `<header class="d-h"><div><p class="d-date">${fmtLong(d.date)}</p>${chip(p)}${m||weatherOf(d.weather)?`<span class="mood">${weatherOf(d.weather)?.[2]||""}${m?` ${m[3]} ${esc(m[1])}`:""}</span>`:""}</div>${d.stamp?`<div class="stamp">${esc(d.stamp)}</div>`:""}</header>`; };
  const title=d=>"";   // 제목 기능은 쓰지 않아요
  const text=(d,cls="")=>`<div class="d-text ${cls}">${esc(d.text)}</div>`;
  const photos=(d,n)=>{ const ph=withPh?(d.photos||[]).slice(0,n):[]; return ph.length?`<div class="photos n${ph.length}">${ph.map(x=>`<img src="${esc(x.url)}" alt="">`).join("")}</div>`:""; };
  const bigPhoto=d=>{ const ph=withPh?(d.photos||[]).slice(0,2):[];
    return ph.length?`<div class="big-ph n${ph.length}">${ph.map(x=>`<img src="${esc(x.url)}" alt="">`).join("")}</div>`
      :`<div class="big-ph none"><span>${esc(fmtLong(d.date))}</span></div>`; };
  const meta=d=>d.location?.name||(d.tags||[]).length?`<p class="d-meta">${d.location?.name?`📍 ${esc(d.location.name)}　`:""}${(d.tags||[]).map(t=>`#${esc(t)}`).join(" ")}</p>`:"";
  const cmts=d=>{ if(!withCm) return ""; const cs=S.comments.filter(x=>x.diaryId===d.id && !x.deleted).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)), hs=heartsOf(d).map(id=>prof(id)?.name).filter(Boolean);
    return cs.length||hs.length?`<div class="cmts">${hs.length?`<p class="hearts">❤️ ${hs.map(esc).join(" · ")}</p>`:""}${cs.map(x=>`<p><b style="color:${colorOf(prof(x.profileId))}">${esc(prof(x.profileId)?.name||"")}</b>${x.parentId?" ↳":""} ${esc(x.text)}</p>`).join("")}</div>`:""; };
  const page=(inner,d,cls="")=>`<section class="page ${cls}" style="--pc:${colorOf(d&&prof(d.profileId))};--pt:${onColor(colorOf(d&&prof(d.profileId)))}"><div class="band"></div>${inner}<p class="pg">${esc(fam)}</p></section>`;
  // 세로쓰기는 글이 길면 글씨를 조금 작게
  const vSize=d=>{ const n=[...d.text].length; return n>700?"9pt":n>450?"10.5pt":n>250?"12pt":"13.5pt"; };
  let pages="";
  if(lay==="day"){
    const days=[...new Set(list.map(d=>d.date))];
    pages=days.map(day=>{ const ds=list.filter(d=>d.date===day);
      return `<section class="page dayp"><div class="band multi">${ds.map(d=>`<i style="background:${colorOf(prof(d.profileId))}"></i>`).join("")}</div>
        <p class="d-date">${fmtLong(day)}</p>
        <div class="day-list">${ds.map(d=>{ const p=prof(d.profileId);
          return `<article class="day-one" style="--pc:${colorOf(p)};--pt:${onColor(colorOf(p))}"><div class="day-h">${chip(p)}${d.stamp?`<span class="stamp sm">${esc(d.stamp)}</span>`:""}</div>${title(d)}${text(d,"sm")}${photos(d,2)}${cmts(d)}</article>`; }).join("")}</div>
        <p class="pg">${esc(fam)}</p></section>`; }).join("");
  }else if(lay==="two"){
    for(let i=0;i<list.length;i+=2){ const pair=list.slice(i,i+2);
      pages+=`<section class="page twop">${pair.map(d=>`<article class="half" style="--pc:${colorOf(prof(d.profileId))};--pt:${onColor(colorOf(prof(d.profileId)))}"><div class="band"></div>${head(d)}${title(d)}${text(d,"sm")}${photos(d,2)}</article>`).join('<hr class="cut">')}<p class="pg">${esc(fam)}</p></section>`; }
  }else{
    pages=list.map(d=>{
      if(lay==="top") return page(`${bigPhoto(d)}${head(d)}${title(d)}${text(d)}${meta(d)}${cmts(d)}`,d,"topp");
      if(lay==="topv") return page(`${bigPhoto(d)}${head(d)}<div class="vbox"><div class="vtext" style="font-size:${vSize(d)}">${esc(d.text)}</div></div>`,d,"topp");
      if(lay==="left"||lay==="right"){ const ph=`<div class="side-ph">${bigPhoto(d)}</div>`, tx=`<div class="side-tx">${head(d)}${title(d)}${text(d)}${meta(d)}${cmts(d)}</div>`;
        return page(`<div class="side">${lay==="left"?ph+tx:tx+ph}</div>`,d,"landp"); }
      if(lay==="picture") return page(`${head(d)}${withPh&&(d.photos||[])[0]?`<div class="pic-frame"><img src="${esc(d.photos[0].url)}" alt=""></div>`:""}${pdfWongoji(d.text,14)}`,d,"picp");
      if(lay==="grid") return page(`${head(d)}${pdfWongoji(d.text,20)}${cmts(d)}`,d,"gridp");
      if(lay==="album"){ const ph=withPh?(d.photos||[]).slice(0,4):[];
        return page(`${head(d)}${ph.length?`<div class="album n${ph.length}">${ph.map(x=>`<img src="${esc(x.url)}" alt="">`).join("")}</div>`:""}<div class="caption">${title(d)}<p>${esc(d.text.length>220?d.text.slice(0,220)+"…":d.text)}</p></div>`,d,"albp"); }
      return page(`${head(d)}${title(d)}${text(d)}${photos(d,4)}${meta(d)}${cmts(d)}`,d,"basicp");
    }).join("");
  }
  const cover=`<section class="page cover"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    <div class="cv-in"><img class="cv-logo" src="${location.origin}/icon.png" alt=""><p class="cv-kicker">OUR FAMILY DIARY</p>
      <h1>${esc(fam)}</h1><p class="cv-range">${dotDate(list[0].date)} ~ ${dotDate(list[total-1].date)}</p>
      <div class="cv-who">${people.map(chip).join("")}</div>
      <div class="cv-stats"><div><b>${total}</b>편의 일기</div><div><b>${nPh}</b>장의 사진</div><div><b>${nCm}</b>개의 댓글</div></div></div>
    <p class="cv-foot">아이아이노트 · ${esc(SITE_ADDRESS)}</p></section>`;
  const layName=PDF_LAYOUTS.find(x=>x[0]===lay)?.[1]||"";
  w.document.open();
  w.document.write(`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>${esc(fam)} ${list[0].date}~${list[total-1].date} (${esc(layName)})</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap">
<style>${PDF_CSS}${land?PDF_CSS_LAND:""}:root{--diary:${getComputedStyle(document.documentElement).getPropertyValue("--diary")}}</style></head><body>
<div class="bar"><b>📄 ${esc(layName)} · 일기 ${total}편</b><span>대상(프린터)을 <b>‘PDF로 저장’</b>으로, 더 보기에서 <b>‘배경 그래픽’</b>을 켜 주세요.</span><button onclick="print()">인쇄 · PDF로 저장</button></div>
${cover}${pages}
<script>document.fonts.ready.then(()=>setTimeout(()=>print(),800));<\/script></body></html>`);
  w.document.close();
}
// PDF 모양 (새 창 안에서만 쓰는 색 · 크기)

/* ---------- 일기 탭: 예전 가족일기장처럼 하위 탭 5개 ----------
   내 일기 · 아이들 현황(부모) · 하루 펼쳐보기 · 책장(가족 일기 목록) · 리포트(부모) */
function diaryTabs(){
  const t=[["mine","📔","내 일기","var(--butter)"],["kids","👧","아이들 현황","var(--coral)"],["day","📖","하루 펼쳐보기","var(--sage)"],["shelf","📚","책장","var(--sky)"],["report","📈","리포트","var(--lilac)"]];
  return t.filter(([k])=>isParent() || !["kids","report"].includes(k));
}
function viewDiaryTab(){
  const tabs=diaryTabs(); if(!tabs.some(x=>x[0]===S.dtab)) S.dtab="shelf";
  const nav=`<nav class="dtabs" aria-label="일기 보기">${tabs.map(([k,e,l,c])=>`<button class="dtab ${S.dtab===k?"on":""}" style="--dc:${c}" data-act="dtab" data-v="${k}" ${S.dtab===k?'aria-current="page"':""}><span aria-hidden="true">${e}</span>${l}</button>`).join("")}</nav>`;
  const body={mine:viewMyDiary,kids:viewKidsStatus,day:viewDayOpen,shelf:viewDiaryList,report:viewReport}[S.dtab]();
  return nav+body;
}
// 📔 내 일기: 내가 쓴 일기만 (쓰는 중 포함)
function viewMyDiary(){
  const list=S.diaries.filter(d=>d.profileId===S.me.id).sort((a,b)=>b.date.localeCompare(a.date));
  const month=todayStr().slice(0,7), n=list.filter(d=>d.status==="submitted" && d.date.startsWith(month)).length;
  return `<div class="page-h"><h1>내 일기</h1><button class="btn btn-primary" data-act="write">${ic("pen")}오늘 일기 쓰기</button></div>
    <p class="muted" style="margin:-6px 0 16px">이번 달 ${n}편 · 🔥 ${streakOf(S.me.id)}일 연속</p>
    ${list.length?`<div class="feed">${list.map(dcard).join("")}</div>`:`<p class="empty">아직 쓴 일기가 없어요. 오늘 첫 일기를 써 보세요.</p>`}`;
}
// 👧 아이들 현황: 아이마다 오늘 · 이번 달 · 작은 달력
function viewKidsStatus(){
  const t=todayStr(), month=t.slice(0,7), [yy,mm]=month.split("-").map(Number), last=new Date(yy,mm,0).getDate(), lead=toDate(`${month}-01`).getDay();
  const kids=sortedProfiles().filter(p=>p.type==="child");
  if(!kids.length) return `<div class="page-h"><h1>아이들 현황</h1></div><p class="empty">우리 가족 탭에서 아이 프로필을 추가하면 여기에서 아이들의 일기 현황을 볼 수 있어요.</p>`;
  return `<div class="page-h"><h1>아이들 현황</h1><span class="muted">${mm}월</span></div><div class="kid-grid">${kids.map(p=>{
    const td=findDiary(p.id,t), st=td?.status==="submitted"?["done","오늘 썼어요 ✏️"]:td?["draft","쓰는 중"]:["none","아직이에요"];
    const mon=S.diaries.filter(d=>d.profileId===p.id && d.status==="submitted" && d.date.startsWith(month));
    const lens=mon.map(d=>countChars(d.text)), avg=lens.length?Math.round(lens.reduce((a,b)=>a+b,0)/lens.length):0;
    const fixes=mon.reduce((s,d)=>s+(d.aiResult?.corrections||[]).filter(c=>!(d.text||"").includes(c.wrong)).length,0);
    let cal=DAYS.map(w=>`<span class="kc-w">${w}</span>`).join("")+(lead?`<span style="grid-column:span ${lead}"></span>`:"");
    for(let i=1;i<=last;i++){ const ds=`${month}-${pad(i)}`, x=mon.find(d=>d.date===ds);
      cal+=`<button class="kc-d ${x?"w":""} ${ds===t?"today":""}" data-act="day-open" data-v="${ds}" ${ds>t?"disabled":""} title="${fmtShort(ds)}${x?" 일기 있음":""}">${i}${x?.stamp?`<i>⭐</i>`:""}</button>`; }
    return `<section class="block kid-card" style="--pc:${p.color||"#1F2A44"}">
      <div class="kid-h">${av(p,40)}<div><b>${esc(p.name)}</b><small class="muted">${esc(gradeName(p.grade))}</small></div><span class="pill ${st[0]}">${st[1]}</span></div>
      <div class="kid-stats"><span>📔 <b>${mon.length}</b>편</span><span>🔥 <b>${streakOf(p.id)}</b>일 연속</span><span>✏️ 평균 <b>${avg}</b>자</span><span>🖍 고친 곳 <b>${fixes}</b></span></div>
      <div class="kid-cal">${cal}</div>
      <p class="muted" style="font-size:12px;margin:8px 0 0">색칠된 날 = 일기 쓴 날 · ⭐ = 칭찬 도장. 날짜를 누르면 그날 가족 일기를 펼쳐 봐요.</p>
    </section>`; }).join("")}</div>`;
}
// 📖 하루 펼쳐보기: 한 날짜의 가족 일기를 나란히
function viewDayOpen(){
  const t=todayStr(), d=S.dayView||t;
  const list=sortedProfiles().map(p=>({p, x:S.diaries.find(y=>y.profileId===p.id && y.date===d && (y.status==="submitted" || y.profileId===S.me.id))})).filter(o=>o.x);
  const nav=`<div class="day-nav"><button class="icon-btn" data-act="day-move" data-v="-1" aria-label="전날">${ic("back")}</button><h1>${fmtLong(d)}</h1><button class="icon-btn flip" data-act="day-move" data-v="1" aria-label="다음 날" ${d>=t?"disabled":""}>${ic("back")}</button>${d!==t?`<button class="btn btn-ghost sm" data-act="day-move" data-v="0">오늘</button>`:""}</div>`;
  if(!list.length) return nav+`<p class="empty">${d===t?"오늘은 아직 아무도 일기를 쓰지 않았어요.":"이날은 가족이 쓴 일기가 없어요."}</p>`;
  return nav+`<div class="day-cols">${list.map(({p,x})=>{ const c=p.color||"#1F2A44", m=MOODS.find(k=>k[0]===x.mood), hs=heartsOf(x).map(id=>prof(id)?.name).filter(Boolean);
    const cs=S.comments.filter(k=>k.diaryId===x.id && !k.deleted).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    return `<article class="day-col" style="--pc:${c}">
      <div class="day-h">${av(p,30)}<b>${esc(p.name)}</b>${moodChip(x.mood,x.weather)}${x.status!=="submitted"?'<span class="pill draft">쓰는 중</span>':""}${x.stamp?`<span class="stamp-mini">${esc(x.stamp)}</span>`:""}</div>
      <div class="day-text">${esc(x.text||"")}</div>
      ${(x.photos||[]).length?`<div class="day-ph">${x.photos.slice(0,4).map(ph=>`<img src="${esc(ph.thumb||ph.url)}" alt="" loading="lazy">`).join("")}</div>`:""}
      ${hs.length?`<p class="day-hearts">❤️ ${hs.map(esc).join(" · ")}</p>`:""}
      ${cs.length?`<ul class="day-cmts">${cs.map(k=>{ const q=prof(k.profileId); return `<li><b style="color:${q?.color||"var(--ink)"}">${esc(q?.name||"")}</b> ${esc(k.text)} <small class="cm-when">${cmtTime(k.createdAt)}</small></li>`; }).join("")}</ul>`:""}
      <button class="link-btn" data-act="open-diary" data-id="${x.id}">💬 자세히 보기 · 댓글 쓰기</button>
    </article>`; }).join("")}</div>`;
}
/* ---------- 주간 · 월간 리포트 (부모만) ----------
   아이마다: 일기 쓴 날 · 글자 수 · 목표 달성 · 다홍펜 고친 곳 · 글자 수 막대 · 자주 틀린 맞춤법 · AI 선생님 총평
   총평은 다홍펜 워커(mode:"report")로 만들고 아이 프로필에 저장해요 (report_기간키). 다시 만들 때만 AI 요금이 들어요 */
function repPeriod(){
  const r=S.rep||(S.rep={mode:"week",off:0}), t=todayStr(), d=toDate(t);
  if(r.mode==="week"){
    const mon=addDays(t, -((d.getDay()+6)%7) + r.off*7), sun=addDays(mon,6);
    const a=toDate(mon), b=toDate(sun);
    return {mode:"week", start:mon, end:sun, key:`w${mon.replace(/-/g,"_")}`, label:`${a.getMonth()+1}월 ${a.getDate()}일 ~ ${b.getMonth()+1}월 ${b.getDate()}일`,
      days:[...Array(7)].map((_,i)=>addDays(mon,i))};
  }
  const m=new Date(d.getFullYear(), d.getMonth()+r.off, 1), y=m.getFullYear(), mo=m.getMonth()+1, last=new Date(y,mo,0).getDate();
  const start=`${y}-${pad(mo)}-01`, end=`${y}-${pad(mo)}-${pad(last)}`;
  return {mode:"month", start, end, key:`m${y}_${pad(mo)}`, label:`${y}년 ${mo}월`, days:[...Array(last)].map((_,i)=>addDays(start,i))};
}
function repStats(p,per){
  const t=todayStr(), goal=penGoalOf(p);
  const list=S.diaries.filter(x=>x.profileId===p.id && x.status==="submitted" && x.date>=per.start && x.date<=per.end).sort((a,b)=>a.date.localeCompare(b.date));
  const lens=list.map(x=>countChars(x.text)), sum=lens.reduce((a,b)=>a+b,0);
  const passed=per.days.filter(d=>d<=t).length;
  const cs=list.flatMap(x=>(x.aiResult?.corrections||[]).map(c=>({...c, fixed:!(x.text||"").includes(c.wrong)})));
  const tally={}; cs.forEach(c=>{ const k=`${c.wrong} → ${c.right}`; tally[k]=(tally[k]||0)+1; });
  const top=Object.entries(tally).sort((a,b)=>b[1]-a[1]).slice(0,5);
  // 막대: 주간은 날마다, 월간은 주마다 평균
  let bars;
  if(per.mode==="week") bars=per.days.map(d=>({lab:`${DAYS[toDate(d).getDay()]}`, v:countChars(list.find(x=>x.date===d)?.text||"")}));
  else { bars=[]; for(let i=0;i<per.days.length;i+=7){ const ds=per.days.slice(i,i+7), ls=list.filter(x=>ds.includes(x.date)).map(x=>countChars(x.text));
    bars.push({lab:`${bars.length+1}주`, v:ls.length?Math.round(ls.reduce((a,b)=>a+b,0)/ls.length):0}); } }
  return {list, n:list.length, passed, avg:list.length?Math.round(sum/list.length):0, max:lens.length?Math.max(...lens):0, goal,
    met:lens.filter(v=>v>=goal).length, fixes:cs.filter(c=>c.fixed).length, self:cs.filter(c=>c.fixed && (c.how||"self")==="self").length, left:cs.filter(c=>!c.fixed).length, top, bars};
}
function viewReport(){
  const per=repPeriod(), r=S.rep, kids=sortedProfiles().filter(p=>p.type==="child");
  const head=`<div class="page-h"><h1>${r.mode==="week"?"주간":"월간"} 리포트</h1>
    <div class="seg rep-mode" role="radiogroup" aria-label="리포트 기간"><label><input type="radio" name="repmode" value="week" ${r.mode==="week"?"checked":""} data-act="rep-mode"><span>주간</span></label><label><input type="radio" name="repmode" value="month" ${r.mode==="month"?"checked":""} data-act="rep-mode"><span>월간</span></label></div></div>
    <div class="rep-nav"><button class="icon-btn" data-act="rep-move" data-v="-1" aria-label="이전">${ic("back")}</button><b>${per.label}</b><button class="icon-btn flip" data-act="rep-move" data-v="1" aria-label="다음" ${r.off>=0?"disabled":""}>${ic("back")}</button>${r.off?`<button class="btn btn-ghost sm" data-act="rep-move" data-v="0">이번 ${r.mode==="week"?"주":"달"}</button>`:""}</div>`;
  if(!kids.length) return head+`<p class="empty">아이 프로필이 있으면 아이마다 리포트가 만들어져요. 우리 가족 탭에서 아이 프로필을 추가해 보세요.</p>`;
  return head+kids.map(p=>{ const s=repStats(p,per), c=p.color||"#1F2A44", mx=Math.max(1,s.goal,...s.bars.map(b=>b.v));
    const saved=p[`report_${per.key}`], busy=S.repBusy===p.id;
    return `<section class="block rep-card" style="--pc:${c}">
      <div class="block-h"><h2>${av(p,30)} ${esc(p.name)} <small class="muted">${esc(gradeName(p.grade))}</small></h2><span class="muted">${per.label}</span></div>
      <div class="rep-stats">
        <div><span>📔 일기 쓴 날</span><b>${s.n}일</b><small>${s.passed}일 중 · 목표 달성 ${s.met}일</small></div>
        <div><span>✏️ 평균 · 최고 글자</span><b>${s.avg}자 · ${s.max}자</b><small>목표 ${s.goal}자</small></div>
        <div><span>👩‍🏫 AI 다홍펜</span><b>고친 곳 ${s.fixes}개</b><small>스스로 ${s.self}개${s.left?` · 남은 곳 ${s.left}개`:""}</small></div>
      </div>
      <div class="rep-two">
        <div class="rep-box"><h3>📊 ${per.mode==="week"?"날마다":"주별 평균"} 글자 수</h3>
          <div class="rep-bars" style="--goal:${Math.round(s.goal/mx*100)}%">${s.bars.map(b=>`<div class="rb"><em>${b.v||"–"}</em><i style="height:${Math.round(b.v/mx*100)}%"></i><span>${b.lab}</span></div>`).join("")}</div>
          <p class="muted" style="font-size:12px;margin:6px 0 0">점선은 목표 ${s.goal}자예요.</p></div>
        <div class="rep-box"><h3>🖍 자주 고친 맞춤법 TOP 5</h3>

          :`<p class="muted" style="margin:0 0 8px">${s.n?"일기를 읽고 칭찬과 성장 이야기를 담은 총평을 써 줘요.":"이 기간에 쓴 일기가 없어서 총평을 만들 수 없어요."}</p>`}

      </div></section>`; }).join("");
}
async function repMakeAI(pid){
  const p=prof(pid), per=repPeriod(), s=repStats(p,per); if(!p || !s.n || S.repBusy) return;
  S.repBusy=pid; render();
  try{
    let data;
    if(DEMO){ await new Promise(r=>setTimeout(r,800));
      data={summary:`${p.name}은(는) 이번 기간에 ${s.n}편의 일기를 썼어요. 하루의 일을 차근차근 적는 힘이 자라고 있어요.`, highlight:`${fmtShort(s.list[s.list.length-1].date)} 일기가 특히 생생했어요.`, tip:"다음엔 그날 느낀 마음을 한 문장 더 적어 보자고 격려해 주세요."}; }
    else {
      const r=await fetch(SPELL_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode:"report",name:p.name,level:gradeLevel(p.grade),period:`${per.mode==="week"?"한 주":"한 달"} (${per.label})`,
        stats:{일기쓴날:s.n,기간일수:s.passed,평균글자:s.avg,최고글자:s.max,목표글자:s.goal,목표달성:s.met,고친곳:s.fixes,스스로고침:s.self,자주고친말:s.top.map(t=>t[0])},
        entries:s.list.map(x=>({date:x.date,title:"",content:x.text||""}))})});
      data=await r.json().catch(()=>null);
      if(!r.ok || !data?.summary) throw new Error(`AI 총평을 만들지 못했어요 (${data?.error||r.status})`);
    }
    const rep={summary:data.summary, highlight:data.highlight||"", tip:data.tip||"", at:Date.now()};
    await B.update(S.gid,"profiles",pid,{[`report_${per.key}`]:rep}); p[`report_${per.key}`]=rep;
  }catch(e){ console.error(e); toast(e.message||"AI 총평을 만들지 못했어요"); }
  finally{ S.repBusy=null; render(); }
}

    return `<li class="cmt">${av(p,32)}<div class="cmt-body">

/* ---------- 🎙 이야기로 일기 쓰기 (5~7세) ----------

// 녹음을 16kHz 한 채널 WAV 로 바꿔요 (어느 휴대폰의 녹음이든 음성 인식이 잘 알아듣게). 안 되면 원래 파일 그대로
async function toWav16k(blob){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC || !window.OfflineAudioContext) return blob;
  const ac=new AC();
  try{
    const src=await ac.decodeAudioData(await blob.arrayBuffer());
    const rate=16000, len=Math.max(1,Math.ceil(src.duration*rate));
    const off=new OfflineAudioContext(1,len,rate), s=off.createBufferSource();
    s.buffer=src; s.connect(off.destination); s.start();
    const pcm=(await off.startRendering()).getChannelData(0);
    const buf=new ArrayBuffer(44+pcm.length*2), v=new DataView(buf), w=(o,str)=>{ for(let i=0;i<str.length;i++) v.setUint8(o+i,str.charCodeAt(i)); };
    w(0,"RIFF"); v.setUint32(4,36+pcm.length*2,true); w(8,"WAVE"); w(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,"data"); v.setUint32(40,pcm.length*2,true);
    for(let i=0;i<pcm.length;i++){ const x=Math.max(-1,Math.min(1,pcm[i])); v.setInt16(44+i*2,x<0?x*0x8000:x*0x7fff,true); }
    return new Blob([buf],{type:"audio/wav"});
  }catch(e){ console.warn("WAV 바꾸기 실패, 원래 녹음으로 보내요",e); return blob; }
  finally{ try{ ac.close(); }catch(e){} }
}
async function talkFetch(url,opt){
  let last;
  for(let i=0;i<2;i++){   // 잠깐 바쁘면 한 번 더
    try{ const r=await fetch(url,opt); const data=await r.json().catch(()=>({}));
      if(r.ok && !data.error) return data;
      if(data.error==="no-ai") throw new Error("음성 인식을 준비하고 있어요. 조금 뒤에 다시 해 주세요.");
      last=new Error(data.error==="too long"?"녹음이 너무 길어요. 3분 안으로 다시 녹음해 주세요.":"AI 선생님이 잠깐 바빠요. 조금 뒤에 다시 눌러 주세요.");
      if(r.status<500 && r.status!==429) break;
    }catch(e){ last=e.message?.includes("준비")?e:new Error("인터넷 연결을 확인하고 다시 눌러 주세요."); if(e.message?.includes("준비")) break; }
  }
  throw last;
}
async function talkMake(textOnly){
  const d=S.draft; if(!d || S.talkBusy) return;
  if((d.talk?.made||0)>=TALK_MAX_MAKE){ toast(`이야기 일기는 일기 하나에 ${TALK_MAX_MAKE}번까지 만들 수 있어요`); return; }
  const demo=DEMO, gone=()=>S.draft!==d;   // 기다리는 동안 다른 화면으로 가면 아무것도 바꾸지 않아요
  try{
    let transcript=d.talk?.transcript||"";
    if(!textOnly){
      if(!d.audio?.blob){ toast("새로 녹음해 주세요"); return; }
      S.talkBusy="🎧 목소리를 글자로 바꾸고 있어요…"; render();
      if(demo){ await wait(900); transcript="오늘 뭐가 제일 재미있었어? 놀이터에서 미끄럼틀 탔어. 누구랑 탔어? 지우랑. 엄청 빨랐어. 기분이 어땠어? 신났어! 또 가고 싶어."; }
      else transcript=String((await talkFetch(SPELL_API+"/transcribe",{method:"POST",headers:{"Content-Type":"audio/wav"},body:await toWav16k(d.audio.blob)})).text||"").trim();
      if(gone()) return;
      if(countChars(transcript)<4) throw new Error("말소리를 잘 알아듣지 못했어요. 휴대폰을 조금 더 가까이 두고 또박또박 다시 녹음해 볼까요?");
    }
    S.talkBusy="✏️ AI 선생님이 아이가 한 말로 일기를 쓰고 있어요…"; render();
    const r = demo ? (await wait(900), {dialog:[{who:"어른",text:"오늘 뭐가 제일 재미있었어?"},{who:"아이",text:"놀이터에서 미끄럼틀 탔어."},{who:"어른",text:"누구랑 탔어?"},{who:"아이",text:"지우랑. 엄청 빨랐어."},{who:"어른",text:"기분이 어땠어?"},{who:"아이",text:"신났어! 또 가고 싶어."}],
        diary:"나는 오늘 놀이터에서 지우랑 미끄럼틀을 탔다. 미끄럼틀이 엄청 빨랐다. 정말 신났다. 또 가고 싶다.", mood:"great", note:"아이가 말한 놀이터 이야기로 네 문장을 썼어요. (체험 모드 예시)"})
      : await talkFetch(SPELL_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode:"talk",transcript,level:gradeLevel(S.me.grade),name:S.me.name})});
    if(gone()) return;
    S.talkBusy=null;
    const prevAI=d.talk?.diary||"", made=(d.talk?.made||0)+1;
    d.talk={transcript:transcript.slice(0,6000),dialog:(r.dialog||[]).slice(0,80).map(t=>({who:t.who==="아이"?"아이":"어른",text:String(t.text||"").slice(0,400)})),note:String(r.note||""),diary:String(r.diary||""),made,at:Date.now()};
    if(r.diary){
      const typed=d.text.trim() && d.text!==prevAI;
      if(!typed || confirm("지금 일기 칸에 쓴 글을 AI 선생님이 만든 일기로 바꿀까요?\n(취소를 누르면 쓴 글은 그대로 두고, 만든 일기는 이야기 칸에서 볼 수 있어요)")) d.text=r.diary;
      if(!d.mood && MOODS.some(m=>m[0]===r.mood)) d.mood=r.mood;
    }
    render(); toast(r.diary?"일기를 만들었어요. 읽어 보고 고쳐 주세요":"이번 이야기로는 일기를 만들지 못했어요");
    document.getElementById("w-text")?.scrollIntoView({behavior:"smooth",block:"center"});
  }catch(e){ if(gone()) return; S.talkBusy=null; render(); toast(e.message||"문제가 생겼어요. 다시 눌러 주세요"); }
}

  else if(left.length){ head=`🖍 형광펜으로 칠한 곳이 ${left.length}군데 있어요`; sub=`<p>틀려도 괜찮아요! 고치면서 실력이 쑥쑥 자라요 🌱 일기 칸에 <mark class="pen-x">노란색</mark>으로 칠한 곳을 찾아 스스로 고쳐 보세요. 잘 모르겠으면 💡 정답 보기를 눌러요. 다 고쳐야 제출할 수 있어요!</p>`; }

          : `<button class="pen-mini" data-act="pen-reveal" data-i="${i}">💡 정답 보기</button>`}</div>`
      : how==="kept" ? `<span class="pen-soft">🙆 그대로 두었어요 · ${pair(er)}</span>`
      : `<span class="pen-good">${how==="self"?"👍 스스로 고쳤어요!":how==="other"?"✏️ 다른 말로 바꿨어요":"✅ 고쳤어요"}</span> <span class="pen-soft">${pair(er)}</span>${p.auto&&er.why?`<br><small class="pen-soft">${esc(er.why)}</small>`:""}`}</li>`; }).join("");
  return `<section class="pen" id="pen"><div class="pen-h"><h3>${head}</h3>${p.checks<PEN_MAX_CHECK&&(left.length||!errs.length)?call("🔁 다시 검사"):""}</div>

}
// 일기 칸 위에 형광펜 칠하기: 노랑 = 고칠 곳, 초록 = 고친 곳
function penHL(){
  const hl=document.getElementById("w-hl"), ta=document.getElementById("w-text"); if(!hl||!ta||!S.draft) return;
  const text=S.draft.text, spans=[];
  (S.draft.pen?.errors||[]).forEach(er=>{
    let i=penAt(er,text), len=er.wrong.length, cls="pen-x";
    if(i>=0 && er.kept) return;
    if(i<0 && er.applied){ i=er.at!=null&&text.startsWith(er.right,er.at)?er.at:text.indexOf(er.right); len=er.right.length; cls="pen-ok"; }
    if(i>=0 && !spans.some(s=>i<s.e && i+len>s.i)) spans.push({i,e:i+len,cls});
  });
  spans.sort((a,b)=>a.i-b.i);
  let h="", pos=0;
  spans.forEach(s=>{ h+=esc(text.slice(pos,s.i))+`<mark class="${s.cls}">${esc(text.slice(s.i,s.e))}</mark>`; pos=s.e; });
  hl.innerHTML=h+esc(text.slice(pos))+" ";
  ta.style.height="auto"; ta.style.height=ta.scrollHeight+"px";
}
function refreshPen(){
  const d=S.draft; if(!d) return;

    if(er._left && !L && !er.applied && !er.kept && d.text.includes(er.right)) toast(PRAISE_SELF[Math.floor(Math.random()*PRAISE_SELF.length)]);
    er._left=L; });

}
function penApplyOne(er){

}

function buildQuiz(mode){
  const ws=myWords();
  const ranked=[...ws].sort((a,b)=>((a.correctStreak||0)>=3)-((b.correctStreak||0)>=3) || (b.wrongCount||0)-(a.wrongCount||0) || (a.lastSeen||0)-(b.lastSeen||0));
  const pool=shuffle(ranked.slice(0,Math.max(5,Math.ceil(ranked.length/2))));
  const qs=[];
  for(let i=0;i<5;i++){
    const w=pool[i%pool.length];
    const kind = mode==="mix" ? (i%2===0?"mc":"ox") : mode;
    if(kind==="mc"){
      let others=[...new Set([...(w.distractors||[]),...variants(w.right),...variants(w.wrong)])].filter(x=>x && x!==w.right && x!==w.wrong);
      if(others.length<2) others=[...new Set([...others,...others.flatMap(variants)])].filter(x=>x && x!==w.right && x!==w.wrong);
      const opts=shuffle([w.right,w.wrong,...shuffle(others).slice(0,2)]);
      qs.push({kind,w,opts,answer:w.right});
    } else {
      const show = Math.random()<.5 ? w.right : w.wrong;
      qs.push({kind,w,show,answer: show===w.right ? "O" : "X"});
    }
  }
  return {qs,i:0,picked:null,score:0,done:false};
}
function viewQuizRun(){

  const cur=q.qs[q.i], w=cur.w, picked=q.picked;
  const ctx = w.context || "";
  let body="";
  if(cur.kind==="mc"){

    body = `<p class="q-text">${prompt}</p><div class="q-opts">${cur.opts.map((o,i)=>{ let cls=""; if(picked!==null){ if(o===cur.answer) cls="right"; else if(i===picked) cls="wrong"; }

  } else {

    body = `<p class="q-text">맞춤법이 맞으면 O, 틀리면 X를 골라요.<span class="q-ctx">${esc(shown)}</span></p>
      <div class="q-ox">${["O","X"].map(o=>{ let cls=""; if(picked!==null){ if(o===cur.answer) cls="right"; else if(o===picked) cls="wrong"; }
        return `<button class="q-opt ${cls}" data-act="quiz-answer" data-v="${o}" ${picked!==null?"disabled":""} aria-label="${o==="O"?"맞아요":"틀려요"}">${o}</button>`; }).join("")}</div>`;
  }
  let fb="";
  if(picked!==null){
    const ok = cur.kind==="mc" ? cur.opts[picked]===cur.answer : picked===cur.answer;
    fb = `<div class="q-fb" role="status"><strong>${ok?"정답이에요!":"아쉬워요, 다시 기억해 둬요."}</strong>'${esc(w.wrong)}'가 아니라 '${esc(w.right)}'가 맞아요. ${esc(w.explain||"")}</div>
      <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn btn-primary" data-act="quiz-next">${q.i===q.qs.length-1?"결과 보기":"다음 문제"}</button></div>`;
  }
  return `<div class="quiz"><div class="sub-top"><button class="btn btn-ghost sm" data-act="quiz-exit">${ic("back")}그만 풀기</button><span class="muted">${q.i+1} / ${q.qs.length}</span></div>

}

function csvCell(v){ let s=String(v??""); if(/^[=+\-@\t\r]/.test(s)) s="'"+s; return /[",\n\r]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; }

}

const dupBanner = () => { if(!isParent() || S.sub) return ""; const d=dupParents(); if(!d.length) return "";

async function mergeSameName(name){
  await reloadAll();
  const same=S.profiles.filter(p=>p.type==="parent" && String(p.name||"").trim()===name);
  if(same.length<2){ render(); return; }
  const cnt=p=>S.diaries.filter(d=>d.profileId===p.id).length;
  const keep=[...same].sort((a,b)=>cnt(b)-cnt(a)||(a.createdAt||0)-(b.createdAt||0))[0], others=same.filter(p=>p.id!==keep.id);
  const moved=others.reduce((s,o)=>s+cnt(o),0);
  if(!confirm(`'${name}' 프로필 ${same.length}개를 하나로 합칠까요?\n\n· 따로 있던 일기 ${moved}편과 댓글 · 일정 · 하트가 '${name}' 프로필 하나로 모여요. 같은 날 쓴 일기는 한 편으로 이어 붙여요.\n· 앞으로 구글 · 카카오 어느 쪽으로 들어와도 같은 '${name}' 프로필이 열려요.\n· 합친 뒤에는 되돌릴 수 없어요.`)) return;
  const uids=[...new Set([...(keep.uids||[]), ...others.flatMap(o=>[o.uid,...(o.uids||[])])])].filter(x=>x && x!==keep.uid);
  const kinds=[...new Set([...(keep.mergedKinds||[]), ...others.flatMap(o=>o.mergedKinds||[])])];
  await B.update(S.gid,"profiles",keep.id,{uids,mergedKinds:kinds});
  for(const o of others){ await mergeProfiles(o.id,keep.id); await reloadAll(); }
  if(others.some(o=>o.id===S.me?.id)){ ls.set("iinote-pid-"+S.gid,keep.id); }
  S.me=prof(S.me?.id)||prof(keep.id)||S.me; render();
  toast(`'${name}' 프로필을 하나로 합쳤어요`);
}

const $app=document.getElementById("app");

  else if(S.phase==="landing") $app.innerHTML=viewLanding();

  else if(S.phase==="picker") $app.innerHTML=viewPicker();
  else {
    // 공부방 일기 단추 등에서 ?write 로 들어오면: 프로필이 정해진 뒤 바로 오늘 일기 쓰는 칸으로
    if(S.wantWrite && S.phase==="app" && S.me && !S.sub){ S.wantWrite=false; loadDraft(todayStr()); S.sub={type:"write"}; history.replaceState(null,"",location.pathname); }

async function addPhotos(files){
  const d=S.draft, room=MAX_PHOTOS-d.photos.length;
  if(room<=0){ toast(`사진은 ${MAX_PHOTOS}장까지 넣을 수 있어요`); return; }
  if(files.length>room) toast(`사진은 ${MAX_PHOTOS}장까지라 앞의 ${room}장만 넣을게요`);
  const pick=files.slice(0,room).filter(f=>f.type.startsWith("image/") || /\.(hei[cf])$/i.test(f.name||""));
  await guard(async()=>{ for(let i=0;i<pick.length;i++){
    toast(`사진 줄이는 중… (${i+1}/${pick.length})`);
    const {big,thumb}=await makePhotoPair(pick[i]);
    d.photos.push({id:rid(),blob:big.blob,tblob:thumb.blob,url:URL.createObjectURL(big.blob),thumb:URL.createObjectURL(thumb.blob),w:big.w,h:big.h}); } });
  render();
}
function addAudioFile(f){
  if(f.size>MAX_AUDIO_MB*1024*1024){ toast(`소리 파일은 ${MAX_AUDIO_MB}MB까지 올릴 수 있어요`); return; }
  const d=S.draft; if(d.audio?.path) d.removed.push(d.audio.path);
  d.audio={id:rid(),blob:f,url:URL.createObjectURL(f),duration:0,type:f.type}; render();
}
async function recStart(talk){
  if(!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder==="undefined"){ toast("이 브라우저에서는 녹음이 안 돼요. 소리 파일을 올려 주세요"); return; }
  let stream; try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ toast("마이크를 쓸 수 없어요. 마이크 권한을 확인해 주세요"); return; }
  const mime=["audio/webm;codecs=opus","audio/mp4","audio/webm"].find(m=>MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m))||"";
  const mr=new MediaRecorder(stream, mime?{mimeType:mime,audioBitsPerSecond:64000}:undefined);
  const chunks=[], t0=Date.now(), d0=S.draft;   // 녹음을 시작한 그 일기에만 붙여요
  const timer=setInterval(()=>{ const sec=Math.floor((Date.now()-t0)/1000); const el=document.getElementById("rec-t"); if(el) el.textContent=mmss(sec);
    const bar=document.getElementById("rec-bar"); if(bar) bar.style.width=Math.min(100,sec/MAX_AUDIO_SEC*100)+"%";
    if(sec>=MAX_AUDIO_SEC && mr.state!=="inactive") mr.stop(); },500);
  mr.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
  mr.onstop=()=>{ stream.getTracks().forEach(t=>t.stop()); clearInterval(timer); S.rec=null; if(!S.draft || S.draft!==d0){ render(); return; }
    const blob=new Blob(chunks,{type:mr.mimeType||mime||"audio/webm"}), d=S.draft;
    if(d.audio?.path) d.removed.push(d.audio.path);
    d.audio={id:rid(),blob,url:URL.createObjectURL(blob),duration:Math.round((Date.now()-t0)/1000),type:blob.type};
    // 이야기 녹음이면: 새 이야기이니 예전 대화 기록은 비우고, 바로 글로 바꿔 일기를 만들어요
    if(talk){ d.talk=d.talk?.made?{made:d.talk.made}:null; /* 새 이야기: 대화 기록은 비우고 만든 횟수는 이어서 세요 */ render(); if(blob.size>2000) talkMake(); else toast("녹음이 너무 짧아요. 다시 해 볼까요?"); }
    else render(); };
  S.rec={mr,talk:!!talk}; mr.start(1000); render();
}
async function uploadPending(d){
  const base=`groups/${S.gid}/diaries/${d.id}`;
  const out=[];
  for(const p of d.photos){
    if(p.blob){ const r=await B.uploadMedia(`${base}/${p.id}.jpg`,p.blob);
      const t=p.tblob ? await B.uploadMedia(`${base}/${p.id}_t.jpg`,p.tblob) : null;
      out.push({id:p.id,url:r.url,path:r.path,thumb:t?.url||"",thumbPath:t?.path||"",w:p.w||0,h:p.h||0,...(p.fav?{fav:p.fav}:{})}); }
    else out.push({id:p.id,url:p.url,path:p.path||"",thumb:p.thumb||"",thumbPath:p.thumbPath||"",w:p.w||0,h:p.h||0,...(p.fav?{fav:p.fav}:{})});
  }
  d.photos=out;
  if(d.audio?.blob){ const t=d.audio.blob.type||""; const ext=t.includes("mp4")||t.includes("m4a")?"m4a":t.includes("mpeg")?"mp3":t.includes("wav")?"wav":"webm";
    const r=await B.uploadMedia(`${base}/${d.audio.id}.${ext}`,d.audio.blob);
    d.audio={id:d.audio.id,url:r.url,path:r.path,duration:d.audio.duration||0,type:t}; }
  for(const path of d.removed) await B.deleteMedia(path);
  d.removed=[];
}

/* ---------- 지우기: 일기 · 아이 프로필 · 내 계정 ---------- */
async function removeDiary(gid,d,comments){
  for(const ph of d.photos||[]){ if(ph.path) await B.deleteMedia(ph.path); if(ph.thumbPath) await B.deleteMedia(ph.thumbPath); }
  if(d.audio?.path) await B.deleteMedia(d.audio.path);
  await Promise.all(comments.filter(c=>c.diaryId===d.id).map(c=>B.remove(gid,"comments",c.id)));
  await B.remove(gid,"diaries",d.id);
}
// pids 프로필이 남긴 기록을 모두 지워요. all이면 그 가족의 기록 전부를 지워요.
async function wipeProfiles(gid,pids,all){
  const names=["profiles","diaries","comments","schedules","links","quizWords","aiReports"];
  const [profiles,diaries,comments,schedules,links,quizWords,aiReports]=await Promise.all(names.map(c=>B.list(gid,c)));
  const has=id=>all||pids.includes(id);
  const gone=diaries.filter(d=>has(d.profileId));
  for(const d of gone) await removeDiary(gid,d,comments);
  const goneIds=new Set(gone.map(d=>d.id));
  const rm=(c,list)=>Promise.all(list.map(x=>B.remove(gid,c,x.id)));
  await rm("comments",comments.filter(c=>!goneIds.has(c.diaryId) && has(c.profileId)));
  await rm("schedules",schedules.filter(s=>has(s.profileId)));
  await rm("links",links.filter(l=>has(l.createdBy)));
  await rm("quizWords",quizWords.filter(w=>has(w.profileId)));
  await rm("aiReports",aiReports.filter(r=>has(r.profileId)));
  // 가족 채팅: 그 사람이 보낸 메시지와 사진
  try{ const chats=(await B.list(gid,"chats")).filter(m=>has(m.profileId));
    for(const m of chats){ if(m.photo?.path) await B.deleteMedia(m.photo.path); if(m.photo?.thumbPath) await B.deleteMedia(m.photo.thumbPath); }
    await rm("chats",chats); }catch(e){ console.warn(e); }
  await rm("profiles",profiles.filter(p=>has(p.id)));
}
/* ---------- 구글 · 카카오 로그인 하나로 합치기 ----------
   같은 사람이 구글과 카카오로 따로 가입하면 파이어베이스 계정이 둘이라 프로필도 둘이 돼요.
   다른 쪽 로그인을 확인한 뒤, 그 계정도 지금 프로필을 쓰게 하고(uids) 기록은 지금 프로필로 옮겨요. */
const loginName = kind => kind==="kakao" ? "카카오" : "구글";
async function mergeOtherLogin(kind,cred){
  if(DEMO){ toast("체험 모드에서는 로그인을 합칠 수 없어요"); return; }
  const o=await B.otherLogin(kind,cred);
  try{
    if(ownsProfile(S.me,o.uid)){ toast("이미 하나로 합쳐져 있어요"); return; }
    await reloadAll(); const me=prof(S.me.id);
    const other=S.profiles.find(p=>p.id!==me.id && ownsProfile(p,o.uid));
    if(other && other.type!==me.type) throw new Error("어른 프로필과 아이 프로필은 합칠 수 없어요. 아이 프로필은 '우리 가족 설정'에서 지워 주세요.");
    const cnt=c=>S[c].filter(x=>x.profileId===other?.id).length;
    const msg = other
      ? `'${other.name}'(${loginName(kind)}로 들어온 프로필)을 지금의 '${me.name}'과 하나로 합칠까요?\n\n· ${other.name}의 일기 ${cnt("diaries")}편, 댓글 ${cnt("comments")}개, 일정 ${cnt("schedules")}개가 '${me.name}'으로 옮겨져요.\n· 앞으로 구글 · 카카오 어느 쪽으로 들어와도 같은 '${me.name}'이에요.\n· 합친 뒤에는 되돌릴 수 없어요.`
      : `${loginName(kind)}로 들어와도 '${me.name}' 프로필이 열리게 할까요?`;
    if(!confirm(msg)) return;
    const uids=[...new Set([...(me.uids||[]), o.uid, ...(other?[other.uid,...(other.uids||[])]:[])])].filter(x=>x && x!==me.uid);
    const kinds=[...new Set([...(me.mergedKinds||[]), kind])];
    await B.update(S.gid,"profiles",me.id,{uids,mergedKinds:kinds});
    const g=await B.getGroup(S.gid);
    await B.updateGroup(S.gid,{memberUids:[...new Set([...(g.memberUids||[]), o.uid])]});
    await o.addUserGroup(S.gid);
    if(other) await mergeProfiles(other.id,me.id);
  } finally { await o.done(); S.mergeKind=null; }
  await reloadAll(); S.me=prof(S.me.id)||S.me; render();
  toast(`하나로 합쳤어요. 이제 구글 · 카카오 어느 쪽으로 들어와도 '${S.me.name}'이에요`);
}
// 기록 옮기기: from 프로필의 일기 · 댓글 · 일정 · 즐겨찾기 · 받아쓰기 · 하트 · 도장을 to 프로필로, 그다음 from 프로필 지우기
async function mergeProfiles(from,to){
  const gid=S.gid;
  for(const d of S.diaries){
    const up={};
    if(d.hearts?.[from]){ const h={...d.hearts}; delete h[from]; h[to]=true; up.hearts=h; }
    if(d.stampBy===from) up.stampBy=to;
    if(d.profileId===from){
      const same=S.diaries.find(x=>x.profileId===to && x.date===d.date);
      if(same){ // 같은 날 둘 다 썼으면 한 편으로 합쳐요
        const h={...(same.hearts||{}),...(up.hearts||d.hearts||{})}; delete h[from];
        await B.update(gid,"diaries",same.id,{text:[same.text,d.text].filter(Boolean).join("\n\n"),photos:[...(same.photos||[]),...(d.photos||[])].slice(0,MAX_PHOTOS),tags:[...new Set([...(same.tags||[]),...(d.tags||[])])],hearts:h,audio:same.audio||d.audio||null,updatedAt:Date.now()});
        for(const c of S.comments.filter(c=>c.diaryId===d.id)) await B.update(gid,"comments",c.id,{diaryId:same.id});
        await B.remove(gid,"diaries",d.id); continue; }
      up.profileId=to;
    }
    if(Object.keys(up).length) await B.update(gid,"diaries",d.id,up);
  }
  for(const c of S.comments.filter(x=>x.profileId===from)) await B.update(gid,"comments",c.id,{profileId:to});
  for(const s of S.schedules.filter(x=>x.profileId===from)) await B.update(gid,"schedules",s.id,{profileId:to});
  for(const l of S.links.filter(x=>x.createdBy===from)) await B.update(gid,"links",l.id,{createdBy:to});
  for(const w of S.quizWords.filter(x=>x.profileId===from)) await B.update(gid,"quizWords",w.id,{profileId:to});
  try{ for(const r of (await B.list(gid,"aiReports")).filter(x=>x.profileId===from)) await B.update(gid,"aiReports",r.id,{profileId:to}); }catch(e){}
  try{ for(const m of (await B.list(gid,"chats")).filter(x=>x.profileId===from)) await B.update(gid,"chats",m.id,{profileId:to}); }catch(e){}
  await B.remove(gid,"profiles",from);
}
// 가족에 처음 들어올 때: 전에 다른 로그인으로 들어온 적 있으면 그 프로필로 바로 들어가요 (초대 코드 · 새 프로필 없이)
async function joinWithOtherLogin(kind){

    const ud=await o.getUser()||{};

function deleteMyAccount(){
  const word=prompt("내 계정과 기록을 지우면 되돌릴 수 없어요.\n\n· 내 프로필, 내가 쓴 일기 · 사진 · 소리 · 댓글 · 일정 · 즐겨찾기가 지워져요.\n· 가족 그룹에서 나가요.\n· 가족에 나 혼자 남아 있었다면 그 가족의 기록이 모두 지워져요.\n\n계속하려면 '지우기'라고 써 주세요.");
  if(word===null) return;
  if(word.trim()!=="지우기"){ toast("'지우기'라고 써야 지워져요"); return; }
  guard(async()=>{
    await B.reauth();
    toast("지우고 있어요. 잠시만 기다려 주세요");
    const uid=S.user.uid, gids=[...new Set([...(S.userDoc?.groupIds||[]),S.gid].filter(Boolean))];
    for(const gid of gids){
      const g=await B.getGroup(gid).catch(()=>null); if(!g) continue;
      const alone=!(g.memberUids||[]).some(u=>u!==uid);
      const mineP=(await B.list(gid,"profiles")).filter(p=>ownsProfile(p,uid)), mine=[];
      for(const p of mineP){ // 구글 · 카카오를 합친 프로필이면, 이 로그인만 빼고 프로필과 기록은 남겨요
        const rest=[p.uid,...(p.uids||[])].filter(x=>x&&x!==uid);
        if(rest.length) await B.update(gid,"profiles",p.id,{uid:rest[0],uids:rest.slice(1)}); else mine.push(p.id); }
      await wipeProfiles(gid,mine,alone);
      await B.leaveGroup(gid,uid);
      ls.del("iinote-pid-"+gid);
    }
    await B.deleteUserDoc(uid);
    S.me=null; S.group=null; S.gid=null; S.sub=null;
    await B.deleteAccount();
    toast("계정과 기록을 모두 지웠어요");
  });
}

/* 예전 가족일기장에서 가져오기: 예전 일기장 계정으로 한 번 더 로그인해서 diary 모음을 읽어 와요.
   가져온 일기 · 댓글에는 importKey를 적어 두어서, 다시 눌러도 새로 쓴 것만 들어와요. */
async function readOldDiaries(){
  const V="10.12.2";
  const A = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const AU = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
  const F = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const app = A.getApps().find(a=>a.name==="old") || A.initializeApp(OLD_DIARY_CONFIG,"old");
  const auth = AU.getAuth(app), p = new AU.GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"});
  try{
    await AU.signInWithPopup(auth,p);
    const s = await F.getDocs(F.collection(F.getFirestore(app),"diary"));
    return s.docs.map(d=>({id:d.id,...d.data()}));
  }catch(e){ throw new Error(`예전 일기장을 읽지 못했어요 (${e.code||e.message})`); }
  finally{ AU.signOut(auth).catch(()=>{}); }
}
const OLD_MOOD = {"😆":"great","🥰":"love","😊":"good","😐":"calm","😢":"sad","😠":"angry","😴":"tired"};
const msOf = (t,fb) => t?.toMillis ? t.toMillis() : typeof t==="number" ? t : fb;
// 예전 일기장의 다홍펜(AI 맞춤법) 기록 → iinote의 aiResult 모양으로. 어떻게 고쳤는지(how)는 설명 칸에
const OLD_HOW = {self:"스스로 찾아 고쳤어요", hint:"힌트를 보고 고쳤어요", ai:"AI 선생님이 고쳐 줬어요", other:"다른 말로 고쳐 썼어요"};
function oldAiResult(o){
  if(!o.spellChecked && !(o.spellFixes||[]).length) return null;
  const fb=o.spellFeedback||{}, cs=(o.spellFixes||[]).filter(f=>f.wrong&&f.right)
    .map(f=>({wrong:f.wrong,right:f.right,explain:[OLD_HOW[f.how],f.kind].filter(Boolean).join(" · "),context:""}));
  return {praise:fb.praise||"", feedback:fb.cheer||(cs.length?`틀린 곳 ${cs.length}개를 고쳤어요.`:"틀린 곳 없이 잘 썼어요."),
    corrections:cs, checkedAt:msOf(o.updatedAt,Date.now()), imported:true};
}
async function importOld(fd){
  const map={}; OLD_PEOPLE.forEach(([k])=>{ if(fd[k]) map[k]=fd[k]; });
  if(!Object.keys(map).length){ toast("가져올 사람을 하나 이상 골라 주세요"); return; }
  const old=(await readOldDiaries()).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  toast("가져오는 중이에요…");
  const have=new Map(S.diaries.filter(d=>d.importKey).map(d=>[d.importKey,d]));
  const haveC=new Set(S.comments.map(c=>c.importKey).filter(Boolean));
  let nd=0, nu=0, nc=0, nq=0;
  for(const o of old){
    const pid=map[o.author]; if(!pid || !o.date || !String(o.content||"").trim()) continue;
    const key="old:"+o.id, at=msOf(o.createdAt, new Date(o.date+"T20:00:00").getTime()), up=msOf(o.updatedAt,at);
    const title=String(o.title||"").trim(), ai=oldAiResult(o);
    // 질문에 답한 일기는 질문을 맨 위에
    const body={mood:OLD_MOOD[o.mood]||"", title, text:(o.question?`Q. ${o.question}\n\n`:"")+o.content,
      tags:[...new Set(extractTags(title+" "+o.content))].slice(0,20), aiChecked:!!ai, aiResult:ai, importAt:up};
    const ex=have.get(key); let did=ex?.id;
    if(!ex){
      did=await B.add(S.gid,"diaries",{profileId:pid,date:o.date,status:"submitted",photos:[],audio:null,location:null,createdAt:at,updatedAt:up,importKey:key,...body});
      nd++;
    }else if(up>(ex.importAt||0)){
      // 예전 일기장에서 고쳤거나, 다홍펜 검사를 다시 받은 일기 → 새 내용으로 바꿔요
      await B.update(S.gid,"diaries",did,{...body,updatedAt:up}); nu++;
    }
    // 예전 일기장의 칭찬 도장 · 하트도 (iinote에서 누른 하트는 그대로 두고 합쳐요)
    const cur=ex?.hearts||{}, add=Object.keys(o.hearts||{}).filter(k=>o.hearts[k] && map[k] && !cur[map[k]]).map(k=>map[k]);
    if(add.length || (o.stamp && o.stamp!==ex?.stamp))
      await B.update(S.gid,"diaries",did,{hearts:{...cur,...Object.fromEntries(add.map(id=>[id,true]))}, ...(o.stamp?{stamp:o.stamp}:{})});
    for(const c of o.comments||[]){
      const ck=`${key}:${c.at}:${c.by}`, cp=map[c.by];
      if(!cp || !c.text || haveC.has(ck)) continue;
      await B.add(S.gid,"comments",{diaryId:did,parentId:null,profileId:cp,text:c.text,createdAt:c.at||Date.now(),importKey:ck});
      haveC.add(ck); nc++;
    }
    // 아이 일기에서 고친 낱말은 받아쓰기 퀴즈에도 (이미 있으면 건너뛰기)
    if(prof(pid)?.type==="child") for(const f of ai?.corrections||[]){
      if(S.quizWords.some(w=>w.profileId===pid && w.wrong===f.wrong && w.right===f.right)) continue;
      const w={profileId:pid,wrong:f.wrong,right:f.right,explain:f.explain,distractors:[],context:contextOf(o.content,f.right),wrongCount:1,correctStreak:0,createdAt:up,importKey:key};
      await B.add(S.gid,"quizWords",w); S.quizWords.push(w); nq++;
    }
  }
  await reload("diaries"); await reload("comments"); await reload("quizWords"); render();
  toast(nd||nu||nc||nq?`새 일기 ${nd}편 · 고친 일기 ${nu}편 · 댓글 ${nc}개 · 퀴즈 낱말 ${nq}개를 가져왔어요`:"새로 가져올 일기가 없어요");
}

async function saveDiary(status){

  // 다홍펜: 노란 형광펜이 남아 있으면 제출 못 해요 (선생님이 쉬는 중이면 그냥 제출 가능)
  if(S.rec||S.talkBusy){ toast("녹음이나 일기 만들기가 끝나면 저장할 수 있어요"); return; }
  // 이야기로 만든 일기(5~7세)는 엄마 · 아빠가 확인하고 저장하니 글자 수 · 다홍펜 조건 없이 제출돼요
  if(status==="submitted" && child && !d.talk?.diary){
    const goal=penGoalOf(S.me), n=countChars(d.text);

    if(left){ toast(`✏️ 노란 형광펜 ${left}군데만 고치면 제출할 수 있어요! 거의 다 왔어요 💪`); document.getElementById("pen")?.scrollIntoView({behavior:"smooth",block:"nearest"}); return; }
    if(!d.pen && !S.penFailed && !confirm("AI 다홍펜 선생님께 아직 보여 주지 않았어요. 그래도 제출할까요?")) return;
  }
  const pend=document.getElementById("w-tag")?.value; if(pend){ const t=cleanTag(pend); if(t && !d.tags.includes(t)) d.tags.push(t); }
  const data={profileId:S.me.id,date:d.date,mood:d.mood,weather:d.weather||"",prompt:d.prompt||"",title:d.title.trim(),text:d.text,status,updatedAt:Date.now()};
  if(d.pen){ data.aiChecked=true; data.aiResult=penResult(d); }
  else if(d.aiChecked){ data.aiChecked=true; data.aiResult=d.aiResult; }
  if(!d.id){ data.createdAt=Date.now(); d.id=await B.add(S.gid,"diaries",{...data,photos:[],audio:null,location:null,tags:[]}); }
  if(d.photos.some(p=>p.blob) || d.audio?.blob) toast("사진과 소리를 올리고 있어요");
  await uploadPending(d);
  Object.assign(data,{ photos:d.photos, audio:d.audio||null, location:d.location||null, talk:d.talk||null,
    tags:[...new Set([...d.tags,...extractTags(d.title+" "+d.text)])].slice(0,20) });
  await B.update(S.gid,"diaries",d.id,data);
  d.status=status;
  await reload("diaries");
  if(status==="submitted"){ toast(child?"제출했어요":"올렸어요"); S.sub={type:"diary",id:d.id}; S.draft=null; render(); window.scrollTo(0,0); }
  else { toast("임시 저장했어요"); render(); }
}

async function penCheck(){
  const d=S.draft, g=S.me.grade, goal=penGoalOf(S.me), n=countChars(d.text);
  if(S.penBusy) return;
  if(n<goal){ toast(`${goal}자를 다 쓰면 AI 다홍펜 선생님을 부를 수 있어요! (지금 ${n}자)`); return; }
  if(d.pen && d.pen.checks>=PEN_MAX_CHECK){ toast(`다홍펜 검사는 일기 하나에 ${PEN_MAX_CHECK}번까지예요`); return; }
  S.penBusy=true; S.penFailed=false; refreshPen();
  try{
    const data=await callPen(d.text), prev=d.pen, text=d.text;
    let errors=(data.errors||[]).filter(e=>e && e.wrong && e.right && e.wrong!==e.right)
      .map(e=>({wrong:String(e.wrong),right:String(e.right),kind:String(e.kind||""),hint:String(e.hint||""),why:String(e.why||"")}));
    const found=errors.slice();   // 받아쓰기 퀴즈에 넣을 것 (다홍펜이 찾은 낱말만)
    errors.push(...penSpace(text,errors)); errors.push(...penPeriod(text,errors));
    // 앞 검사에서 고친 기록은 그대로 남겨요 (같은 것은 한 번만)
    const kept=(prev?.errors||[]).filter(er=>penAt(er,text)<0 || er.kept), seen=new Set(errors.map(e=>e.wrong+"→"+e.right));
    errors=[...kept.filter(e=>!seen.has(e.wrong+"→"+e.right)), ...errors];
    errors.forEach(er=>{ er._left=penLeft(er,text); });
    d.pen={praise:data.praise||"", cheer:data.cheer||"", errors, checks:(prev?.checks||0)+1, original:prev?.original||text, auto:penAuto(g)};
    if(d.pen.auto){ for(const er of errors) if(penAt(er,d.text)>=0){ penApplyOne(er); er.auto=true; er._left=false; } }
    // 검사 결과를 일기에 바로 붙여 둬요 (나갔다 와도 그대로)
    const base={profileId:S.me.id,date:d.date,mood:d.mood,weather:d.weather||"",prompt:d.prompt||"",title:d.title.trim(),text:d.text,status:d.status==="submitted"?"submitted":"draft",updatedAt:Date.now(),aiChecked:true,aiResult:penResult(d)};
    if(d.id) await B.update(S.gid,"diaries",d.id,base);
    else { base.createdAt=Date.now(); d.id=await B.add(S.gid,"diaries",{...base,photos:[],audio:null,location:null,tags:[]}); d.status="draft"; }
    d.aiChecked=true; d.aiResult=base.aiResult;
    for(const c of found){
      const ctx=contextOf(text,c.wrong), ex=S.quizWords.find(w=>w.profileId===S.me.id && w.wrong===c.wrong && w.right===c.right);
      if(ex) await B.update(S.gid,"quizWords",ex.id,{wrongCount:(ex.wrongCount||1)+1,correctStreak:0,context:ctx||ex.context||"",explain:c.why||ex.explain||""});
      else await B.add(S.gid,"quizWords",{profileId:S.me.id,wrong:c.wrong,right:c.right,explain:c.why,distractors:[],context:ctx,wrongCount:1,correctStreak:0,createdAt:Date.now()});
    }
    await Promise.all([reload("diaries"),reload("quizWords")]);
  }catch(e){ console.error(e); S.penFailed=true; }   // 선생님이 쉬는 중이어도 제출은 막지 않아요
  finally{ S.penBusy=false; }
  render();
  document.getElementById("pen")?.scrollIntoView({behavior:"smooth",block:"nearest"});
}

  pin: (fd,f) => { const p=prof(f.dataset.id); if(p && String(fd.pin)===String(p.pin)){ enterAs(p); if(S.afterPin==="write"){ S.afterPin=null; openKidWrite(); } } else { toast("비밀번호가 달라요. 다시 입력해 주세요"); f.reset(); f.querySelector("input")?.focus(); } },
  schedule: (fd,f) => guard(async()=>{ const p=parseSchedule(fd.title); if(fd.time) p.time=fd.time;
    // 저장이 조금 걸릴 때도 바로 알 수 있게: 단추를 잠그고 "저장 중…" → "저장되었어요!"
    const btn=f?.querySelector("button"); if(btn){ btn.disabled=true; btn.dataset.label=btn.innerHTML; btn.textContent="저장 중…"; } toast("💾 일정을 저장하는 중…");
    await B.add(S.gid,"schedules",{date:fd.date,time:p.time,title:p.title,scope:fd.scope||"family",profileId:S.me.id,createdAt:Date.now()}); await reload("schedules"); render(); toast(`✅ 저장되었어요! ${p.time?p.time+" ":""}${p.title}`); }).finally(()=>{ const b=f?.querySelector("button"); if(b?.dataset.label){ b.disabled=false; b.innerHTML=b.dataset.label; } }),
  link: fd => guard(async()=>{ let u=fd.url.trim(); if(!/^https?:\/\//i.test(u)) u="https://"+u; try{ new URL(u); }catch(e){ toast("주소를 다시 확인해 주세요"); return; }
    await B.add(S.gid,"links",{title:fd.title.trim(),url:u,createdBy:S.me.id,createdAt:Date.now()}); await reload("links"); render(); toast("즐겨찾기를 추가했어요"); }),
  comment: (fd,f) => guard(async()=>{ const text=fd.text.trim(); if(!text) return;
    await B.add(S.gid,"comments",{diaryId:S.sub.id,parentId:f.dataset.parent||null,profileId:S.me.id,text,createdAt:Date.now()});
    S.replyTo=null; await reload("comments"); render(); toast(f.dataset.parent?"답글을 달았어요":"댓글을 달았어요"); }),
  "edit-comment": (fd,f) => guard(async()=>{ const text=fd.text.trim(); if(!text) return;
    await B.update(S.gid,"comments",f.dataset.id,{text,edited:true,updatedAt:Date.now()}); S.editing=null; await reload("comments"); render(); toast("댓글을 수정했어요"); }),
  child: (fd,f) => guard(async()=>{ if(fd.pin && !/^\d{4}$/.test(fd.pin)){ toast("비밀번호는 숫자 네 자리로 넣어 주세요"); return; }
    await B.add(S.gid,"profiles",{name:fd.name.trim(),type:"child",grade:Number(fd.grade),pin:fd.pin||"",color:COLORS[S.profiles.length%COLORS.length],createdAt:Date.now()});
    await reload("profiles"); render(); toast("아이 프로필을 추가했어요"); })
};

document.addEventListener("click", e => { const el=e.target.closest("[data-act]"); if(!el) return; const f=acts[el.dataset.act]; if(f){ e.preventDefault(); f(el,e); } });
document.addEventListener("submit", e => { const f=e.target.closest("form[data-form]"); if(!f) return; e.preventDefault(); forms[f.dataset.form]?.(Object.fromEntries(new FormData(f)), f); });
// 아이 일기: 붙여넣기 · 끌어다 놓기 막기
const KID_MAX_BURST = 10, KID_TYPE_MSG = "아이 일기는 직접 손으로 써요. 말로 쓰기와 붙여넣기는 안 돼요";
const kidField = t => S.me?.type==="child" && S.draft && (t.id==="w-text"||t.id==="w-title");
["paste","drop"].forEach(ev=>document.addEventListener(ev, e => { if(kidField(e.target)){ e.preventDefault(); toast(KID_TYPE_MSG); } }));
document.addEventListener("input", e => {
  if(e.target.classList?.contains("chat-ta")){ S.chatDraft=e.target.value; e.target.style.height="auto"; e.target.style.height=Math.min(140,e.target.scrollHeight)+"px"; return; }
  if(e.target.id==="q"){ S.search=e.target.value; const w=document.getElementById("feed-wrap"); if(w) w.innerHTML=viewFeed(); return; }
  if(!S.draft) return;
  // 아이 일기는 직접 손으로 써요: 말로 쓰기처럼 한꺼번에 긴 글이 들어오면 되돌려요
  if(S.me?.type==="child" && (e.target.id==="w-text"||e.target.id==="w-title")){
    const prev = e.target.id==="w-text" ? S.draft.text : S.draft.title;
    if(e.target.value.length-prev.length >= KID_MAX_BURST){ e.target.value=prev; toast(KID_TYPE_MSG); return; }
  }
  if(e.target.id==="w-text"){ S.draft.text=e.target.value; syncLen(); refreshPen(); }
  else if(e.target.id==="w-title") S.draft.title=e.target.value;
});
document.addEventListener("change", e => {
  const t=e.target;
  if(t.classList?.contains("chat-photo") && t.files?.[0]){ const file=t.files[0], ta=t.closest("form")?.querySelector(".chat-ta"); t.value=""; if(S.chatBusy){ toast("보내는 중이에요. 끝나면 사진을 다시 골라 주세요"); return; } sendChat(file, ta); return; }
  if(t.id==="w-date" && t.value){ changeDraftDate(t); return; }
  if(t.id==="w-photos" && t.files?.length){ addPhotos([...t.files]); return; }
  if(t.id==="w-audio" && t.files?.[0]){ addAudioFile(t.files[0]); return; }
  if(t.name==="mood" && S.draft){ S.draft.mood=t.value; const n=document.getElementById("wm-mood"); if(n) n.textContent=MOODS.find(m=>m[0]===t.value)?.[1]||""; return; }
  if(t.dataset.kwq!=null && S.draft){ S.draft.prompt=t.checked?t.dataset.kwq:""; render(); return; }
  if(t.name==="weather" && S.draft){ S.draft.weather=t.value; const n=document.getElementById("wm-weather"); if(n) n.textContent=weatherOf(t.value)?.[1]||""; return; }
  if(t.dataset.pref==="keep"){ ls.set("iinote-keep",t.checked?"1":""); if(S.user) ls.set("iinote-login",JSON.stringify({uid:S.user.uid,at:Date.now()})); markActive(true); toast(t.checked?`이 기기에서 ${KEEP_DAYS}일 동안 로그인을 유지해요`:`${IDLE_MIN}분 동안 안 쓰면 로그아웃해요`); }
  if(t.dataset.pref==="theme"){ S.theme=t.value; ls.set("iinote-theme",t.value); applyPrefs(); }
  if(t.dataset.pref==="dfont"){ S.dfont=t.value; ls.set("iinote-dfont",t.value); applyPrefs(); }
  if(t.dataset.pref==="design"){ S.design=t.value; ls.set("iinote-design",t.value); applyPrefs(); }
  if(t.dataset.pref==="home"){ guard(async()=>{ await B.update(S.gid,"profiles",S.me.id,{homeStyle:t.value}); S.me.homeStyle=t.value; const p=prof(S.me.id); if(p) p.homeStyle=t.value; if(S.tab!=="home"||S.sub){ S.tab="home"; S.sub=null; } render(); }); }
  if(t.dataset.pref==="group"){ guard(async()=>{ await B.setLastGroup(S.user.uid,t.value); S.me=null; await enterGroup(t.value); }); }
});

document.addEventListener("keydown", e => {
  // 채팅: 엔터로 보내기, Shift+엔터는 줄바꿈 (한글 조합 중에는 기다려요)
  if(e.target.classList?.contains("chat-ta") && e.key==="Enter" && !e.shiftKey && !e.isComposing && e.keyCode!==229){ e.preventDefault(); sendChat(null, e.target); return; }
  if(S.lb){ if(e.key==="Escape") { S.lb=null; render(); } else if(e.key==="ArrowLeft") lbMove(-1); else if(e.key==="ArrowRight") lbMove(1); return; }
  const id=e.target.id;
  if(id==="w-tag" && !e.isComposing){
    if(e.key==="Enter"||e.key===","||e.key===" "){ e.preventDefault(); addTag(e.target.value); }
    else if(e.key==="Backspace" && !e.target.value && S.draft.tags.length){ S.draft.tags.pop(); render(); document.getElementById("w-tag")?.focus(); }
  }
  if(id==="w-loc" && e.key==="Enter" && !e.isComposing){ e.preventDefault(); acts["loc-set"](); }
});
let touchX=null;
document.addEventListener("touchstart", e => { if(S.lb) touchX=e.touches[0].clientX; }, {passive:true});
document.addEventListener("touchend", e => { if(S.lb && touchX!==null){ const dx=e.changedTouches[0].clientX-touchX; if(Math.abs(dx)>50) lbMove(dx<0?1:-1); } touchX=null; });

/* =========================================================
   10. 시작
   ========================================================= */
/* ---------- 접속 현황 (운영 현황판에서 날짜별 숫자로) ----------
   views = 페이지를 연 횟수, visitors = 오늘 처음 온 기기 수, members = 오늘 로그인해서 쓴 기기 수. 이름 · 계정은 남기지 않아요 */
function countVisit(member){
  if(DEMO) return; const day=todayStr(), inc={};
  if(!member){ inc.views=1; if(ls.get("iinote-v-day","")!==day){ ls.set("iinote-v-day",day); inc.visitors=1; } }
  else if(ls.get("iinote-m-day","")!==day){ ls.set("iinote-m-day",day); inc.members=1; }
  B.countVisit(day,inc).catch(()=>{});
}
countVisit(false);

/* ---------- 자동 로그아웃 ---------- */
let lastAct = Number(ls.get("iinote-active")) || Date.now();
function markActive(force){ const n=Date.now(); if(force || n-lastAct>15000){ lastAct=n; ls.set("iinote-active",String(n)); } }
["pointerdown","keydown","scroll","touchstart"].forEach(ev=>addEventListener(ev,()=>markActive(),{passive:true,capture:true}));
function loginAt(u){   // 이 기기에서 이 계정으로 로그인한 때
  let s={}; try{ s=JSON.parse(ls.get("iinote-login","{}"))||{}; }catch(e){}
  if(s.uid!==u.uid){ s={uid:u.uid,at:Date.now()}; ls.set("iinote-login",JSON.stringify(s)); markActive(true); }
  return s.at;
}
async function autoLogoutCheck(){
  const u=S.user; if(!u || u.isAnonymous || DEMO) return false;
  const now=Date.now(), at=loginAt(u), active=Math.max(lastAct, Number(ls.get("iinote-active"))||0);
  const writing=S.sub?.type==="write" && (S.draft?.text||"").trim();
  let why="";
  if(keepLogin()){ if(now-at>KEEP_DAYS*864e5) why=`로그인한 지 ${KEEP_DAYS}일이 지나서`; }
  else if(!writing && now-active>IDLE_MIN*6e4) why=`${IDLE_MIN}분 동안 쓰지 않아서`;
  if(!why) return false;
  ls.del("iinote-login"); S.me=null; S.group=null; S.gid=null;
  await B.signOut();
  setTimeout(()=>toast(`${why} 안전하게 로그아웃했어요. 다시 로그인해 주세요`),300);
  return true;
}
setInterval(()=>{ autoLogoutCheck().catch(()=>{}); },60000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) autoLogoutCheck().catch(()=>{}); });
const keepBox = () => DEMO ? "" : `<label class="keep-login"><input type="checkbox" data-pref="keep" ${keepLogin()?"checked":""}> 이 기기에서 로그인 유지 <small>(${KEEP_DAYS}일 · 내 휴대폰이나 집 컴퓨터일 때만 켜 주세요. 끄면 ${IDLE_MIN}분 동안 안 쓰면 로그아웃돼요)</small></label>`;

B.onAuth(async u => {
  S.isOperator = await isOperatorUser(u);
  S.user=u;
  if(!u){ S.chatUnsub?.(); S.chatUnsub=null; S.chats=[]; S.chatReady=false; ls.del("iinote-login"); useSavedKidLink(); S.phase="landing"; S.me=null; render(); return; }
  if(!u.isAnonymous && !(S.joinCode && S.kidId)) ls.del("iinote-kidlink");   // 어른이 구글 · 카카오로 들어오면 기억한 아이 링크는 지워요
  if(await autoLogoutCheck()) return;
  countVisit(true);
  S.phase="loading"; render();
  try{
    S.userDoc = (await B.getUser(u.uid)) || {};
    if(S.joinCode && S.kidId){ // 아이 휴대폰 연결 링크: 가족에 들어가서 그 아이 프로필로 바로 열기
      const gid=await B.joinGroup(S.joinCode,u,"",null), kid=S.kidId;
      S.joinCode=""; S.kidId=""; history.replaceState(null,"",location.pathname);
      if(!u.isAnonymous) ls.del("iinote-kidlink");   // 부모 폰에서 눌렀으면 이번만 아이 화면으로 열고 기억하지 않아요
      S.userDoc=await B.getUser(u.uid); ls.set("iinote-pid-"+gid,kid); await enterGroup(gid);
      const p=prof(kid); if(S.phase==="picker" && p && p.pin){ S.pinFor=kid; render(); }
      return;
    }
    if(S.joinCode){ S.phase="onboard"; render(); return; }
    if(S.userDoc.lastGroupId) await enterGroup(S.userDoc.lastGroupId);
    else { S.phase="onboard"; render(); }
  }catch(e){ console.error(e); S.phase="onboard"; render(); toast("정보를 불러오지 못했어요. 파이어베이스 설정을 확인해 주세요"); }
});
</script>
