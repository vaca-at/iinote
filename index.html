function pdfRange(v){
  const t=todayStr(), d=toDate(t);
  const r={month:[t.slice(0,8)+"01",t], year:[t.slice(0,4)+"-01-01",t],
    last:[ymd(new Date(d.getFullYear(),d.getMonth()-1,1)), ymd(new Date(d.getFullYear(),d.getMonth(),0))],
    all:[S.diaries.map(x=>x.date).sort()[0]||t, t]}[v];
  if(!r) return;
  document.getElementById("pdf-from").value=r[0]; document.getElementById("pdf-to").value=r[1];
}
// 원고지 칸: 한 칸에 한 글자, 줄바꿈은 그 줄을 비워요
function pdfWongoji(text,cols){
  const cells=[];
  for(const line of String(text||"").split("\n")){
    const ch=[...line]; ch.forEach(c=>cells.push(c===" "?"":c));
    const rest=(cols - ch.length%cols)%cols; if(rest || !ch.length) for(let i=0;i<(ch.length?rest:cols);i++) cells.push("");
  }
  return `<div class="wg" style="--cols:${cols}">${cells.map(c=>`<i>${esc(c)}</i>`).join("")}</div>`;
}
function makePdf(form){
  const fd=new FormData(form), lay=fd.get("lay")||"basic", who=fd.getAll("who"), from=fd.get("from")||"0000", to=fd.get("to")||"9999";
  const withPh=!!fd.get("photos"), withCm=!!fd.get("cmts"), land=!!PDF_LAYOUTS.find(x=>x[0]===lay)?.[3];
  S.pdfLay=lay;
  const list=visibleDiaries().filter(d=>d.status==="submitted" && who.includes(d.profileId) && d.date>=from && d.date<=to)
    .sort((a,b)=>a.date.localeCompare(b.date)||(a.createdAt||0)-(b.createdAt||0));
  if(!list.length){ toast("고른 기간에 올린 일기가 없어요"); return; }
  const w=window.open("","_blank"); if(!w){ toast("새 창이 막혔어요. 팝업을 허용해 주세요"); return; }
  const people=who.map(prof).filter(Boolean), total=list.length, fam=S.group?.name||"우리집 일기장";
  const nPh=list.reduce((s,d)=>s+(d.photos||[]).length,0), nCm=list.reduce((s,d)=>s+S.comments.filter(c=>c.diaryId===d.id).length,0);
  const dotDate=s=>{ const d=toDate(s); return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}.`; };
  const colorOf=p=>p?.color||"#1F2A44";
  const chip=p=>`<span class="who" style="--pc:${colorOf(p)};--pt:${onColor(colorOf(p))}"><i>${esc((p?.name||"?").slice(0,1))}</i>${esc(p?.name||"")}</span>`;
  // 일기 한 편의 조각들
  const head=d=>{ const p=prof(d.profileId), m=MOODS.find(x=>x[0]===d.mood);
    return `<header class="d-h"><div><p class="d-date">${fmtLong(d.date)}</p>${chip(p)}${m?`<span class="mood"><i style="background:${m[2]}"></i>${esc(m[1])}</span>`:""}</div>${d.stamp?`<div class="stamp">${esc(d.stamp)}</div>`:""}</header>`; };
  const title=d=>d.title?`<h2 class="d-title">${esc(d.title)}</h2>`:"";
  const text=(d,cls="")=>`<div class="d-text ${cls}">${esc(d.text)}</div>`;
  const photos=(d,n)=>{ const ph=withPh?(d.photos||[]).slice(0,n):[]; return ph.length?`<div class="photos n${ph.length}">${ph.map(x=>`<img src="${esc(x.url)}" alt="">`).join("")}</div>`:""; };
  const bigPhoto=d=>{ const ph=withPh?(d.photos||[]).slice(0,2):[];
    return ph.length?`<div class="big-ph n${ph.length}">${ph.map(x=>`<img src="${esc(x.url)}" alt="">`).join("")}</div>`
      :`<div class="big-ph none"><span>${esc(fmtLong(d.date))}</span></div>`; };
  const meta=d=>d.location?.name||(d.tags||[]).length?`<p class="d-meta">${d.location?.name?`📍 ${esc(d.location.name)}　`:""}${(d.tags||[]).map(t=>`#${esc(t)}`).join(" ")}</p>`:"";
  const cmts=d=>{ if(!withCm) return ""; const cs=S.comments.filter(x=>x.diaryId===d.id && !x.deleted).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)), hs=heartsOf(d).map(id=>prof(id)?.name).filter(Boolean);
    return cs.length||hs.length?`<div class="cmts">${hs.length?`<p class="hearts">❤️ ${hs.map(esc).join(" · ")}</p>`:""}${cs.map(x=>`<p><b style="color:${colorOf(prof(x.profileId))}">${esc(prof(x.profileId)?.name||"")}</b>${x.parentId?" ↳":""} ${esc(x.text)}</p>`).join("")}</div>`:""; };
  const page=(inner,d,cls="")=>`<section class="page ${cls}" style="--pc:${colorOf(d&&prof(d.profileId))};--pt:${onColor(colorOf(d&&prof(d.profileId)))}"><div class="band"></div>${inner}<p class="pg">${esc(fam)}</p></section>`;
  // 세로쓰기는 글이 길면 글씨를 조금 작게
  const vSize=d=>{ const n=[...d.text].length; return n>700?"9pt":n>450?"10.5pt":n>250?"12pt":"13.5pt"; };
  let pages="";
  if(lay==="day"){
    const days=[...new Set(list.map(d=>d.date))];
    pages=days.map(day=>{ const ds=list.filter(d=>d.date===day);
      return `<section class="page dayp"><div class="band multi">${ds.map(d=>`<i style="background:${colorOf(prof(d.profileId))}"></i>`).join("")}</div>
        <p class="d-date">${fmtLong(day)}</p>
        <div class="day-list">${ds.map(d=>{ const p=prof(d.profileId);
          return `<article class="day-one" style="--pc:${colorOf(p)};--pt:${onColor(colorOf(p))}"><div class="day-h">${chip(p)}${d.stamp?`<span class="stamp sm">${esc(d.stamp)}</span>`:""}</div>${title(d)}${text(d,"sm")}${photos(d,2)}${cmts(d)}</article>`; }).join("")}</div>
        <p class="pg">${esc(fam)}</p></section>`; }).join("");
  }else if(lay==="two"){
    for(let i=0;i<list.length;i+=2){ const pair=list.slice(i,i+2);
      pages+=`<section class="page twop">${pair.map(d=>`<article class="half" style="--pc:${colorOf(prof(d.profileId))};--pt:${onColor(colorOf(prof(d.profileId)))}"><div class="band"></div>${head(d)}${title(d)}${text(d,"sm")}${photos(d,2)}</article>`).join('<hr class="cut">')}<p class="pg">${esc(fam)}</p></section>`; }
  }else{
    pages=list.map(d=>{
      if(lay==="top") return page(`${bigPhoto(d)}${head(d)}${title(d)}${text(d)}${meta(d)}${cmts(d)}`,d,"topp");
      if(lay==="topv") return page(`${bigPhoto(d)}${head(d)}<div class="vbox"><div class="vtext" style="font-size:${vSize(d)}">${d.title?`<b>${esc(d.title)}</b>\n`:""}${esc(d.text)}</div></div>`,d,"topp");
      if(lay==="left"||lay==="right"){ const ph=`<div class="side-ph">${bigPhoto(d)}</div>`, tx=`<div class="side-tx">${head(d)}${title(d)}${text(d)}${meta(d)}${cmts(d)}</div>`;
        return page(`<div class="side">${lay==="left"?ph+tx:tx+ph}</div>`,d,"landp"); }
      if(lay==="picture") return page(`${head(d)}${withPh&&(d.photos||[])[0]?`<div class="pic-frame"><img src="${esc(d.photos[0].url)}" alt=""></div>`:""}${d.title?`<p class="pic-title">제목: ${esc(d.title)}</p>`:""}${pdfWongoji(d.text,14)}`,d,"picp");
      if(lay==="grid") return page(`${head(d)}${d.title?`<p class="pic-title">${esc(d.title)}</p>`:""}${pdfWongoji(d.text,20)}${cmts(d)}`,d,"gridp");
      if(lay==="album"){ const ph=withPh?(d.photos||[]).slice(0,4):[];
        return page(`${head(d)}${ph.length?`<div class="album n${ph.length}">${ph.map(x=>`<img src="${esc(x.url)}" alt="">`).join("")}</div>`:""}<div class="caption">${title(d)}<p>${esc(d.text.length>220?d.text.slice(0,220)+"…":d.text)}</p></div>`,d,"albp"); }
      return page(`${head(d)}${title(d)}${text(d)}${photos(d,4)}${meta(d)}${cmts(d)}`,d,"basicp");
    }).join("");
  }
  const cover=`<section class="page cover"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    <div class="cv-in"><img class="cv-logo" src="${location.origin}/icon.png" alt=""><p class="cv-kicker">OUR FAMILY DIARY</p>
      <h1>${esc(fam)}</h1><p class="cv-range">${dotDate(list[0].date)} ~ ${dotDate(list[total-1].date)}</p>
      <div class="cv-who">${people.map(chip).join("")}</div>
      <div class="cv-stats"><div><b>${total}</b>편의 일기</div><div><b>${nPh}</b>장의 사진</div><div><b>${nCm}</b>개의 댓글</div></div></div>
    <p class="cv-foot">아이아이노트 · ${esc(SITE_ADDRESS)}</p></section>`;
  const layName=PDF_LAYOUTS.find(x=>x[0]===lay)?.[1]||"";
  w.document.open();
  w.document.write(`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>${esc(fam)} ${list[0].date}~${list[total-1].date} (${esc(layName)})</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap">
<style>${PDF_CSS}${land?PDF_CSS_LAND:""}:root{--diary:${getComputedStyle(document.documentElement).getPropertyValue("--diary")}}</style></head><body>
<div class="bar"><b>📄 ${esc(layName)} · 일기 ${total}편</b><span>대상(프린터)을 <b>‘PDF로 저장’</b>으로, 더 보기에서 <b>‘배경 그래픽’</b>을 켜 주세요.</span><button onclick="print()">인쇄 · PDF로 저장</button></div>
${cover}${pages}
<script>document.fonts.ready.then(()=>setTimeout(()=>print(),800));<\/script></body></html>`);
  w.document.close();
}
// PDF 모양 (새 창 안에서만 쓰는 색 · 크기)
const PDF_CSS = `@page{size:A4;margin:0}
:root{--ivory:#FBF6EE;--paper:#FFFDF9;--navy:#1F2A44;--ink2:#4E5870;--ink3:#767E91;--coral:#EF6F53;--coral-ink:#B8452D;--butter:#F4BE45;--sage:#3F7F70;--sky:#6F9BD8;--line:#E9DCC8;--margin:#F2B5A4;--grid:#F2B5A4;--pw:210mm;--ph:297mm}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{margin:0;background:#E9EBF0;color:var(--navy);font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;word-break:keep-all}
.bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:center;padding:10px 16px;background:var(--navy);color:#fff;font-size:14px}
.bar button{border:0;border-radius:99px;padding:8px 18px;background:var(--coral);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.page{position:relative;width:var(--pw);min-height:var(--ph);margin:8mm auto;padding:20mm 18mm 18mm 24mm;background:var(--ivory);overflow:hidden;box-shadow:0 6px 24px rgba(31,42,68,.18);break-after:page;page-break-after:always}
@media print{html,body{background:none}.bar{display:none}.page{margin:0;box-shadow:none}}
.page:not(.cover)::before{content:"";position:absolute;left:17mm;top:10mm;bottom:0;width:.6mm;background:var(--margin)}
.band{position:absolute;left:0;right:0;top:0;height:9mm;background:var(--pc)}
.band.multi{display:flex}.band.multi i{flex:1}
.pg{position:absolute;left:24mm;right:18mm;bottom:8mm;margin:0;text-align:right;font-size:8pt;color:var(--ink3)}
.cover{background:linear-gradient(160deg,#FFF4E0 0%,var(--ivory) 45%,#FDE3DA 100%);display:flex;flex-direction:column;justify-content:center;padding:0 22mm}
.blob{position:absolute;border-radius:50%}
.b1{width:120mm;height:120mm;right:-40mm;top:-35mm;background:var(--butter);opacity:.9}
.b2{width:70mm;height:70mm;left:-22mm;bottom:30mm;background:var(--sky);opacity:.5}
.b3{width:38mm;height:38mm;right:28mm;bottom:48mm;background:var(--coral);opacity:.8}
.cv-in{position:relative}
.cv-logo{width:22mm;height:22mm;border-radius:6mm;box-shadow:0 2mm 6mm rgba(31,42,68,.15)}
.cv-kicker{margin:10mm 0 2mm;letter-spacing:.35em;font-size:10pt;font-weight:700;color:var(--coral-ink)}
.cover h1{margin:0;font-family:"Gowun Batang",serif;font-size:40pt;line-height:1.15}
.cv-range{margin:5mm 0 9mm;font-size:14pt;color:var(--ink2);font-weight:600}
.cv-who{display:flex;flex-wrap:wrap;gap:3mm}
.cv-stats{display:flex;gap:4mm;margin-top:14mm}
.cv-stats div{background:rgba(255,255,255,.85);border-radius:5mm;padding:4mm 6mm;font-size:10pt;color:var(--ink2)}
.cv-stats b{display:block;font-size:22pt;color:var(--navy)}
.cv-foot{position:absolute;left:22mm;bottom:14mm;margin:0;font-size:9pt;color:var(--ink3)}
.who{display:inline-flex;align-items:center;gap:2mm;background:var(--pc);color:var(--pt);border-radius:99px;padding:1mm 4mm 1mm 1mm;font-weight:700;font-size:10.5pt}
.who i{display:grid;place-items:center;width:6.5mm;height:6.5mm;border-radius:50%;background:rgba(255,255,255,.35);font-style:normal;font-size:8.5pt}
.d-h{display:flex;justify-content:space-between;align-items:flex-start;gap:6mm;margin-bottom:2mm}
.d-date{margin:0 0 3mm;font-size:19pt;font-weight:800}
.mood{display:inline-flex;align-items:center;gap:1.5mm;margin-left:3mm;font-size:10pt;color:var(--ink2);font-weight:600}
.mood i{width:3mm;height:3mm;border-radius:50%}
.stamp{flex:none;transform:rotate(-10deg);color:var(--coral-ink);border:.9mm solid var(--coral);border-radius:48% 52% 45% 55%/55% 45% 55% 45%;padding:3mm 5mm;font-family:"Gowun Batang",serif;font-weight:700;font-size:13pt;margin-top:1mm}
.stamp.sm{font-size:9.5pt;padding:1.5mm 3mm;border-width:.6mm}
.d-title{margin:5mm 0 2mm;font-family:var(--diary);font-size:18pt;font-weight:700}
.d-text{font-family:var(--diary);font-size:13pt;line-height:9.5mm;white-space:pre-wrap;overflow-wrap:break-word;background-image:repeating-linear-gradient(transparent 0,transparent calc(9.5mm - .3mm),var(--line) calc(9.5mm - .3mm),var(--line) 9.5mm);padding-bottom:1mm}
.basicp .d-text{min-height:95mm}
.d-text.sm{font-size:11pt;line-height:7.5mm;background-image:repeating-linear-gradient(transparent 0,transparent calc(7.5mm - .3mm),var(--line) calc(7.5mm - .3mm),var(--line) 7.5mm)}
.photos{display:grid;gap:3mm;margin-top:5mm}
.photos.n1{grid-template-columns:1fr}.photos.n2,.photos.n4{grid-template-columns:1fr 1fr}.photos.n3{grid-template-columns:1fr 1fr 1fr}
.photos img{width:100%;height:55mm;object-fit:cover;border-radius:3mm;border:1.2mm solid #fff;box-shadow:0 1mm 3mm rgba(31,42,68,.15)}
.photos.n1 img{height:85mm}
.d-meta{margin:4mm 0 0;font-size:10pt;color:var(--sage);font-weight:600}
.cmts{margin-top:5mm;background:var(--paper);border:.4mm solid var(--line);border-radius:4mm;padding:3mm 5mm;font-size:10pt;line-height:1.6;break-inside:avoid}
.cmts p{margin:1mm 0}
.hearts{color:var(--coral-ink);font-weight:700}
/* 위 사진 */
.big-ph{display:grid;gap:3mm;height:110mm;margin:0 0 6mm}
.big-ph.n2{grid-template-columns:1fr 1fr}
.big-ph img{width:100%;height:100%;object-fit:cover;border-radius:4mm;border:1.5mm solid #fff;box-shadow:0 1.5mm 4mm rgba(31,42,68,.18)}
.big-ph.none{place-items:center;border-radius:4mm;background:linear-gradient(135deg,var(--pc),color-mix(in srgb,var(--pc) 45%,#fff));color:var(--pt);font-family:"Gowun Batang",serif;font-size:22pt;font-weight:700}
/* 세로쓰기 */
.vbox{height:115mm;display:flex;justify-content:flex-end;overflow:hidden;background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(9mm - .3mm),var(--line) calc(9mm - .3mm),var(--line) 9mm)}
.vtext{writing-mode:vertical-rl;text-orientation:upright;font-family:var(--diary);line-height:9mm;white-space:pre-wrap;height:100%}
.vtext b{font-size:1.2em}
/* 사진 + 원고지 · 원고지 */
.pic-frame{height:95mm;margin:3mm 0 5mm;border:.8mm solid var(--navy);border-radius:2mm;background:#fff;display:grid;place-items:center;overflow:hidden}
.pic-frame img{width:100%;height:100%;object-fit:cover}
.pic-frame span{color:var(--ink3);font-size:11pt}
.pic-title{margin:0 0 3mm;font-family:var(--diary);font-size:14pt;font-weight:700}
.wg{display:grid;grid-template-columns:repeat(var(--cols),1fr);border-top:.4mm solid var(--grid);border-left:.4mm solid var(--grid);background:#fff}
.wg i{aspect-ratio:1;display:grid;place-items:center;border-right:.4mm solid var(--grid);border-bottom:.4mm solid var(--grid);font-style:normal;font-family:var(--diary);line-height:1}
.picp .wg i{font-size:15pt}
.gridp .wg i{font-size:11.5pt}
/* 하루 모음 · 두 편씩 */
.day-list{display:grid;gap:5mm;margin-top:2mm}
.day-one{background:var(--paper);border-radius:4mm;border-left:2.5mm solid var(--pc);padding:3mm 5mm;break-inside:avoid}
.day-h{display:flex;justify-content:space-between;align-items:center}
.day-one .d-title{font-size:13pt;margin:2mm 0}
.day-one .photos img{height:38mm}
.twop{padding:0}
.half{position:relative;height:148mm;padding:15mm 18mm 8mm 24mm;overflow:hidden}
.half .d-date{font-size:15pt}
.half .d-title{font-size:14pt;margin:2mm 0}
.half .photos{margin-top:3mm}.half .photos img{height:34mm}
.cut{border:0;border-top:.5mm dashed var(--coral);margin:0 10mm}
/* 앨범 */
.album{display:grid;gap:3mm;grid-template-columns:1fr 1fr;margin:4mm 0}
.album.n1{grid-template-columns:1fr}.album.n1 img{height:170mm}
.album img{width:100%;height:95mm;object-fit:cover;border-radius:3mm;border:1.5mm solid #fff;box-shadow:0 1.5mm 4mm rgba(31,42,68,.18)}
.album.n3 img:first-child{grid-column:span 2;height:110mm}
.caption{background:var(--paper);border-radius:4mm;padding:4mm 6mm;border-left:2mm solid var(--pc)}
.caption p{margin:1mm 0 0;font-family:var(--diary);font-size:12pt;line-height:1.7;white-space:pre-wrap}
.caption .d-title{margin:0;font-size:14pt}`;
// A4 가로 구성 (왼쪽 · 오른쪽)
const PDF_CSS_LAND = `@page{size:A4 landscape;margin:0}
:root{--pw:297mm;--ph:210mm}
.landp{padding:16mm 14mm 14mm 22mm}
.side{display:grid;grid-template-columns:1fr 1fr;gap:8mm;height:170mm}
.side-ph .big-ph{height:170mm;margin:0}
.side-ph .big-ph.n2{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
.side-tx{overflow:hidden}
.side-tx .d-text{font-size:12pt;line-height:8.5mm;background-image:repeating-linear-gradient(transparent 0,transparent calc(8.5mm - .3mm),var(--line) calc(8.5mm - .3mm),var(--line) 8.5mm)}
.cover .b1{right:-20mm}`;
/* ---------- 칭찬 도장 · 하트 ----------
   도장: 부모가 아이 일기에 하나 찍어요 (같은 도장을 다시 누르면 지워져요). 하트: 가족 누구나 (diaries.hearts = {프로필id:true}) */
const STAMPS = ["참 잘했어요","최고예요","멋진 생각","글씨왕"];
const heartsOf = d => Object.keys(d.hearts||{}).filter(k=>d.hearts[k]);
function viewReact(d,mine){
  if(d.status!=="submitted") return "";
  const hs=heartsOf(d), on=hs.includes(S.me.id), who=hs.map(id=>prof(id)?.name).filter(Boolean);
  const canStamp=isParent() && !mine && prof(d.profileId)?.type==="child";
  return `<section class="react" aria-label="칭찬 도장과 하트">
    ${d.stamp?`<div class="stamp" role="img" aria-label="칭찬 도장: ${esc(d.stamp)}">${esc(d.stamp)}</div>`:""}
    <div class="react-row"><button class="heart-btn ${on?"on":""}" data-act="heart" data-id="${d.id}" aria-pressed="${on}">${on?"❤️":"🤍"} 하트 ${hs.length}</button>${who.length?`<span class="muted">${who.map(esc).join(" · ")}</span>`:""}</div>
    ${canStamp?`<div class="stamp-pick" role="group" aria-label="칭찬 도장 찍기"><span class="muted">칭찬 도장</span>${STAMPS.map(s=>`<button class="stamp-btn ${d.stamp===s?"on":""}" data-act="stamp" data-id="${d.id}" data-v="${esc(s)}" aria-pressed="${d.stamp===s}">${esc(s)}</button>`).join("")}</div>`:""}
  </section>`;
}

/* ---------- 일기 읽기 + 댓글 ---------- */
function viewDiaryDetail(){
  const d=S.diaries.find(x=>x.id===S.sub.id);
  if(!d) return `<p class="empty">일기를 찾을 수 없어요. <button class="link-btn" data-act="back">목록으로</button></p>`;
  const p=prof(d.profileId), mine=d.profileId===S.me.id;
  const showAI = d.aiResult && (mine || isParent());
  const cs=S.comments.filter(c=>c.diaryId===d.id);
  return `<article class="detail">
    <div class="sub-top"><button class="btn btn-ghost sm" data-act="back">${ic("back")}목록으로</button><div class="row">${mine?`<button class="btn btn-ghost sm" data-act="write" data-date="${d.date}">${ic("pen")}고쳐 쓰기</button>`:""}${mine||(isParent()&&p?.type==="child")?`<button class="btn btn-ghost sm danger" data-act="del-diary" data-id="${d.id}">${ic("trash")}지우기</button>`:""}</div></div>
    <header class="detail-h">${av(p,44)}<div><strong>${esc(p?.name||"알 수 없음")}</strong><span class="muted">${fmtLong(d.date)}${d.status!=="submitted"?" (쓰는 중이라 나만 보여요)":""}</span></div>${moodChip(d.mood)}</header>
    <h1 class="detail-title">${esc(d.title||"제목 없는 일기")}</h1>
    ${(d.location||(d.tags||[]).length)?`<div class="meta-row">${d.location?`<a class="loc" href="${esc(mapLink(d.location))}" target="_blank" rel="noopener noreferrer">${ic("pin")}${esc(d.location.name)}</a>`:""}${(d.tags||[]).map(t=>`<button class="htag" data-act="tag" data-v="${esc(t)}">#${esc(t)}</button>`).join("")}</div>`:""}
    ${(d.photos||[]).length?photoGrid(d.photos,d.id):""}
    <div class="paper-lines">${tagify(d.text)}</div>
    ${d.audio?`<div class="audio-card">${ic("mic")}<audio controls preload="none" src="${esc(d.audio.url)}"></audio></div>`:""}
    ${viewReact(d,mine)}
    ${showAI?viewAIResult(d.aiResult,d.text,false):""}
    <section class="comments" aria-labelledby="h-cm"><h2 id="h-cm">댓글 ${cs.length}</h2>
      ${cs.length?renderThread(cs,null,0):`<p class="muted">첫 댓글로 ${esc(p?.name||"")}의 하루에 답해 주세요.</p>`}
      <form class="cmt-form" data-form="comment" data-parent=""><label class="sr" for="c-new">댓글</label><textarea id="c-new" name="text" rows="2" maxlength="500" required placeholder="${esc(p?.name||"")}에게 한마디 남기기"></textarea><div class="row" style="justify-content:flex-end"><button class="btn btn-primary">댓글 달기</button></div></form>
    </section></article>`;
}
function renderThread(cs,parent,depth){
  const kids=cs.filter(c=>(c.parentId||null)===parent).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  if(!kids.length) return "";
  return `<ul class="thread ${depth?"nested":""}">${kids.map(c=>{ const p=prof(c.profileId), mine=c.profileId===S.me.id, editing=S.editing===c.id;
    return `<li class="cmt">${av(p,32)}<div class="cmt-body">
      <div class="cmt-meta"><strong>${esc(p?.name||"알 수 없음")}</strong><span class="muted">${relTime(c.createdAt)}${c.edited?" (수정됨)":""}</span></div>
      ${editing
        ? `<form class="cmt-form" data-form="edit-comment" data-id="${c.id}"><label class="sr" for="e-${c.id}">댓글 수정</label><textarea id="e-${c.id}" name="text" rows="2" maxlength="500" required>${esc(c.text)}</textarea><div class="row"><button class="btn btn-primary sm">수정 완료</button><button type="button" class="btn btn-ghost sm" data-act="cancel-edit">취소</button></div></form>`
        : c.deleted ? `<p class="cmt-text muted">(지운 댓글이에요)</p>`
        : `<p class="cmt-text">${esc(c.text)}</p><div class="cmt-acts"><button class="link-btn" data-act="reply" data-id="${c.id}">${ic("reply")}답글</button>${mine?`<button class="link-btn" data-act="edit-comment" data-id="${c.id}">${ic("pen")}수정</button><button class="link-btn" data-act="del-comment" data-id="${c.id}">${ic("trash")}지우기</button>`:""}</div>`}
      ${S.replyTo===c.id?`<form class="cmt-form" data-form="comment" data-parent="${c.id}"><label class="sr" for="r-${c.id}">답글</label><textarea id="r-${c.id}" name="text" rows="2" maxlength="500" required placeholder="${esc(p?.name||"")}에게 답글 쓰기"></textarea><div class="row"><button class="btn btn-primary sm">답글 달기</button><button type="button" class="btn btn-ghost sm" data-act="cancel-reply">취소</button></div></form>`:""}
      ${renderThread(cs,c.id,depth+1)}
    </div></li>`; }).join("")}</ul>`;
}

/* ---------- 일기 쓰기 ---------- */
function loadDraft(date){
  const d=findDiary(S.me.id,date);
  S.locEdit=false; S.penFailed=false;
  S.draft = d ? {id:d.id,date,mood:d.mood||"",title:d.title||"",text:d.text||"",status:d.status,aiChecked:!!d.aiChecked,aiResult:d.aiResult||null,pen:penFromResult(d.aiResult),
                 photos:(d.photos||[]).map(x=>({...x})),audio:d.audio?{...d.audio}:null,location:d.location||null,tags:[...(d.tags||[])],removed:[]}
              : {id:null,date,mood:"",title:"",text:"",status:"new",aiChecked:false,aiResult:null,pen:null,photos:[],audio:null,location:null,tags:[],removed:[]};
}
// 쓰는 중에 날짜를 바꾸면 내용은 그대로 두고 날짜만 옮겨요. 그날 쓴 일기가 이미 있으면 불러올지 물어봐요.
function changeDraftDate(input){
  const d=S.draft, date=input.value;
  if(date>todayStr()){ toast("앞으로의 날짜에는 쓸 수 없어요"); input.value=d.date; return; }
  const ex=findDiary(S.me.id,date);
  if(ex && ex.id!==d.id){
    const empty=!d.text.trim() && !d.title.trim();
    if(empty || confirm(`${fmtShort(date)}에 쓴 일기가 이미 있어요. 그 일기를 불러올까요?\n(지금 쓰던 내용은 저장되지 않아요)`)){ loadDraft(date); render(); }
    else input.value=d.date;
    return;
  }
  d.date=date;
}
function viewWrite(){
  const d=S.draft, child=S.me.type==="child", submitted=d.status==="submitted";
  return `<div class="write">
    <div class="sub-top"><button class="btn btn-ghost sm" data-act="back">${ic("back")}나가기</button><span class="muted">${submitted?(child?"제출한 일기를 고치고 있어요":"올린 일기를 고치고 있어요"):d.status==="draft"?"임시 저장된 일기예요":"새 일기"}</span></div>
    <label class="date-l">날짜<input type="date" id="w-date" value="${d.date}" max="${todayStr()}"></label>
    <fieldset class="moods"><legend>오늘 기분</legend>${MOODS.map(([k,l,c])=>`<label class="mood"><input type="radio" name="mood" value="${k}" ${d.mood===k?"checked":""}><span><i style="background:${c}"></i>${l}</span></label>`).join("")}</fieldset>
    ${child?`<p class="muted" style="font-size:13px;margin:0 0 8px">${ic("pen")} 아이 일기는 직접 손으로 써요. 말로 쓰기와 붙여넣기는 안 돼요.</p>`:""}
    <label class="sr" for="w-title">제목</label><input id="w-title" class="w-title" maxlength="40" placeholder="제목" value="${esc(d.title)}" ${child?'spellcheck="false" autocomplete="off" autocorrect="off"':""}>
    <label class="sr" for="w-text">일기</label>${child?`<div class="w-ed">`:""}<textarea id="w-text" class="w-text" placeholder="오늘 있었던 일을 써 보세요" ${child?'spellcheck="false" autocomplete="off" autocorrect="off"':""}>${esc(d.text)}</textarea>${child?`<div class="w-hl" id="w-hl" aria-hidden="true"></div></div>`:""}
    <div class="w-count muted"><span id="w-len">${d.text.length}</span>자</div>
    ${viewMedia(d)}
    ${child?viewPen(d):""}
    <div class="w-acts">${submitted
      ? `<button class="btn btn-primary" data-act="save-diary" data-v="submitted">고친 내용 저장</button>`
      : `<button class="btn btn-ghost" data-act="save-diary" data-v="draft">임시 저장</button><button class="btn btn-accent" data-act="save-diary" data-v="submitted">${child?"제출하기":"올리기"}</button>`}</div>
  </div>`;
}
function viewMedia(d){
  const secs=[];
  if(allow("photos")) secs.push(`<section class="media-sec" aria-label="사진"><div class="media-h">사진<span>${d.photos.length}/${MAX_PHOTOS}장</span></div>
    <div class="thumbs">${d.photos.map((p,i)=>`<div class="thumb"><img src="${esc(p.url)}" alt="${i+1}번째 사진"><button class="icon-btn" data-act="photo-del" data-id="${p.id}" aria-label="${i+1}번째 사진 빼기">${ic("x")}</button></div>`).join("")}
    ${d.photos.length<MAX_PHOTOS?`<label class="thumb-add">${ic("image")}<span>사진 추가</span><input type="file" id="w-photos" accept="image/*" multiple></label>`:""}</div>
    ${d.photos.length>1?`<p class="muted" style="margin:10px 0 0;font-size:13px">${d.photos.length}장은 일기장에 ${d.photos.length}분할로 보이고, 누르면 크게 볼 수 있어요.</p>`:""}</section>`);
  if(allow("location")){ const l=d.location;
    secs.push(`<section class="media-sec" aria-label="위치"><div class="media-h">위치${l&&l.lat!=null?"<span>지도에 약 100m 범위로 표시돼요</span>":""}</div>
      ${l?`<div class="row"><span class="loc">${ic("pin")}${esc(l.name)}</span>${S.locEdit?"":`<button class="link-btn" data-act="loc-edit">${ic("pen")}이름 바꾸기</button>`}<button class="link-btn" data-act="loc-clear">${ic("x")}빼기</button></div>`:""}

// 일기 칸 위에 형광펜 칠하기: 노랑 = 고칠 곳, 초록 = 고친 곳
function penHL(){
  const hl=document.getElementById("w-hl"), ta=document.getElementById("w-text"); if(!hl||!ta||!S.draft) return;
  const text=S.draft.text, spans=[];
  (S.draft.pen?.errors||[]).forEach(er=>{
    let i=penAt(er,text), len=er.wrong.length, cls="pen-x";
    if(i>=0 && er.kept) return;
    if(i<0 && er.applied){ i=er.at!=null&&text.startsWith(er.right,er.at)?er.at:text.indexOf(er.right); len=er.right.length; cls="pen-ok"; }
    if(i>=0 && !spans.some(s=>i<s.e && i+len>s.i)) spans.push({i,e:i+len,cls});
  });
  spans.sort((a,b)=>a.i-b.i);
  let h="", pos=0;
  spans.forEach(s=>{ h+=esc(text.slice(pos,s.i))+`<mark class="${s.cls}">${esc(text.slice(s.i,s.e))}</mark>`; pos=s.e; });
  hl.innerHTML=h+esc(text.slice(pos))+" ";
  ta.style.height="auto"; ta.style.height=ta.scrollHeight+"px";
}
function refreshPen(){
  const d=S.draft; if(!d) return;
  penHL();
  (d.pen?.errors||[]).forEach(er=>{ const L=penLeft(er,d.text);
    if(er._left && !L && !er.applied && !er.kept && d.text.includes(er.right)) toast(PRAISE_SELF[Math.floor(Math.random()*PRAISE_SELF.length)]);
    er._left=L; });
  const box=document.getElementById("pen"); if(box) box.outerHTML=viewPen(d);
}
function penApplyOne(er){
  const d=S.draft, i=penAt(er,d.text); if(i<0) return;
  d.text=d.text.slice(0,i)+er.right+d.text.slice(i+er.wrong.length);
  er.applied=true; er.shown=true; er.at=i;
}

}
function buildQuiz(mode){
  const ws=myWords();
  const ranked=[...ws].sort((a,b)=>((a.correctStreak||0)>=3)-((b.correctStreak||0)>=3) || (b.wrongCount||0)-(a.wrongCount||0) || (a.lastSeen||0)-(b.lastSeen||0));
  const pool=shuffle(ranked.slice(0,Math.max(5,Math.ceil(ranked.length/2))));
  const qs=[];
  for(let i=0;i<5;i++){
    const w=pool[i%pool.length];
    const kind = mode==="mix" ? (i%2===0?"mc":"ox") : mode;
    if(kind==="mc"){
      let others=[...new Set([...(w.distractors||[]),...variants(w.right),...variants(w.wrong)])].filter(x=>x && x!==w.right && x!==w.wrong);
      if(others.length<2) others=[...new Set([...others,...others.flatMap(variants)])].filter(x=>x && x!==w.right && x!==w.wrong);
      const opts=shuffle([w.right,w.wrong,...shuffle(others).slice(0,2)]);
      qs.push({kind,w,opts,answer:w.right});
    } else {
      const show = Math.random()<.5 ? w.right : w.wrong;
      qs.push({kind,w,show,answer: show===w.right ? "O" : "X"});
    }
  }
  return {qs,i:0,picked:null,score:0,done:false};
}
function viewQuizRun(){
  const q=S.quiz;
  if(q.done) return `<div class="quiz q-end"><p class="muted">퀴즈를 다 풀었어요</p><p class="q-score">${q.score} / ${q.qs.length}</p>
    <p>${q.score===q.qs.length?"모두 맞혔어요! 정말 멋져요.":q.score>=3?"잘했어요! 틀린 낱말은 한 번 더 풀어 봐요.":"괜찮아요. 한 번 더 풀면 금방 익힐 수 있어요."}</p>
    <div class="row" style="justify-content:center;margin-top:20px"><button class="btn btn-primary" data-act="quiz-start" data-v="mix">다시 풀기</button><button class="btn btn-ghost" data-act="quiz-exit">퀴즈 처음으로</button></div></div>`;
  const cur=q.qs[q.i], w=cur.w, picked=q.picked;
  const ctx = w.context || "";
  let body="";
  if(cur.kind==="mc"){
    const prompt = ctx ? `빈칸에 알맞은 말을 골라요.<span class="q-ctx">${esc(ctx)}</span>` : "다음 중 맞춤법이 바른 것을 골라요.";
    body = `<p class="q-text">${prompt}</p><div class="q-opts">${cur.opts.map((o,i)=>{ let cls=""; if(picked!==null){ if(o===cur.answer) cls="right"; else if(i===picked) cls="wrong"; }

  } else {

    body = `<p class="q-text">맞춤법이 맞으면 O, 틀리면 X를 골라요.<span class="q-ctx">${esc(shown)}</span></p>
      <div class="q-ox">${["O","X"].map(o=>{ let cls=""; if(picked!==null){ if(o===cur.answer) cls="right"; else if(o===picked) cls="wrong"; }
        return `<button class="q-opt ${cls}" data-act="quiz-answer" data-v="${o}" ${picked!==null?"disabled":""} aria-label="${o==="O"?"맞아요":"틀려요"}">${o}</button>`; }).join("")}</div>`;
  }
  let fb="";
  if(picked!==null){
    const ok = cur.kind==="mc" ? cur.opts[picked]===cur.answer : picked===cur.answer;
    fb = `<div class="q-fb" role="status"><strong>${ok?"정답이에요!":"아쉬워요, 다시 기억해 둬요."}</strong>'${esc(w.wrong)}'가 아니라 '${esc(w.right)}'가 맞아요. ${esc(w.explain||"")}</div>
      <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn btn-primary" data-act="quiz-next">${q.i===q.qs.length-1?"결과 보기":"다음 문제"}</button></div>`;
  }
  return `<div class="quiz"><div class="sub-top"><button class="btn btn-ghost sm" data-act="quiz-exit">${ic("back")}그만 풀기</button><span class="muted">${q.i+1} / ${q.qs.length}</span></div>
    <div class="q-prog" aria-hidden="true"><i style="width:${(q.i/q.qs.length)*100}%"></i></div>
    <span class="q-kind">${cur.kind==="mc"?"객관식":"OX 문제"}</span>${body}${fb}</div>`;
}

const $app=document.getElementById("app");
function render(){
  if(S.phase==="loading") $app.innerHTML=`<div class="loading">불러오는 중...</div>`;
  else if(S.phase==="landing") $app.innerHTML=viewLanding();
  else if(S.phase==="onboard") $app.innerHTML=viewOnboard();
  else if(S.phase==="picker") $app.innerHTML=viewPicker();
  else {
    // 공부방 일기 단추 등에서 ?write 로 들어오면: 프로필이 정해진 뒤 바로 오늘 일기 쓰는 칸으로
    if(S.wantWrite && S.phase==="app" && S.me && !S.sub){ S.wantWrite=false; loadDraft(todayStr()); S.sub={type:"write"}; history.replaceState(null,"",location.pathname); }
    $app.innerHTML=viewShell();
    if(S.sub?.type==="write") penHL();
  }
  document.body.style.overflow = S.lb ? "hidden" : "";
}
function go(fn){ fn(); render(); window.scrollTo(0,0); }
let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2400); }

async function guard(fn){ if(S.busy) return; S.busy=true; try{ await fn(); }catch(e){ console.error(e); toast(e.message||"문제가 생겼어요. 다시 시도해 주세요."); }finally{ S.busy=false; } }

  "del-diary": el => { const d=S.diaries.find(x=>x.id===el.dataset.id); if(!d) return;

      if(S.comments.some(x=>x.parentId===c.id)) await B.update(S.gid,"comments",c.id,{text:"",deleted:true}); else await B.remove(S.gid,"comments",c.id);

  "cal-day": el => { const d=el.dataset.v; S.calDay = S.calDay===d ? null : d; render();

  "del-link": el => guard(async()=>{ if(!confirm("이 즐겨찾기를 지울까요?")) return; await B.remove(S.gid,"links",el.dataset.id); await reload("links"); render(); toast("즐겨찾기를 지웠어요"); }),
  copy: async el => { try{ await navigator.clipboard.writeText(el.dataset.v); toast("복사했어요"); }catch(e){ prompt("아래 내용을 복사해 주세요", el.dataset.v); } },

    q.picked = cur.kind==="mc" ? Number(el.dataset.v) : el.dataset.v;
    const ok = cur.kind==="mc" ? cur.opts[q.picked]===cur.answer : q.picked===cur.answer;
    if(ok) q.score++;
    const w=cur.w; const upd = ok ? {correctStreak:(w.correctStreak||0)+1,lastSeen:Date.now()} : {correctStreak:0,wrongCount:(w.wrongCount||1)+1,lastSeen:Date.now()};
    Object.assign(w,upd); render();
    await B.update(S.gid,"quizWords",w.id,upd);
  }),

    toast("지금 있는 곳을 찾고 있어요");
    const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:false,timeout:10000,maximumAge:60000})).catch(()=>null);

function lbMove(n){ const l=S.lb; if(!l) return; l.i=(l.i+n+l.photos.length)%l.photos.length; render(); }
function addTag(v){ const t=cleanTag(v); if(t && !S.draft.tags.includes(t) && S.draft.tags.length<10) S.draft.tags.push(t); render(); document.getElementById("w-tag")?.focus(); }
async function addPhotos(files){
  const d=S.draft, room=MAX_PHOTOS-d.photos.length;
  if(room<=0){ toast(`사진은 ${MAX_PHOTOS}장까지 넣을 수 있어요`); return; }
  if(files.length>room) toast(`사진은 ${MAX_PHOTOS}장까지라 앞의 ${room}장만 넣을게요`);
  await guard(async()=>{ for(const f of files.slice(0,room)){ if(!f.type.startsWith("image/")) continue;
    const {blob,w,h}=await compressImage(f, DEMO?1000:1600, DEMO?.7:.82); d.photos.push({id:rid(),blob,url:URL.createObjectURL(blob),w,h}); } });
  render();
}
function addAudioFile(f){
  if(f.size>MAX_AUDIO_MB*1024*1024){ toast(`소리 파일은 ${MAX_AUDIO_MB}MB까지 올릴 수 있어요`); return; }
  const d=S.draft; if(d.audio?.path) d.removed.push(d.audio.path);
  d.audio={id:rid(),blob:f,url:URL.createObjectURL(f),duration:0,type:f.type}; render();
}
async function recStart(){
  if(!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder==="undefined"){ toast("이 브라우저에서는 녹음이 안 돼요. 소리 파일을 올려 주세요"); return; }
  let stream; try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ toast("마이크를 쓸 수 없어요. 마이크 권한을 확인해 주세요"); return; }
  const mime=["audio/webm;codecs=opus","audio/mp4","audio/webm"].find(m=>MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m))||"";
  const mr=new MediaRecorder(stream, mime?{mimeType:mime,audioBitsPerSecond:64000}:undefined);
  const chunks=[], t0=Date.now();
  const timer=setInterval(()=>{ const sec=Math.floor((Date.now()-t0)/1000); const el=document.getElementById("rec-t"); if(el) el.textContent=mmss(sec); if(sec>=MAX_AUDIO_SEC && mr.state!=="inactive") mr.stop(); },500);
  mr.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
  mr.onstop=()=>{ stream.getTracks().forEach(t=>t.stop()); clearInterval(timer); S.rec=null; if(!S.draft) return;
    const blob=new Blob(chunks,{type:mr.mimeType||mime||"audio/webm"}), d=S.draft;
    if(d.audio?.path) d.removed.push(d.audio.path);
    d.audio={id:rid(),blob,url:URL.createObjectURL(blob),duration:Math.round((Date.now()-t0)/1000),type:blob.type}; render(); };
  S.rec={mr}; mr.start(1000); render();
}
async function uploadPending(d){
  const base=`groups/${S.gid}/diaries/${d.id}`;
  const out=[];
  for(const p of d.photos){
    if(p.blob){ const r=await B.uploadMedia(`${base}/${p.id}.jpg`,p.blob); out.push({id:p.id,url:r.url,path:r.path,w:p.w||0,h:p.h||0}); }
    else out.push({id:p.id,url:p.url,path:p.path||"",w:p.w||0,h:p.h||0});
  }
  d.photos=out;
  if(d.audio?.blob){ const t=d.audio.blob.type||""; const ext=t.includes("mp4")||t.includes("m4a")?"m4a":t.includes("mpeg")?"mp3":t.includes("wav")?"wav":"webm";
    const r=await B.uploadMedia(`${base}/${d.audio.id}.${ext}`,d.audio.blob);
    d.audio={id:d.audio.id,url:r.url,path:r.path,duration:d.audio.duration||0,type:t}; }
  for(const path of d.removed) await B.deleteMedia(path);
  d.removed=[];
}

async function removeDiary(gid,d,comments){
  for(const ph of d.photos||[]) if(ph.path) await B.deleteMedia(ph.path);
  if(d.audio?.path) await B.deleteMedia(d.audio.path);
  await Promise.all(comments.filter(c=>c.diaryId===d.id).map(c=>B.remove(gid,"comments",c.id)));
  await B.remove(gid,"diaries",d.id);
}
// pids 프로필이 남긴 기록을 모두 지워요. all이면 그 가족의 기록 전부를 지워요.
async function wipeProfiles(gid,pids,all){
  const names=["profiles","diaries","comments","schedules","links","quizWords","aiReports"];
  const [profiles,diaries,comments,schedules,links,quizWords,aiReports]=await Promise.all(names.map(c=>B.list(gid,c)));
  const has=id=>all||pids.includes(id);
  const gone=diaries.filter(d=>has(d.profileId));
  for(const d of gone) await removeDiary(gid,d,comments);
  const goneIds=new Set(gone.map(d=>d.id));
  const rm=(c,list)=>Promise.all(list.map(x=>B.remove(gid,c,x.id)));
  await rm("comments",comments.filter(c=>!goneIds.has(c.diaryId) && has(c.profileId)));
  await rm("schedules",schedules.filter(s=>has(s.profileId)));
  await rm("links",links.filter(l=>has(l.createdBy)));
  await rm("quizWords",quizWords.filter(w=>has(w.profileId)));
  await rm("aiReports",aiReports.filter(r=>has(r.profileId)));
  await rm("profiles",profiles.filter(p=>has(p.id)));
}
function deleteMyAccount(){
  const word=prompt("내 계정과 기록을 지우면 되돌릴 수 없어요.\n\n· 내 프로필, 내가 쓴 일기 · 사진 · 소리 · 댓글 · 일정 · 즐겨찾기가 지워져요.\n· 가족 그룹에서 나가요.\n· 가족에 나 혼자 남아 있었다면 그 가족의 기록이 모두 지워져요.\n\n계속하려면 '지우기'라고 써 주세요.");
  if(word===null) return;
  if(word.trim()!=="지우기"){ toast("'지우기'라고 써야 지워져요"); return; }
  guard(async()=>{
    await B.reauth();
    toast("지우고 있어요. 잠시만 기다려 주세요");
    const uid=S.user.uid, gids=[...new Set([...(S.userDoc?.groupIds||[]),S.gid].filter(Boolean))];
    for(const gid of gids){
      const g=await B.getGroup(gid).catch(()=>null); if(!g) continue;
      const alone=!(g.memberUids||[]).some(u=>u!==uid);
      const mine=(await B.list(gid,"profiles")).filter(p=>p.uid===uid).map(p=>p.id);
      await wipeProfiles(gid,mine,alone);
      await B.leaveGroup(gid,uid);
      ls.del("iinote-pid-"+gid);
    }
    await B.deleteUserDoc(uid);
    S.me=null; S.group=null; S.gid=null; S.sub=null;
    await B.deleteAccount();
    toast("계정과 기록을 모두 지웠어요");
  });
}

/* 예전 가족일기장에서 가져오기: 예전 일기장 계정으로 한 번 더 로그인해서 diary 모음을 읽어 와요.
   가져온 일기 · 댓글에는 importKey를 적어 두어서, 다시 눌러도 새로 쓴 것만 들어와요. */
async function readOldDiaries(){
  const V="10.12.2";
  const A = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const AU = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
  const F = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const app = A.getApps().find(a=>a.name==="old") || A.initializeApp(OLD_DIARY_CONFIG,"old");
  const auth = AU.getAuth(app), p = new AU.GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"});
  try{
    await AU.signInWithPopup(auth,p);
    const s = await F.getDocs(F.collection(F.getFirestore(app),"diary"));
    return s.docs.map(d=>({id:d.id,...d.data()}));
  }catch(e){ throw new Error(`예전 일기장을 읽지 못했어요 (${e.code||e.message})`); }
  finally{ AU.signOut(auth).catch(()=>{}); }
}
const OLD_MOOD = {"😆":"great","🥰":"great","😊":"good","😐":"calm","😢":"sad","😠":"sad","😴":"tired"};
const msOf = (t,fb) => t?.toMillis ? t.toMillis() : typeof t==="number" ? t : fb;
// 예전 일기장의 빨간펜(AI 맞춤법) 기록 → iinote의 aiResult 모양으로. 어떻게 고쳤는지(how)는 설명 칸에
const OLD_HOW = {self:"스스로 찾아 고쳤어요", hint:"힌트를 보고 고쳤어요", ai:"AI 선생님이 고쳐 줬어요", other:"다른 말로 고쳐 썼어요"};
function oldAiResult(o){
  if(!o.spellChecked && !(o.spellFixes||[]).length) return null;
  const fb=o.spellFeedback||{}, cs=(o.spellFixes||[]).filter(f=>f.wrong&&f.right)
    .map(f=>({wrong:f.wrong,right:f.right,explain:[OLD_HOW[f.how],f.kind].filter(Boolean).join(" · "),context:""}));
  return {praise:fb.praise||"", feedback:fb.cheer||(cs.length?`틀린 곳 ${cs.length}개를 고쳤어요.`:"틀린 곳 없이 잘 썼어요."),
    corrections:cs, checkedAt:msOf(o.updatedAt,Date.now()), imported:true};
}
async function importOld(fd){
  const map={}; OLD_PEOPLE.forEach(([k])=>{ if(fd[k]) map[k]=fd[k]; });
  if(!Object.keys(map).length){ toast("가져올 사람을 하나 이상 골라 주세요"); return; }
  const old=(await readOldDiaries()).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  toast("가져오는 중이에요…");
  const have=new Map(S.diaries.filter(d=>d.importKey).map(d=>[d.importKey,d]));
  const haveC=new Set(S.comments.map(c=>c.importKey).filter(Boolean));
  let nd=0, nu=0, nc=0, nq=0;
  for(const o of old){
    const pid=map[o.author]; if(!pid || !o.date || !String(o.content||"").trim()) continue;
    const key="old:"+o.id, at=msOf(o.createdAt, new Date(o.date+"T20:00:00").getTime()), up=msOf(o.updatedAt,at);
    const title=String(o.title||"").trim(), ai=oldAiResult(o);
    // 질문에 답한 일기는 질문을 맨 위에
    const body={mood:OLD_MOOD[o.mood]||"", title, text:(o.question?`Q. ${o.question}\n\n`:"")+o.content,
      tags:[...new Set(extractTags(title+" "+o.content))].slice(0,20), aiChecked:!!ai, aiResult:ai, importAt:up};
    const ex=have.get(key); let did=ex?.id;
    if(!ex){
      did=await B.add(S.gid,"diaries",{profileId:pid,date:o.date,status:"submitted",photos:[],audio:null,location:null,createdAt:at,updatedAt:up,importKey:key,...body});
      nd++;
    }else if(up>(ex.importAt||0)){
      // 예전 일기장에서 고쳤거나, 빨간펜 검사를 다시 받은 일기 → 새 내용으로 바꿔요
      await B.update(S.gid,"diaries",did,{...body,updatedAt:up}); nu++;
    }
    // 예전 일기장의 칭찬 도장 · 하트도 (iinote에서 누른 하트는 그대로 두고 합쳐요)
    const cur=ex?.hearts||{}, add=Object.keys(o.hearts||{}).filter(k=>o.hearts[k] && map[k] && !cur[map[k]]).map(k=>map[k]);
    if(add.length || (o.stamp && o.stamp!==ex?.stamp))
      await B.update(S.gid,"diaries",did,{hearts:{...cur,...Object.fromEntries(add.map(id=>[id,true]))}, ...(o.stamp?{stamp:o.stamp}:{})});
    for(const c of o.comments||[]){
      const ck=`${key}:${c.at}:${c.by}`, cp=map[c.by];
      if(!cp || !c.text || haveC.has(ck)) continue;
      await B.add(S.gid,"comments",{diaryId:did,parentId:null,profileId:cp,text:c.text,createdAt:c.at||Date.now(),importKey:ck});
      haveC.add(ck); nc++;
    }
    // 아이 일기에서 고친 낱말은 받아쓰기 퀴즈에도 (이미 있으면 건너뛰기)
    if(prof(pid)?.type==="child") for(const f of ai?.corrections||[]){
      if(S.quizWords.some(w=>w.profileId===pid && w.wrong===f.wrong && w.right===f.right)) continue;
      const w={profileId:pid,wrong:f.wrong,right:f.right,explain:f.explain,distractors:[],context:contextOf(o.content,f.right),wrongCount:1,correctStreak:0,createdAt:up,importKey:key};
      await B.add(S.gid,"quizWords",w); S.quizWords.push(w); nq++;
    }
  }
  await reload("diaries"); await reload("comments"); await reload("quizWords"); render();
  toast(nd||nu||nc||nq?`새 일기 ${nd}편 · 고친 일기 ${nu}편 · 댓글 ${nc}개 · 퀴즈 낱말 ${nq}개를 가져왔어요`:"새로 가져올 일기가 없어요");
}

async function saveDiary(status){
  const d=S.draft, child=S.me.type==="child";
  if(!d.text.trim()){ toast("일기 내용을 써 주세요"); return; }
  // 빨간펜: 노란 형광펜이 남아 있으면 제출 못 해요 (선생님이 쉬는 중이면 그냥 제출 가능)
  if(status==="submitted" && child){
    const goal=penGoalOf(S.me), n=countChars(d.text);
    if(n<goal){ toast(`${goal}자를 채우면 제출할 수 있어요! (지금 ${n}자)`); return; }
    const left=(d.pen?.errors||[]).filter(er=>penLeft(er,d.text)).length;
    if(left){ toast(`✏️ 노란 형광펜 ${left}군데만 고치면 제출할 수 있어요! 거의 다 왔어요 💪`); document.getElementById("pen")?.scrollIntoView({behavior:"smooth",block:"nearest"}); return; }
    if(!d.pen && !S.penFailed && !confirm("AI 빨간펜 선생님께 아직 보여 주지 않았어요. 그래도 제출할까요?")) return;
  }
  const pend=document.getElementById("w-tag")?.value; if(pend){ const t=cleanTag(pend); if(t && !d.tags.includes(t)) d.tags.push(t); }
  const data={profileId:S.me.id,date:d.date,mood:d.mood,title:d.title.trim(),text:d.text,status,updatedAt:Date.now()};
  if(d.pen){ data.aiChecked=true; data.aiResult=penResult(d); }
  else if(d.aiChecked){ data.aiChecked=true; data.aiResult=d.aiResult; }
  if(!d.id){ data.createdAt=Date.now(); d.id=await B.add(S.gid,"diaries",{...data,photos:[],audio:null,location:null,tags:[]}); }
  if(d.photos.some(p=>p.blob) || d.audio?.blob) toast("사진과 소리를 올리고 있어요");
  await uploadPending(d);
  Object.assign(data,{ photos:d.photos, audio:d.audio||null, location:d.location||null,
    tags:[...new Set([...d.tags,...extractTags(d.title+" "+d.text)])].slice(0,20) });
  await B.update(S.gid,"diaries",d.id,data);
  d.status=status;
  await reload("diaries");
  if(status==="submitted"){ toast(child?"제출했어요":"올렸어요"); S.sub={type:"diary",id:d.id}; S.draft=null; render(); window.scrollTo(0,0); }
  else { toast("임시 저장했어요"); render(); }
}

async function penCheck(){
  const d=S.draft, g=S.me.grade, goal=penGoalOf(S.me), n=countChars(d.text);
  if(S.penBusy) return;
  if(n<goal){ toast(`${goal}자를 다 쓰면 AI 빨간펜 선생님을 부를 수 있어요! (지금 ${n}자)`); return; }
  if(d.pen && d.pen.checks>=PEN_MAX_CHECK){ toast(`빨간펜 검사는 일기 하나에 ${PEN_MAX_CHECK}번까지예요`); return; }
  S.penBusy=true; S.penFailed=false; refreshPen();
  try{
    const data=await callPen(d.text), prev=d.pen, text=d.text;
    let errors=(data.errors||[]).filter(e=>e && e.wrong && e.right && e.wrong!==e.right)
      .map(e=>({wrong:String(e.wrong),right:String(e.right),kind:String(e.kind||""),hint:String(e.hint||""),why:String(e.why||"")}));
    const found=errors.slice();   // 받아쓰기 퀴즈에 넣을 것 (빨간펜이 찾은 낱말만)
    errors.push(...penSpace(text,errors)); errors.push(...penPeriod(text,errors));
    // 앞 검사에서 고친 기록은 그대로 남겨요 (같은 것은 한 번만)
    const kept=(prev?.errors||[]).filter(er=>penAt(er,text)<0 || er.kept), seen=new Set(errors.map(e=>e.wrong+"→"+e.right));
    errors=[...kept.filter(e=>!seen.has(e.wrong+"→"+e.right)), ...errors];
    errors.forEach(er=>{ er._left=penLeft(er,text); });
    d.pen={praise:data.praise||"", cheer:data.cheer||"", errors, checks:(prev?.checks||0)+1, original:prev?.original||text, auto:penAuto(g)};
    if(d.pen.auto){ for(const er of errors) if(penAt(er,d.text)>=0){ penApplyOne(er); er.auto=true; er._left=false; } }
    // 검사 결과를 일기에 바로 붙여 둬요 (나갔다 와도 그대로)
    const base={profileId:S.me.id,date:d.date,mood:d.mood,title:d.title.trim(),text:d.text,status:d.status==="submitted"?"submitted":"draft",updatedAt:Date.now(),aiChecked:true,aiResult:penResult(d)};
    if(d.id) await B.update(S.gid,"diaries",d.id,base);
    else { base.createdAt=Date.now(); d.id=await B.add(S.gid,"diaries",{...base,photos:[],audio:null,location:null,tags:[]}); d.status="draft"; }
    d.aiChecked=true; d.aiResult=base.aiResult;
    for(const c of found){
      const ctx=contextOf(text,c.wrong), ex=S.quizWords.find(w=>w.profileId===S.me.id && w.wrong===c.wrong && w.right===c.right);
      if(ex) await B.update(S.gid,"quizWords",ex.id,{wrongCount:(ex.wrongCount||1)+1,correctStreak:0,context:ctx||ex.context||"",explain:c.why||ex.explain||""});
      else await B.add(S.gid,"quizWords",{profileId:S.me.id,wrong:c.wrong,right:c.right,explain:c.why,distractors:[],context:ctx,wrongCount:1,correctStreak:0,createdAt:Date.now()});
    }
    await Promise.all([reload("diaries"),reload("quizWords")]);
  }catch(e){ console.error(e); S.penFailed=true; }   // 선생님이 쉬는 중이어도 제출은 막지 않아요
  finally{ S.penBusy=false; }
  render();
  document.getElementById("pen")?.scrollIntoView({behavior:"smooth",block:"nearest"});
}

  "edit-comment": (fd,f) => guard(async()=>{ const text=fd.text.trim(); if(!text) return;
    await B.update(S.gid,"comments",f.dataset.id,{text,edited:true,updatedAt:Date.now()}); S.editing=null; await reload("comments"); render(); toast("댓글을 수정했어요"); }),
  child: (fd,f) => guard(async()=>{ if(fd.pin && !/^\d{4}$/.test(fd.pin)){ toast("비밀번호는 숫자 네 자리로 넣어 주세요"); return; }
    await B.add(S.gid,"profiles",{name:fd.name.trim(),type:"child",grade:Number(fd.grade),pin:fd.pin||"",color:COLORS[S.profiles.length%COLORS.length],createdAt:Date.now()});
    await reload("profiles"); render(); toast("아이 프로필을 추가했어요"); })
};

document.addEventListener("click", e => { const el=e.target.closest("[data-act]"); if(!el) return; const f=acts[el.dataset.act]; if(f){ e.preventDefault(); f(el,e); } });
document.addEventListener("submit", e => { const f=e.target.closest("form[data-form]"); if(!f) return; e.preventDefault(); forms[f.dataset.form]?.(Object.fromEntries(new FormData(f)), f); });
// 아이 일기: 붙여넣기 · 끌어다 놓기 막기
const KID_MAX_BURST = 10, KID_TYPE_MSG = "아이 일기는 직접 손으로 써요. 말로 쓰기와 붙여넣기는 안 돼요";
const kidField = t => S.me?.type==="child" && S.draft && (t.id==="w-text"||t.id==="w-title");
["paste","drop"].forEach(ev=>document.addEventListener(ev, e => { if(kidField(e.target)){ e.preventDefault(); toast(KID_TYPE_MSG); } }));
document.addEventListener("input", e => {
  if(e.target.id==="q"){ S.search=e.target.value; const w=document.getElementById("feed-wrap"); if(w) w.innerHTML=viewFeed(); return; }
  if(!S.draft) return;
  // 아이 일기는 직접 손으로 써요: 말로 쓰기처럼 한꺼번에 긴 글이 들어오면 되돌려요
  if(S.me?.type==="child" && (e.target.id==="w-text"||e.target.id==="w-title")){
    const prev = e.target.id==="w-text" ? S.draft.text : S.draft.title;
    if(e.target.value.length-prev.length >= KID_MAX_BURST){ e.target.value=prev; toast(KID_TYPE_MSG); return; }
  }
  if(e.target.id==="w-text"){ S.draft.text=e.target.value; const n=document.getElementById("w-len"); if(n) n.textContent=S.draft.text.length; refreshPen(); }
  else if(e.target.id==="w-title") S.draft.title=e.target.value;
});
document.addEventListener("change", e => {
  const t=e.target;
  if(t.id==="w-date" && t.value){ changeDraftDate(t); return; }
  if(t.id==="w-photos" && t.files?.length){ addPhotos([...t.files]); return; }
  if(t.id==="w-audio" && t.files?.[0]){ addAudioFile(t.files[0]); return; }
  if(t.name==="mood" && S.draft){ S.draft.mood=t.value; return; }
  if(t.dataset.pref==="theme"){ S.theme=t.value; ls.set("iinote-theme",t.value); applyPrefs(); }
  if(t.dataset.pref==="dfont"){ S.dfont=t.value; ls.set("iinote-dfont",t.value); applyPrefs(); }
  if(t.dataset.pref==="design"){ S.design=t.value; ls.set("iinote-design",t.value); applyPrefs(); }
  if(t.dataset.pref==="home"){ guard(async()=>{ await B.update(S.gid,"profiles",S.me.id,{homeStyle:t.value}); S.me.homeStyle=t.value; const p=prof(S.me.id); if(p) p.homeStyle=t.value; if(S.tab!=="home"||S.sub){ S.tab="home"; S.sub=null; } render(); }); }
  if(t.dataset.pref==="group"){ guard(async()=>{ await B.setLastGroup(S.user.uid,t.value); S.me=null; await enterGroup(t.value); }); }
});

document.addEventListener("keydown", e => {
  if(S.lb){ if(e.key==="Escape") { S.lb=null; render(); } else if(e.key==="ArrowLeft") lbMove(-1); else if(e.key==="ArrowRight") lbMove(1); return; }
  const id=e.target.id;
  if(id==="w-tag" && !e.isComposing){
    if(e.key==="Enter"||e.key===","||e.key===" "){ e.preventDefault(); addTag(e.target.value); }
    else if(e.key==="Backspace" && !e.target.value && S.draft.tags.length){ S.draft.tags.pop(); render(); document.getElementById("w-tag")?.focus(); }
  }
  if(id==="w-loc" && e.key==="Enter" && !e.isComposing){ e.preventDefault(); acts["loc-set"](); }
});
let touchX=null;
document.addEventListener("touchstart", e => { if(S.lb) touchX=e.touches[0].clientX; }, {passive:true});
document.addEventListener("touchend", e => { if(S.lb && touchX!==null){ const dx=e.changedTouches[0].clientX-touchX; if(Math.abs(dx)>50) lbMove(dx<0?1:-1); } touchX=null; });

/* =========================================================
   10. 시작
   ========================================================= */
B.onAuth(async u => {
  S.isOperator = await isOperatorUser(u);
  S.user=u;
  if(!u){ S.phase="landing"; S.me=null; render(); return; }
  S.phase="loading"; render();
  try{
    S.userDoc = (await B.getUser(u.uid)) || {};
    if(S.joinCode && S.kidId){ // 아이 휴대폰 연결 링크: 가족에 들어가서 그 아이 프로필로 바로 열기
      const gid=await B.joinGroup(S.joinCode,u,"",null), kid=S.kidId;
      S.joinCode=""; S.kidId=""; history.replaceState(null,"",location.pathname);
      S.userDoc=await B.getUser(u.uid); ls.set("iinote-pid-"+gid,kid); await enterGroup(gid);
      const p=prof(kid); if(S.phase==="picker" && p && p.pin){ S.pinFor=kid; render(); }
      return;
    }
    if(S.joinCode){ S.phase="onboard"; render(); return; }
    if(S.userDoc.lastGroupId) await enterGroup(S.userDoc.lastGroupId);
    else { S.phase="onboard"; render(); }
  }catch(e){ console.error(e); S.phase="onboard"; render(); toast("정보를 불러오지 못했어요. 파이어베이스 설정을 확인해 주세요"); }
});
</script>
