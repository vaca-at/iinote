<!doctype html>
<html lang="ko" data-theme="light" data-dfont="batang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF6EE">
<title>아이아이노트 - 가족이 함께 쓰는 일기장</title>
<meta name="description" content="매일 일기 습관부터 AI 빨간펜 맞춤법 공부, 성장 기록까지. 온 가족이 함께 쓰고 댓글과 칭찬 도장으로 응원하는 우리집 일기장이에요.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="아이아이노트">
<meta property="og:title" content="아이아이노트 - 온 가족이 함께 쓰는 일기장">
<meta property="og:description" content="매일 일기 습관부터 AI 빨간펜 맞춤법 공부, 성장 기록까지. 온 가족이 함께 쓰고 댓글과 칭찬 도장으로 응원하는 우리집 일기장이에요.">
<meta property="og:image" content="https://iinote.co.kr/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="아이아이노트 - 온 가족이 함께 쓰는 일기장. 매일 일기 습관, AI 빨간펜, 맞춤법 공부, 성장 기록">
<meta property="og:url" content="https://iinote.co.kr/">
<link rel="icon" type="image/png" href="icon.png">
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.3/kakao.min.js" integrity="sha384-oroumrnFVE0xtgqyDZJARgERibXg2C28380uaUZz2kHDS5CR7tu20eGiOU6GkTpy" crossorigin="anonymous" defer></script>
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap">
<style>
/* =========================================================
   색은 모두 여기 변수로 관리해요. (다크 모드도 여기서 바뀜)
   ========================================================= */
:root{
  --paper:#FBF6EE; --grid:#F1E9DC; --surface:#FFFDF9; --surface2:#F6EFE3;
  --ink:#1F2A44; --ink2:#4E5870; --ink3:#767E91;
  --line:#E7DDCD; --rule:#E9DCC8; --margin:#F2B5A4;
  --coral:#EF6F53; --coral-ink:#B8452D; --coral-soft:#FCE3DB;
  --butter:#F4BE45; --butter-soft:#FCEFC9;
  --sage:#3F7F70; --sage-soft:#DFEEE9;
  --sky:#6F9BD8; --sky-soft:#DDE8F6; --lilac:#A98BD0; --lilac-soft:#ECE3F6;
  --kakao:#FEE500; --kakao-ink:#191919;
  --focus:#F4BE45;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --sans:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --diary:"Gowun Batang","AppleMyungjo","Batang",serif;
  --diary-size:19px; --diary-lh:36px;
}
[data-dfont="pen"]{ --diary:"Nanum Pen Script","Gowun Batang",serif; --diary-size:26px; --diary-lh:38px; }
[data-dfont="gothic"]{ --diary:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; --diary-size:18px; --diary-lh:34px; }
[data-dfont="dodum"]{ --diary:"Gowun Dodum","Pretendard Variable",sans-serif; --diary-size:18px; --diary-lh:35px; }
[data-theme="dark"]{
  --paper:#141A28; --grid:#1A2233; --surface:#1B2336; --surface2:#222B40;
  --ink:#F2EDE3; --ink2:#C6C0B4; --ink3:#9CA2B0;
  --line:#2B3550; --rule:#2E3953; --margin:#7A4A48;
  --coral:#F07C62; --coral-ink:#F59C86; --coral-soft:#3A2525;
  --butter:#F4BE45; --butter-soft:#3A3322;
  --sage:#8CC2B4; --sage-soft:#1E3430;
  --sky:#8DB4EA; --sky-soft:#1F2C44; --lilac:#C3A8E6; --lilac-soft:#2C2540;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--sans); color:var(--ink); font-size:16px; line-height:1.6;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  -webkit-font-smoothing:antialiased; word-break:keep-all;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--coral-ink)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink3)}
.ic{width:20px;height:20px;flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;border:1.5px solid transparent;font-weight:650;font-size:16px;background:none;transition:background .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn-accent{background:var(--coral);color:#1F2A44}
.btn-ghost{border-color:var(--line);background:var(--surface);color:var(--ink)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.danger{color:var(--coral-ink)}
.btn.danger:hover{border-color:var(--coral);background:var(--coral-soft)}
.acc-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.ai-report{margin:10px 0 0;text-align:right}
.ai-report .link-btn{font-size:13px}
.btn.wide{width:100%}
.btn-kakao{background:var(--kakao);color:var(--kakao-ink)}
.btn-kakao:hover{filter:brightness(.96)}
.btn-kakao .ic{fill:currentColor;stroke:none}
.share-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:14px}
.share-row small{font-size:13px;color:var(--ink3)}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;border:0;background:none;color:var(--ink3)}
.icon-btn:hover{background:var(--surface2);color:var(--ink)}
.link-btn{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:4px 2px;color:var(--ink3);font-size:14px;font-weight:600}
.link-btn .ic{width:16px;height:16px}
.link-btn:hover{color:var(--ink)}

/* 입력 */
input,textarea,select{width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:11px 14px;font-size:16px}
textarea{resize:vertical}
label{display:block;font-size:14px;font-weight:600;color:var(--ink2)}
label>input,label>select{margin-top:6px}
fieldset{border:0;margin:0;padding:0}
legend{font-size:14px;font-weight:600;color:var(--ink2);margin-bottom:6px;padding:0}

/* 아바타 · 태그 */
.av{display:inline-grid;place-items:center;border-radius:50%;font-weight:700;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:650;white-space:nowrap}
.pill.done{background:var(--sage-soft);color:var(--sage)}
.pill.draft{background:var(--butter-soft);color:#8A6212}
[data-theme="dark"] .pill.draft{color:var(--butter)}
.pill.none{background:var(--surface2);color:var(--ink3)}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px}
.tag.family{background:var(--coral-soft);color:var(--coral-ink)}
.tag.personal{background:var(--surface2);color:var(--ink2)}
.logo-wrap{display:inline-block;overflow:hidden;flex:none;box-shadow:0 1px 2px rgba(31,42,68,.12)}
.logo-wrap svg{display:block;width:100%;height:100%}

/* ============ 첫 화면(로그인 전) ============ */
.landing{min-height:100dvh;display:grid;place-items:center;padding:40px 20px calc(40px + env(safe-area-inset-bottom))}
.land{width:100%;max-width:1040px;display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.land-brand{display:flex;align-items:center;gap:14px;font-weight:800;font-size:20px;letter-spacing:-.3px}
.land h1{font-family:var(--diary);font-weight:700;font-size:clamp(34px,5vw,50px);line-height:1.25;letter-spacing:-1px;margin:28px 0 16px}
.land-lead{font-size:18px;color:var(--ink2);max-width:30em;margin:0 0 28px}
.app-soon{margin:-12px 0 18px;padding:10px 14px;border-radius:14px;background:var(--butter-soft);border:1.5px dashed var(--butter);font-size:14px;color:var(--ink2)}
.app-soon b{color:var(--ink);margin-right:4px}
.land-badges{list-style:none;padding:0;margin:0 0 18px;display:flex;flex-wrap:wrap;gap:8px}
.land-badges li{display:inline-flex;align-items:center;gap:5px;padding:5px 12px 5px 9px;border-radius:999px;background:var(--ink);color:var(--paper);font-size:14px;font-weight:700}
.land-badges .ic{width:16px;height:16px;color:var(--butter)}
.land-feats{list-style:none;padding:0;margin:0 0 24px;display:grid;gap:8px}
.land-feats li{display:flex;gap:10px;align-items:flex-start;color:var(--ink2)}
.land-feats .dot{width:10px;height:10px;border-radius:50%;margin-top:8px;flex:none}
.land-cta{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.land-cta .share-row{margin:0}
/* 컴퓨터에서는 첫 화면이 스크롤 없이 한 번에 보이게 */
@media (min-width:900px){
  .landing{padding:20px 24px}
  .land{max-width:1240px;grid-template-columns:1.35fr .65fr;gap:36px}
  .land-brand{font-size:18px}
  .land h1{font-size:clamp(28px,3vw,38px);margin:14px 0 10px}
  .land-lead{font-size:16px;margin:0 0 12px}
  .app-soon{margin:0 0 12px;padding:7px 12px;font-size:13px}
  .land-badges{margin:0 0 12px;gap:6px}
  .land-badges li{font-size:13px;padding:4px 10px 4px 8px}
  .land-feats{margin:0 0 18px;gap:4px}
  .demo-note{margin-top:10px}
  .anywhere{padding:22px}
  .devices{max-height:150px;margin:0 0 12px}
  .anywhere .addr-t strong{font-size:19px}
  .land-cta{flex-wrap:nowrap}
  .land-cta .share-row{flex-wrap:nowrap}
}
@media (min-width:900px) and (max-height:840px){
  .landing{padding:12px 24px}
  .land h1{font-size:30px;margin:8px 0 8px}
  .land-lead{font-size:15px;line-height:1.5;margin-bottom:10px}
  .app-soon{margin-bottom:10px}
  .land-badges{margin-bottom:10px}
  .land-feats{margin-bottom:14px;gap:2px;font-size:15px}
  .devices{max-height:110px}
}
.demo-note{margin-top:16px;font-size:14px;color:var(--ink3);max-width:32em}
.anywhere{background:var(--surface);border:1.5px solid var(--line);border-radius:28px;padding:28px}
.anywhere h2{font-size:20px;margin:0 0 4px;letter-spacing:-.3px}
.anywhere>p{margin:0 0 18px;color:var(--ink2)}
/* 첫 화면: AI 빨간펜 피드백 예시 카드 */
.land>*{min-width:0}
.land-side{display:grid;gap:22px;align-content:start;min-width:0}
.ai-sample{position:relative;margin:0;background:var(--surface);border:1.5px solid var(--line);border-radius:28px;padding:22px 24px 18px;box-shadow:0 14px 34px rgba(31,42,68,.10);transform:rotate(1.2deg)}
.ais-tag{display:inline-block;margin:0 0 12px;padding:4px 12px;border-radius:999px;background:var(--coral-soft);color:var(--coral-ink);font-size:13px;font-weight:800}
.ais-top{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.ais-av{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--sage);color:var(--paper);font-size:14px}
.ais-date{margin-left:auto;color:var(--ink3);font-weight:600;font-size:13px}
.ais-text{margin:10px 0 0;font-family:"Nanum Pen Script",cursive;font-size:25px;line-height:36px;background-image:repeating-linear-gradient(transparent 0,transparent 35px,var(--rule) 35px,var(--rule) 36px)}
.ais-text mark{color:inherit;border-radius:4px;padding:0 2px}
.ais-text mark.ais-ok{background:rgba(80,200,120,.35)}
.ais-text mark.ais-fix{background:rgba(255,214,51,.6)}
.ais-stamp{position:absolute;right:22px;bottom:12px;transform:rotate(-10deg);color:var(--coral-ink);border:2.5px solid var(--coral);border-radius:48% 52% 45% 55%/55% 45% 55% 45%;padding:5px 10px;font-family:var(--diary);font-weight:700;font-size:15px;background:var(--surface)}
.ais-pen{margin-top:12px;border:2px solid var(--coral);border-radius:16px;padding:10px 14px;display:grid;gap:6px;font-size:14px;line-height:1.5;color:var(--ink2)}
.ais-pen p{margin:0}
.ais-pen b{display:inline-block;margin-right:6px;color:var(--coral-ink)}
.ais-pen s{color:var(--coral-ink)}
.ais-pen strong{color:var(--sage)}
.ais-heart{margin:10px 0 0;font-size:14px;font-weight:700;color:var(--coral-ink)}
@media (max-width:760px){ .ai-sample{transform:none} }
.devices{width:100%;height:auto;display:block;margin:4px 0 18px}
.addr{display:flex;align-items:center;justify-content:space-between;gap:12px;border:2px dashed var(--ink);border-radius:16px;padding:12px 12px 12px 18px;background:var(--paper)}
.addr-t{display:flex;flex-direction:column}
.addr-t small{font-size:13px;color:var(--ink3);font-weight:600}
.addr-t strong{font-size:22px;letter-spacing:-.2px}
.dev-rows{display:grid;gap:10px;margin-top:16px}
.dev-row{display:flex;gap:12px;align-items:center;font-size:15px;color:var(--ink2)}
.dev-row b{color:var(--ink);min-width:7.5em}

/* ============ 가입 · 프로필 선택 ============ */
.center-page{min-height:100dvh;display:grid;place-items:center;padding:32px 20px}
.onb{width:100%;max-width:880px}
.onb h1,.picker h1{font-family:var(--diary);font-size:34px;margin:18px 0 8px;letter-spacing:-.6px}
.onb-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:24px}
.card h2{font-size:19px;margin:0 0 6px}
.card p{margin:0 0 16px;color:var(--ink2);font-size:15px}
.stack{display:grid;gap:14px}
.picker{text-align:center;max-width:720px;width:100%}
.pick-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:22px;margin:32px 0}
.pick{display:flex;flex-direction:column;align-items:center;gap:10px;border:0;background:none;padding:8px;border-radius:18px;min-width:110px}
.pick .av{box-shadow:0 0 0 4px var(--paper),0 0 0 6px transparent;transition:box-shadow .15s}
.pick:hover .av{box-shadow:0 0 0 4px var(--paper),0 0 0 6px var(--butter)}
.pick strong{font-size:17px}
.pick small{color:var(--ink3);font-size:13px}
.pick:disabled{opacity:.45;cursor:not-allowed}
.pin-box{max-width:320px;margin:0 auto 24px;text-align:left}
.pin-box input{font-size:28px;letter-spacing:12px;text-align:center}

/* ============ 앱 틀 ============ */
.shell{min-height:100dvh}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1.5px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav-brand,.nav-foot{display:none}
.nav-items{display:flex;justify-content:space-around}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:6px 4px;border-radius:12px;color:var(--ink3);font-size:12px;font-weight:650;min-height:52px}
.nav-item .ic{width:24px;height:24px}
.nav-item.on{color:var(--ink)}
.nav-item.on .ic{color:var(--coral)}
.top{position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-brand{display:flex;align-items:center;gap:10px;font-weight:800;min-width:0}
.top-brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-acts{display:flex;align-items:center;gap:4px;flex:none}
.me-chip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font-weight:650;font-size:14px}
.sheet{position:relative;max-width:1080px;margin:0 auto;padding:24px 18px 120px}
.sub-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:18px}

/* 위쪽 머리: 제목 + 모양 · 글씨 고르기 + 즐겨찾기 + 폴더 탭 */
.frame{max-width:1320px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 0}
.mast{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px}
.mast-l{display:flex;align-items:center;gap:12px;min-width:0}
.mast-t{font-family:var(--diary);font-size:26px;line-height:1.2;margin:0;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prefs{display:grid;gap:6px;justify-items:end;max-width:100%}
.mast-sub{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:12px 0 0}
.mast-sub .me-chip small{color:var(--ink3);font-weight:600;font-size:12px}
.mast-sub .nav-addr{font-size:13px;color:var(--ink3)}
.mast-sub .nav-addr strong{color:var(--ink);margin-left:4px}
.mast-sub .link-btn{margin-left:auto}
.fav-row{display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 2px 6px;margin-top:10px}
.fav-row::-webkit-scrollbar{display:none}
.fav-h{display:inline-flex;align-items:center;gap:6px;font-size:15px;white-space:nowrap;margin-right:4px}
.fav-h .ic{color:var(--butter);fill:var(--butter)}
.fav{display:inline-flex;align-items:center;gap:6px;flex:none;min-height:38px;padding:0 14px 0 6px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;font-weight:650;text-decoration:none;white-space:nowrap}
.fav:hover{border-color:var(--ink3)}
.fav .lk-mark{width:26px;height:26px;border-radius:50%;font-size:12px}
.fav.add{border-style:dashed;padding:0 14px;background:none;color:var(--ink2)}
.fav.add.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.fav-panel{margin-top:6px}
.ftabs{display:none}
.sheet .page-sep{display:none}
@media (min-width:760px){
  .frame{padding:22px 32px 0}
  .mast-t{font-size:34px}
  .top{display:none}
  .nav{display:none}
  .ftabs{display:flex;align-items:flex-end;gap:4px;margin-top:14px;padding-left:18px;overflow-x:auto}
  .ftab{display:inline-flex;align-items:center;gap:8px;flex:none;border:0;border-radius:14px 14px 0 0;padding:10px 20px;min-height:46px;background:var(--tb);color:var(--ink2);font-weight:700;font-size:15px;opacity:.8}
  .ftab .ic{color:var(--tl)}
  .ftab:hover{opacity:1}
  .ftab.on{min-height:54px;opacity:1;color:var(--ink);font-size:16px;box-shadow:inset 0 3px 0 var(--tl)}
  .sheet{max-width:none;margin:0 0 40px;padding:32px 40px 56px 72px;background:var(--surface);border-radius:0 var(--r-lg) var(--r-lg) var(--r-lg);border-top:6px solid var(--tl);box-shadow:0 10px 30px rgba(31,42,68,.08)}
  .sheet .block{background:var(--paper)}
  .sheet .st-row,.sheet .ct-card,.sheet .empty,.sheet .qn,.sheet .qs-row,.sheet .qg-stats div,.sheet .qg-chart{background:var(--surface)}
  /* 노트 여백선: 이 앱의 상징 */
  .sheet::before{content:"";position:absolute;left:40px;top:0;bottom:0;width:2px;background:var(--margin)}
}
@media (min-width:760px){ .prefs{display:flex;gap:10px;align-items:center} }

  .mast{align-items:center}

  .prefs{justify-items:start;width:100%}

/* ============ 홈 ============ */
.hero-date{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
.hero-date p{margin:0;font-weight:600}
.today-date{font-family:var(--diary);font-size:clamp(32px,5vw,46px);line-height:1.15;margin:4px 0 0;letter-spacing:-1px}
.home-grid{display:grid;gap:20px}
.col{display:grid;gap:20px;align-content:start}
@media (min-width:1100px){.home-grid{grid-template-columns:1.35fr 1fr}}
.block{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:20px}
.block-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.block-h h2{font-size:18px;margin:0;letter-spacing:-.3px}
.st-list{list-style:none;padding:0;margin:0 0 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.st-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--paper)}
.st-name{font-weight:650;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.week{border-top:1px dashed var(--line);padding-top:14px;overflow-x:auto}
.wk-row{display:grid;grid-template-columns:4.5em repeat(7,minmax(28px,1fr));align-items:center;gap:4px;min-height:32px}
.wk-head{font-size:12px;color:var(--ink3);text-align:center}
.wk-h{display:flex;flex-direction:column;align-items:center;gap:2px}
.wk-h b{display:grid;place-items:center;width:26px;height:26px;font-size:14px;color:var(--ink2)}
.wk-h.today b{border-radius:50%;background:var(--ink);color:var(--paper)}
.wk-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-dot{justify-self:center;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line)}
.wk-dot.on{background:var(--coral);border-color:var(--coral)}
.wk-dot.half{border-color:var(--coral);background:linear-gradient(90deg,var(--coral) 50%,transparent 50%)}
button.wk-dot{position:relative;padding:0;background-color:transparent;border-color:var(--ink3)}
button.wk-dot::after{content:"";position:absolute;inset:-10px}
button.wk-dot:hover{border-color:var(--coral);box-shadow:0 0 0 3px var(--coral-soft)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink3);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
/* 달력형 첫 화면 */
.ct-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.ct-card{border-radius:16px;background:var(--paper);padding:12px 14px;border-left:5px solid var(--pc)}
.ct-top{display:flex;align-items:center;gap:10px}
.ct-top b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct-body{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;min-height:38px}
.ct-title{font-family:var(--diary);font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal{margin-top:20px}
.cal-h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.cal-h h2{font-size:20px;margin:0 6px;letter-spacing:-.3px}
.cal-h .flip .ic{transform:scaleX(-1)}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink2);margin-bottom:12px}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.cal-legend i{width:10px;height:10px;border-radius:50%}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-w{text-align:center;font-size:13px;font-weight:650;color:var(--ink3);padding:4px 0}
.cal-cell{display:flex;flex-direction:column;align-items:stretch;gap:4px;min-height:104px;padding:8px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);text-align:left;min-width:0}
.cal-cell:hover{border-color:var(--ink3)}
.cal-cell.future{background:var(--surface2)}
.cal-cell.today{border:2.5px solid var(--coral)}
.cal-cell.sel{box-shadow:0 0 0 3px var(--butter)}
.cal-n{font-weight:800;font-size:17px;line-height:1.2;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px}
.cal-n small{font-size:11px;font-weight:650}
.red .cal-n,.cal-w.red{color:var(--coral-ink)}
.blue .cal-n,.cal-w.blue{color:#3B6FB6}
[data-theme="dark"] .blue .cal-n,[data-theme="dark"] .cal-w.blue{color:#8DB4EA}
.cal-sc{display:grid;gap:3px;min-width:0}
.cal-sc em{font-style:normal;font-size:11px;font-weight:650;background:var(--butter-soft);color:#7A5710;border-radius:6px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[data-theme="dark"] .cal-sc em{color:var(--butter)}
.cal-sc em.more{background:none;padding:0 2px;color:var(--ink3)}
.cal-dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:auto}
.cal-dots i{width:9px;height:9px;border-radius:50%}
.cd-h{font-size:15px;margin:18px 0 8px;color:var(--ink2)}
#cal-day{margin-top:20px;scroll-margin-top:80px}
#cal-day+.block{margin-top:20px}
.cal+.block:not(#cal-day){margin-top:20px}
@media (max-width:640px){
  .ct-grid{grid-template-columns:1fr 1fr;gap:8px}
  .ct-card{padding:10px}
  .ct-top .pill{display:none}
  .ct-body{flex-direction:column;align-items:flex-start;gap:6px;font-size:14px}
  .ct-body .muted{font-size:13px}
  .cal-grid{gap:3px}
  .cal-cell{min-height:64px;padding:5px 4px;border-radius:10px}
  .cal-n{font-size:14px}
  .cal-n small{display:none}
  .cal-sc em{font-size:0;height:5px;padding:0;background:var(--butter)}
  .cal-sc em.more{display:none}
  .cal-dots i{width:7px;height:7px}
}
/* 화면 위쪽: 모양 · 글씨 고르기 */
.hb-g{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding:2px}
.hb-g b{font-size:13px;color:var(--ink3);margin-right:4px;white-space:nowrap}
.hb-g span{width:38px;min-height:38px;padding:0;justify-content:center;font-size:18px;white-space:nowrap}
.hb-g span .ic{width:20px;height:20px}
.hb-g span.pen{font-size:24px}
.hb-g+.hb-g{border-left:1.5px solid var(--line);padding-left:10px}
/* 4분할형 첫 화면 */
.quad{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.q-cell{min-width:0;display:flex;flex-direction:column}
.q-cell .block-h{flex:none}
.q-body{min-height:0}
.q-mini{align-items:center;justify-content:center;text-align:center;gap:10px}
.q-mini .today-date{font-size:clamp(26px,3vw,36px);margin:0}
.qm-who{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.qm-who li{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;min-width:44px}
.qm-who li.no .av{opacity:.35}
.qm-av{position:relative;display:inline-flex}
.qm-av i{position:absolute;right:-4px;bottom:-3px;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:800;line-height:1;border:2px solid var(--paper)}
.qm-av i.ok{background:var(--sage);color:var(--paper)}
.qm-av i.ing{background:var(--butter);color:var(--ink)}
.qn-list{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.qn{display:flex;gap:10px;align-items:flex-start;width:100%;border:0;border-radius:14px;background:var(--paper);padding:10px 12px;text-align:left}
.qn:hover{background:var(--surface2)}
.qn-t{flex:1;min-width:0;display:grid;gap:4px}
.qn-h{display:flex;gap:6px;align-items:baseline;font-size:13px;color:var(--ink3)}
.qn-h b{color:var(--ink);font-size:14px}
.qn-h time{margin-left:auto;white-space:nowrap}
.qn-x{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--surface);border-radius:10px;padding:4px 10px}
/* 스티커판: 한 사람 한 줄 (한 달 칸이 한 줄에) */
.qs-list{display:grid;gap:5px}
.qs-row{display:flex;gap:8px;align-items:center;background:var(--paper);border-radius:12px;padding:4px 8px}
.qs-who{display:flex;align-items:center;gap:4px;min-width:62px;font-weight:650;line-height:1}
.qs-who small{color:var(--coral-ink);font-size:11px;white-space:nowrap}
.qs-st{display:grid;grid-template-columns:repeat(var(--n,31),minmax(0,1fr));gap:2px;flex:1;min-width:0}
.qs-st i{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:8px;line-height:1}
.qs-st i.on{background:var(--pc);border-color:var(--pc);color:var(--pt)}
.qs-st i.fut{border-style:dashed;opacity:.55}
/* 성장 기록: 그림 글자 + 숫자 한 줄 */
.q-cell .block-h h2 small{font-size:13px;font-weight:500}
.qg-who{display:flex;gap:4px}
.qg-who button{border:2px solid transparent;border-radius:50%;padding:1px;background:none;opacity:.5;line-height:0}
.qg-who button.on{border-color:var(--ink);opacity:1}
.qg-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:8px}
.qg-stats div{background:var(--paper);border-radius:10px;padding:4px 6px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:15px}
.qg-stats b{font-size:17px;color:var(--ink);line-height:1.3}
.qg-chart{background:var(--paper);border-radius:10px;padding:6px 10px;margin-bottom:8px;font-size:12px;color:var(--ink3)}
.qg-chart svg{display:block;width:100%;height:40px}
.qg-words{display:flex;flex-wrap:nowrap;gap:5px;font-size:12px;overflow:hidden;white-space:nowrap;align-items:center;color:var(--ink3)}
.qg-words em{font-style:normal;flex:none}
.qg-words span{background:var(--coral-soft);color:var(--coral-ink);border-radius:8px;padding:2px 7px;font-weight:650}
@media (min-width:760px){ .quad{grid-template-columns:repeat(2,minmax(0,1fr))} }
/* 가로 화면(컴퓨터 · 아이패드 가로)에서는 네 칸이 한 화면에 다 들어오게.
   1 · 3 · 4칸은 내용을 줄여서 스크롤 없이, 2칸(교환일기)만 길면 스크롤 */
@media (min-width:760px) and (orientation:landscape){
  .quad{grid-template-rows:repeat(2,minmax(0,1fr));height:calc(100dvh - 350px);min-height:340px}
  .sheet:has(.quad){padding-top:20px;padding-bottom:20px;margin-bottom:12px}
  .quad .block{padding:14px 18px}
  .quad .block-h{margin-bottom:10px}
  .q-cell{overflow:hidden;container-type:size}
  .q-body{flex:1;overflow:hidden}
  .q-cell:nth-child(2) .q-body{overflow:auto;scrollbar-width:thin}
  /* 칸이 낮으면 덜 중요한 것부터 숨기기 */
  @container (max-height:250px){ .qg-chart{display:none} }
  @container (max-height:230px){ .q-mini .today-date{font-size:26px} .qm-who b{display:none} .qs-row{padding:1px 8px} .qs-list{gap:3px} }
  @container (max-height:180px){ .q-mini .today-date{font-size:22px} .q-mini .btn{min-height:40px;padding:0 16px} .qs-who .av{width:16px!important;height:16px!important;font-size:9px!important} }
  @container (max-height:110px){ .qg-words{display:none} }
}
/* 높이가 낮은 가로 화면: 머리 부분이 납작해진 만큼 네 칸을 더 크게 */
@media (min-width:760px) and (orientation:landscape) and (max-height:900px){ .quad{height:calc(100dvh - 290px);min-height:320px} }
@media (min-width:760px) and (orientation:landscape) and (max-height:700px){ .quad{height:calc(100dvh - 305px);min-height:300px} }
/* 앨범형 첫 화면 */
.album{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-auto-rows:150px;grid-auto-flow:dense}
.al{position:relative;overflow:hidden;border:0;padding:0;border-radius:14px;background:var(--pc);color:var(--pt);text-align:left}
.al.big{grid-column:span 2;grid-row:span 2}
.al img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.al:hover img{transform:scale(1.04)}
.al-t{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(transparent,rgba(20,26,40,.6))}
.al.txt{display:flex;flex-direction:column;justify-content:space-between;padding:12px;background:linear-gradient(135deg,var(--pc),color-mix(in srgb,var(--pc) 55%,var(--paper)))}
.al.txt strong{font-family:var(--diary);font-size:17px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.al.big.txt strong{font-size:24px;-webkit-line-clamp:5}
.al.txt small{font-size:12px;font-weight:650;opacity:.85}
@media (max-width:640px){ .album{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:31vw;gap:5px} .al.txt strong{font-size:14px} .al.big.txt strong{font-size:19px} }
.sc-day{margin:0 0 12px}
.sc-day h3{font-size:14px;margin:0 0 6px;color:var(--ink2)}
.sc-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.sc-item{display:flex;align-items:center;gap:10px;padding:10px 6px 10px 12px;border-radius:12px;background:var(--paper)}
.sc-time{font-size:13px;color:var(--ink3);min-width:4.6em;font-variant-numeric:tabular-nums}
.sc-title{flex:1;font-weight:600;min-width:0}
details.add{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
details.add summary{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:650;color:var(--ink2);list-style:none;min-height:40px}
details.add summary::-webkit-details-marker{display:none}
details.add[open] summary{margin-bottom:12px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .span2{grid-column:1/-1}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg legend{width:100%}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink2);font-weight:650}
.seg input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.seg input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
form:has(input[name="role"][value="parent"]:checked) .child-only{display:none}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.lk{position:relative}
.lk-a{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:16px;background:var(--paper);border:1.5px solid transparent;color:var(--ink);text-decoration:none;min-height:112px}
.lk-a:hover{border-color:var(--line)}
.lk-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;font-weight:800;font-size:17px}
.lk-t{font-weight:650;line-height:1.3}
.lk-d{font-size:12px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk-del{position:absolute;top:6px;right:6px}
.any-mini .addr{margin-top:12px}
.any-mini p{margin:0;color:var(--ink2);font-size:15px}
.empty{padding:18px;border-radius:14px;background:var(--paper);color:var(--ink2);font-size:15px;margin:0}

/* ============ 일기 목록 ============ */
.page-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.page-h h1{font-family:var(--diary);font-size:34px;margin:0;letter-spacing:-.6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:6px;flex:none;min-height:40px;padding:0 14px 0 6px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:650;font-size:14px}
.chip.all{padding:0 16px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.feed{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.dcard{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;padding:18px 20px;border-radius:20px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.dcard:hover{border-color:var(--ink3)}
.dcard-top{display:flex;align-items:center;gap:8px;font-size:14px}
.dcard-name{font-weight:700}
.dcard-date{color:var(--ink3);margin-left:auto}
.dcard-title{font-family:var(--diary);font-size:21px;margin:4px 0 0;line-height:1.35}
.dcard-ex{margin:0;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dcard-foot{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--ink3);margin-top:4px}
.mood-chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink2)}
.mood-chip i{width:10px;height:10px;border-radius:50%}

/* ============ 일기 읽기 ============ */
.detail{max-width:760px}
.detail-h{display:flex;align-items:center;gap:12px}
.detail-h div{display:flex;flex-direction:column;flex:1;line-height:1.35}
.detail-title{font-family:var(--diary);font-size:clamp(28px,4vw,36px);margin:22px 0 12px;letter-spacing:-.5px;line-height:1.3}
.paper-lines{font-family:var(--diary);font-size:var(--diary-size);line-height:var(--diary-lh);white-space:pre-wrap;word-break:keep-all;padding:0 4px 4px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--diary-lh) - 1px),var(--rule) calc(var(--diary-lh) - 1px),var(--rule) var(--diary-lh))}
.comments{margin-top:40px;border-top:1.5px solid var(--line);padding-top:22px}
.comments h2{font-size:18px;margin:0 0 16px}
.thread{list-style:none;margin:0;padding:0;display:grid;gap:16px}
.thread.nested{margin-top:14px;padding-left:14px;border-left:2px solid var(--line)}
.cmt{display:grid;grid-template-columns:32px 1fr;gap:10px}
.cmt-meta{display:flex;align-items:baseline;gap:8px;font-size:14px}
.cmt-meta .muted{font-size:13px}
.cmt-text{margin:2px 0 4px;white-space:pre-wrap}
.cmt-acts{display:flex;gap:12px}
.cmt-form{display:grid;gap:8px;margin-top:10px}
.comments>.cmt-form{margin-top:24px}

/* ============ 일기 쓰기 ============ */
.write{max-width:780px}
.moods{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.mood{position:relative}
.mood input{position:absolute;opacity:0;width:1px;height:1px}
.mood span{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;color:var(--ink2)}
.mood span i{width:12px;height:12px;border-radius:50%}
.mood input:checked+span{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.mood input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.date-l{max-width:220px}
.w-title{font-family:var(--diary);font-size:26px;font-weight:700;border:0;border-bottom:2px solid var(--ink);border-radius:0;background:transparent;padding:10px 4px;margin-bottom:14px}
.w-text{font-family:var(--diary);font-size:var(--diary-size);line-height:var(--diary-lh);min-height:calc(var(--diary-lh) * 10);border:1.5px solid var(--line);border-radius:16px;padding:6px 16px;background-color:var(--surface);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--diary-lh) - 1px),var(--rule) calc(var(--diary-lh) - 1px),var(--rule) var(--diary-lh));background-position:0 6px;background-attachment:local}
.w-count{text-align:right;font-size:13px;margin-top:4px}
.w-acts{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}
.ai-box{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;margin-top:18px;padding:18px 20px;border-radius:18px;background:var(--butter-soft)}
.ai-box strong{display:inline-flex;align-items:center;gap:6px}
.ai-box p{margin:4px 0 0;font-size:14px;color:var(--ink2);max-width:34em}
.ai-res{margin-top:22px;padding:20px 22px;border-radius:18px;background:var(--surface);border:1.5px solid var(--butter)}
.ai-res h2{display:flex;align-items:center;gap:8px;font-size:17px;margin:0 0 8px}
.ai-res>p{margin:6px 0}
.ai-praise{font-weight:650}
.fix-list{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.fix{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 14px;border-radius:12px;background:var(--paper)}
.fix-w{text-decoration:line-through;text-decoration-color:var(--coral);text-decoration-thickness:2px;color:var(--ink2);font-weight:600}
.fix-r{font-weight:800;font-size:17px}
.fix-st{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--coral-ink)}
.fix.fixed .fix-st{color:var(--sage)}
.fix-e{flex-basis:100%;margin:0;font-size:14px;color:var(--ink2)}
/* AI 빨간펜 선생님: 일기 칸 위 형광펜 + 빨간펜 칸 (공부방 빨간펜과 같은 모양) */
.w-ed{position:relative}
.w-ed .w-text{overflow:hidden;resize:none;white-space:pre-wrap;overflow-wrap:break-word;word-break:keep-all;letter-spacing:normal}
.w-hl{position:absolute;inset:0;border:1.5px solid transparent;border-radius:16px;padding:6px 16px;font-family:var(--diary);font-size:var(--diary-size);line-height:var(--diary-lh);white-space:pre-wrap;overflow-wrap:break-word;word-break:keep-all;letter-spacing:normal;color:transparent;pointer-events:none;overflow:hidden}
.w-hl mark{color:transparent;background:rgba(255,214,51,.55);border-radius:4px}
.w-hl mark.pen-ok{background:rgba(80,200,120,.35)}
.pen{margin-top:18px;border:2.5px solid var(--coral);border-radius:18px;padding:16px 18px;background:var(--surface)}
.pen-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.pen h3{margin:0;color:var(--coral-ink);font-size:18px}
.pen p{margin:8px 0 0;color:var(--ink2);font-size:15px}
.btn-pen{background:var(--coral);color:#fff}
.btn-pen:disabled{opacity:.7}
.pen-gauge{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:12px}
.pen-gauge i{display:block;height:100%;background:var(--butter);border-radius:99px;transition:width .3s}
.pen-gauge.full i{background:var(--sage)}
.pen .pen-cnt{font-size:13px;color:var(--ink3);margin:4px 0 0;text-align:right}
.pen-fb{background:var(--sage-soft);border-radius:12px;padding:10px 14px;margin:12px 0 4px}
.pen-fb b{font-size:14px}
.pen-fb p{margin:2px 0 8px;color:var(--ink)}
.pen-fb p:last-child{margin-bottom:0}
.pen mark{color:inherit;border-radius:4px;padding:0 3px}
.pen mark.pen-x{background:rgba(255,214,51,.6)}
.pen mark.pen-ok{background:rgba(80,200,120,.35)}
.pen-list{margin:12px 0 0;padding-left:1.4em;display:grid;gap:10px}
.pen-list li.done{opacity:.85}
.pen-chip{display:inline-block;font-size:12px;border-radius:99px;padding:0 8px;margin-right:6px;background:var(--coral-soft);color:var(--coral-ink);font-weight:700}
.pen-mini{border:1.5px dashed var(--line);background:none;border-radius:8px;font-size:13px;padding:2px 8px;margin:6px 6px 0 0;color:var(--ink2)}
.pen-mini:hover{border-color:var(--coral);color:var(--coral-ink)}
.pen-ans{margin-top:6px;padding:8px 12px;border-radius:10px;background:var(--surface2)}
.pen-w{color:var(--coral-ink);text-decoration:line-through}
.pen-r{color:var(--sage);font-weight:800}
.pen-good{color:var(--sage);font-weight:700}
.pen-soft{color:var(--ink3);font-size:14px}
.pen .pen-warn{color:var(--coral-ink);font-size:14px}
.pen-orig{margin-top:12px;font-size:14px;color:var(--ink2)}
.pen-orig p{white-space:pre-wrap;font-family:var(--diary);background:var(--surface2);border-radius:10px;padding:10px 12px;margin:6px 0 0}
/* 칭찬 도장 · 하트 */
.react{margin:20px 0 6px;display:grid;gap:12px}
.stamp{justify-self:start;transform:rotate(-8deg);color:var(--coral-ink);border:3px solid var(--coral);border-radius:48% 52% 45% 55%/55% 45% 55% 45%;padding:8px 20px;font-family:var(--diary);font-weight:700;font-size:22px;letter-spacing:1px}
.react-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.heart-btn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:700}
.heart-btn.on{background:var(--coral-soft);border-color:var(--coral);color:var(--coral-ink)}
.stamp-pick{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.stamp-btn{border:1.5px dashed var(--coral);color:var(--coral-ink);background:none;border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px}
.stamp-btn.on{background:var(--coral);border-style:solid;color:var(--paper)}
.stamp-mini{color:var(--coral-ink);border:1.5px solid var(--coral);border-radius:6px;padding:0 6px;font-size:12px;font-weight:800;transform:rotate(-4deg)}
/* 일기 PDF로 저장 화면 */
.pdf-box fieldset{border:0;margin:0;padding:0}
.pdf-box legend{font-weight:700;margin-bottom:8px}
.lay-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.lay{position:relative}
.lay input{position:absolute;opacity:0;width:1px;height:1px}
.lay span{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;padding:10px 8px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);text-align:center;cursor:pointer}
.lay b{font-size:14px}
.lay small{font-size:12px;color:var(--ink3);line-height:1.35}
.lay input:checked+span{border-color:var(--coral);box-shadow:0 0 0 2px var(--coral) inset;background:var(--coral-soft)}
.lay input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.pdf-who{display:flex;flex-wrap:wrap;gap:8px 14px}
.pdf-ck{display:inline-flex!important;align-items:center;gap:6px;flex-direction:row!important;font-weight:600}
.pdf-ck input{width:auto}
.print-shops p,.book-soon p{margin:8px 0;color:var(--ink2);font-size:14px}
.print-shops .row{flex-wrap:wrap;gap:8px}
.book-soon>div{display:flex;align-items:center;gap:8px}
.book-soon .pill{background:var(--butter-soft);color:var(--ink);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}

/* ============ 퀴즈 ============ */
.q-words{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.wd{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:14px;background:var(--paper)}
.wd s{color:var(--ink3);text-decoration-color:var(--coral);font-size:14px}
.wd b{font-size:18px}
.wd small{color:var(--ink3);font-size:12px}
.q-start{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.quiz{max-width:640px}
.q-prog{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:6px 0 24px}
.q-prog i{display:block;height:100%;background:var(--coral);border-radius:99px;transition:width .3s}
.q-kind{font-size:14px;font-weight:700;color:var(--coral-ink)}
.q-text{font-family:var(--diary);font-size:26px;line-height:1.45;margin:8px 0 22px}
.q-ctx{display:block;margin-top:12px;padding:14px 16px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);font-size:22px}
.q-opts{display:grid;gap:10px}
.q-opt{text-align:left;width:100%;padding:16px 18px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);font-size:19px;font-weight:650;min-height:56px}
.q-opt:hover:not(:disabled){border-color:var(--ink3)}
.q-opt:disabled{cursor:default}
.q-opt.right{border-color:var(--sage);background:var(--sage-soft)}
.q-opt.wrong{border-color:var(--coral);background:var(--coral-soft)}
.q-ox{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.q-ox .q-opt{text-align:center;font-size:44px;font-family:var(--diary);min-height:120px}
.q-fb{margin-top:18px;padding:16px 18px;border-radius:16px;background:var(--paper);border:1.5px dashed var(--line)}
.q-fb strong{display:block;font-size:17px;margin-bottom:4px}
.q-end{text-align:center;padding:28px 0}
.q-score{font-family:var(--diary);font-size:64px;margin:6px 0}

/* ============ 우리 가족 ============ */
.fam-grid{display:grid;gap:20px}
@media (min-width:1100px){.fam-grid{grid-template-columns:1fr 1fr}}
.code{font-family:var(--diary);font-size:36px;letter-spacing:6px;font-weight:700}
.mem-list{list-style:none;margin:0 0 6px;padding:0;display:grid;gap:8px}
.mem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--paper)}
.mem span{flex:1;font-weight:650}
.mem .av{flex:none}
.mem{flex-wrap:wrap}
.kid-start{max-width:440px;text-align:center}
.kid-start .logo-wrap{margin:0 auto}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0}
.set-row+.set-row{border-top:1px dashed var(--line)}

/* ============ 사진 · 위치 · 소리 · 태그 ============ */
.pg{container-type:inline-size;margin:18px 0 22px}
.pg-in{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:60px;grid-auto-rows:calc((100cqw - 15px) / 6);grid-auto-flow:dense;gap:3px;border-radius:18px;overflow:hidden}
.pg-cell{padding:0;border:0;background:var(--surface2);overflow:hidden;cursor:zoom-in;border-radius:0}
.pg-cell img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
.pg-cell:hover img{transform:scale(1.03)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 6px}
.loc{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 8px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-size:14px;font-weight:600;color:var(--ink2);text-decoration:none}
.loc .ic{width:16px;height:16px;color:var(--coral)}
.htag{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:999px;border:0;background:var(--butter-soft);color:#7A5510;font-size:14px;font-weight:650}
.htag .ic{width:14px;height:14px}
[data-theme="dark"] .htag{color:var(--butter)}
.htag small{font-weight:500;opacity:.7}
.htag.on{background:var(--ink);color:var(--paper)}
.tag-inline{border:0;background:none;padding:0;font:inherit;color:var(--coral-ink);cursor:pointer}
.audio-card{display:flex;align-items:center;gap:12px;margin:18px 0 0;padding:10px 12px 10px 14px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line)}
.audio-card>.ic{color:var(--coral)}
.audio-card audio{flex:1;min-width:0;height:40px}
.media{margin-top:18px;display:grid;gap:14px}
.media-sec{padding:16px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line)}
.media-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 10px;font-weight:700;font-size:15px}
.media-h span{font-weight:500;color:var(--ink3);font-size:13px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--surface2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .icon-btn{position:absolute;top:4px;right:4px;width:28px;height:28px;background:rgba(20,26,40,.62);color:#fff}
.thumb-add{position:relative;display:grid;place-items:center;align-content:center;gap:4px;aspect-ratio:1;border-radius:12px;border:2px dashed var(--line);color:var(--ink3);font-size:13px;font-weight:650;cursor:pointer}
.thumb-add input{position:absolute;opacity:0;width:1px;height:1px}
.thumb-add:focus-within{outline:3px solid var(--focus)}
.tag-in{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper)}
.tag-in input{flex:1;min-width:9em;border:0;background:none;padding:6px}
.tag-in input:focus-visible{outline:none}
.tag-in:focus-within{outline:3px solid var(--focus);outline-offset:1px}
.rec{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rec-dot{width:12px;height:12px;border-radius:50%;background:var(--coral);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.search{position:relative;margin-bottom:12px}
.search>.ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.search input{padding-left:42px}
.tags-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.dcard-ph{position:relative;display:block;margin:-18px -20px 6px;height:170px;border-radius:18px 18px 0 0;overflow:hidden;background:var(--surface2)}
.dcard-ph img{width:100%;height:100%;object-fit:cover;display:block}
.dcard-ph em{position:absolute;right:10px;bottom:10px;font-style:normal;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(20,26,40,.65);color:#fff}
.dcard-meta{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--ink3)}
.dcard-meta span{display:inline-flex;align-items:center;gap:3px}
.dcard-meta .ic{width:14px;height:14px}
.ai-sum{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--butter-soft);color:#7A5710}
[data-theme="dark"] .ai-sum{color:var(--butter)}
.ai-sum.none{background:var(--surface2);color:var(--ink3)}
.ai-sum .ic{width:14px;height:14px}
.lb{position:fixed;inset:0;z-index:60;background:rgba(12,15,24,.94);display:grid;place-items:center;padding:64px 12px calc(64px + env(safe-area-inset-bottom))}
.lb img{max-width:100%;max-height:calc(100dvh - 128px);object-fit:contain;border-radius:6px}
.lb button{position:absolute;display:grid;place-items:center;width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff}
.lb .ic{width:24px;height:24px}
.lb-x{top:calc(10px + env(safe-area-inset-top));right:12px}
.lb-p{left:12px;top:50%;transform:translateY(-50%)}
.lb-n{right:12px;top:50%;transform:translateY(-50%)}
.lb-c{position:absolute;top:calc(22px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);color:#fff;font-weight:650}

.loading{min-height:100dvh;display:grid;place-items:center;color:var(--ink3)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:999px;font-weight:600;font-size:15px;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:960px){.toast{bottom:32px}}
@media (max-width:760px){
  .land{grid-template-columns:1fr;gap:36px}
  .onb-grid{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .addr-t strong{font-size:19px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ═════════ 디자인 4가지: note(노트 · 기본) · clean(깔끔 · 흰 카드) · bright(산뜻 · 색 카드) · wongoji(원고지) ═════════
   깔끔 · 산뜻은 공부방과 같은 느낌. 제목 글씨는 G마켓 산스, 일기 글씨는 그대로 (위에서 고른 글씨) */
@font-face{font-family:'GMarketSans';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff');font-weight:500;font-display:swap}
@font-face{font-family:'GMarketSans';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff');font-weight:700;font-display:swap}
[data-design="clean"]:not([data-theme="dark"]){
  --paper:#F4F6FA; --grid:transparent; --surface:#FFFFFF; --surface2:#EEF2F8;
  --ink:#16213A; --ink2:#4A5568; --ink3:#6B7589; --line:#E3E8F0; --rule:#E3E8F0;
  --accent:#1F4FD8; --accent-soft:#EAF0FE; --focus:#FFC53D;
}
[data-design="bright"]:not([data-theme="dark"]){
  --paper:#FFFFFF; --grid:transparent; --surface:#FFFFFF; --surface2:#F5F6F9;
  --ink:#1B1F2E; --ink2:#4A5063; --ink3:#6D7385; --line:#E4E7EE; --rule:#E4E7EE;
  --accent:#FF6A3D; --accent-soft:#FFEFE8; --focus:#FFC53D;
}
[data-design="clean"][data-theme="dark"]{--accent:#6E9BFF;--accent-soft:#1F2C44}
[data-design="bright"][data-theme="dark"]{--accent:#FF8A5F;--accent-soft:#3A2525}
:root:is([data-design="clean"],[data-design="bright"]) body{background-image:none}
:root:is([data-design="clean"],[data-design="bright"]) :is(.mast-t,.page-h h1,.block-h h2,.today-date){font-family:'GMarketSans',var(--sans);font-weight:700;letter-spacing:-.5px}
:root:is([data-design="clean"],[data-design="bright"]) .btn-primary{background:var(--accent);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 26%,transparent)}
:root[data-design="clean"] .block{border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(22,33,58,.04),0 6px 16px rgba(22,33,58,.06)}
:root[data-design="clean"] .chip.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
:root[data-design="bright"] .block{background:var(--surface2);border-color:transparent;border-radius:22px;box-shadow:none}
:root[data-design="bright"] .btn-primary{border-radius:999px}
:root[data-design="bright"]:not([data-theme="dark"]) .hero-date{background:linear-gradient(120deg,#FFE7DB,#FFF4D6);padding:20px 24px;border-radius:22px}
/* 모양 · 글씨 · 디자인 고르기: 공부방처럼 한 칸에 모은 단추 */
:root:is([data-design="clean"],[data-design="bright"]) .hb-g{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
:root:is([data-design="clean"],[data-design="bright"]) .hb-g span{border:0;background:none;min-height:32px;width:34px;border-radius:7px}
:root[data-design="clean"] .hb-g input:checked+span{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(22,33,58,.14)}
:root[data-design="bright"] .hb-g{border-radius:999px;border-color:transparent}
:root[data-design="bright"] .hb-g span{border-radius:999px}
:root[data-design="bright"] .hb-g input:checked+span{background:var(--ink);color:var(--paper)}
/* 디자인 견본 그림 */
.dsw{display:block;flex:0 0 20px;width:20px;min-width:20px;height:20px;border-radius:6px;border:1.5px solid #E7DDCD;background:linear-gradient(90deg,transparent 5px,#F2B5A4 5px 6.5px,transparent 6.5px),linear-gradient(#EFE4D2 1px,transparent 1px) 0 0/100% 5px,#FBF6EE}
.dsw.clean{border-color:#D5DCE8;background:linear-gradient(#1F4FD8 0 0) bottom/100% 5px no-repeat,#FFFFFF}

  const api = {
    demo:true,
    onAuth(f){ cb=f; setTimeout(()=>f(signed?user:null),0); },

    async signOut(){ signed=false; ls.del("iinote-demo-signed"); cb && cb(null); },

    async getUser(uid){ return db.users[uid] || null; },
    async addUserGroup(uid,gid){ const u=db.users[uid]||(db.users[uid]={groupIds:[]}); if(!u.groupIds.includes(gid)) u.groupIds.push(gid); u.lastGroupId=gid; save(); },
    async setLastGroup(uid,gid){ const u=db.users[uid]||(db.users[uid]={groupIds:[]}); u.lastGroupId=gid; save(); },
    async getGroup(gid){ const g=db.groups[gid]; return g?{id:gid,...g}:null; },
    async updateGroup(gid,data){ Object.assign(db.groups[gid],data); save(); },

      db.groups[gid]={name,type:"family",inviteCode:code,memberUids:[u.uid],createdAt:Date.now(),createdBy:u.uid}; db.invites[code]=gid;
      sub(gid,"profiles")[rid()]={name:myName,type:"parent",uid:u.uid,color:COLORS[0],createdAt:Date.now()};
      await api.addUserGroup(u.uid,gid); return gid; },
    async joinGroup(code,u,myName,role){ const gid=db.invites[code]; if(!gid) throw new Error("초대 코드를 찾을 수 없어요. 여섯 글자를 다시 확인해 주세요.");
      const g=db.groups[gid]; if(!g.memberUids.includes(u.uid)){ g.memberUids.push(u.uid); if(role) sub(gid,"profiles")[rid()]={name:myName,...role,uid:u.uid,color:COLORS[g.memberUids.length%COLORS.length],createdAt:Date.now()}; }

    async update(gid,c,id,data){ Object.assign(sub(gid,c)[id],data); save(); },

async function makeFirebase(){
  const V="10.12.2";
  const A = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const AU = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
  const F = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const ST = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-storage.js`);
  const app = A.initializeApp(FIREBASE_CONFIG);
  const auth = AU.getAuth(app);
  const db = F.getFirestore(app);
  const storage = ST.getStorage(app);
  const col = (gid,c) => F.collection(db,"groups",gid,c);
  const api = {
    demo:false,
    onAuth(f){ AU.onAuthStateChanged(auth,f); },
    // 앱(Capacitor)으로 포장할 때는 이 함수만 앱용 로그인으로 바꾸면 돼요.
    async signIn(){ await AU.signInWithPopup(auth,new AU.GoogleAuthProvider()); },
    // 휴대폰 연결 링크로 들어온 아이: 구글 계정 없이 이 브라우저를 익명 계정으로 기억해요.
    async signInKid(){ await AU.signInAnonymously(auth); },
    async signOut(){ await AU.signOut(auth); },
    async getIdToken(){ return auth.currentUser ? auth.currentUser.getIdToken() : ""; },
    async getUser(uid){ const s=await F.getDoc(F.doc(db,"users",uid)); return s.exists()?s.data():null; },
    async addUserGroup(uid,gid){ await F.setDoc(F.doc(db,"users",uid),{groupIds:F.arrayUnion(gid),lastGroupId:gid},{merge:true}); },
    async setLastGroup(uid,gid){ await F.setDoc(F.doc(db,"users",uid),{lastGroupId:gid},{merge:true}); },
    async getGroup(gid){ const s=await F.getDoc(F.doc(db,"groups",gid)); return s.exists()?{id:gid,...s.data()}:null; },
    async updateGroup(gid,data){ await F.updateDoc(F.doc(db,"groups",gid),data); },
    async createGroup(name,u,myName){
      let code=makeCode();
      for(let i=0;i<5;i++){ const s=await F.getDoc(F.doc(db,"invites",code)); if(!s.exists()) break; code=makeCode(); }
      const gref=F.doc(F.collection(db,"groups"));
      await F.setDoc(gref,{name,type:"family",inviteCode:code,memberUids:[u.uid],createdAt:Date.now(),createdBy:u.uid});
      await F.setDoc(F.doc(db,"invites",code),{groupId:gref.id});
      await F.addDoc(col(gref.id,"profiles"),{name:myName,type:"parent",uid:u.uid,color:COLORS[0],createdAt:Date.now()});
      await api.addUserGroup(u.uid,gref.id);
      return gref.id;
    },
    async joinGroup(code,u,myName,role){
      const s=await F.getDoc(F.doc(db,"invites",code));
      if(!s.exists()) throw new Error("초대 코드를 찾을 수 없어요. 여섯 글자를 다시 확인해 주세요.");
      const gid=s.data().groupId;
      await F.updateDoc(F.doc(db,"groups",gid),{memberUids:F.arrayUnion(u.uid),lastJoinCode:code});
      // role이 없으면(아이 휴대폰 연결) 새 프로필을 만들지 않고 가족에만 들어가요.
      const mine=!role || (await F.getDocs(col(gid,"profiles"))).docs.some(d=>d.data().uid===u.uid);
      if(!mine) await F.addDoc(col(gid,"profiles"),{name:myName,...role,uid:u.uid,color:COLORS[Math.floor(Math.random()*COLORS.length)],createdAt:Date.now()});
      await api.addUserGroup(u.uid,gid);
      return gid;
    },
    async list(gid,c){ const s=await F.getDocs(col(gid,c)); return s.docs.map(d=>({id:d.id,...d.data()})); },
    async add(gid,c,data){ const r=await F.addDoc(col(gid,c),data); return r.id; },
    async update(gid,c,id,data){ await F.updateDoc(F.doc(db,"groups",gid,c,id),data); },
    async remove(gid,c,id){ await F.deleteDoc(F.doc(db,"groups",gid,c,id)); },
    async uploadMedia(path,blob){ const r=ST.ref(storage,path); await ST.uploadBytes(r,blob,{contentType:blob.type||"application/octet-stream"}); return { url: await ST.getDownloadURL(r), path }; },
    async deleteMedia(path){ try{ await ST.deleteObject(ST.ref(storage,path)); }catch(e){} },
    async leaveGroup(gid,uid){ await F.updateDoc(F.doc(db,"groups",gid),{memberUids:F.arrayRemove(uid)}); },
    async deleteUserDoc(uid){ await F.deleteDoc(F.doc(db,"users",uid)); },
    // 계정 삭제 전 본인 확인: 구글 계정은 로그인 창을 한 번 더 띄워요 (익명 계정은 필요 없음)
    async reauth(){ const u=auth.currentUser; if(u && !u.isAnonymous) await AU.reauthenticateWithPopup(u,new AU.GoogleAuthProvider()); },
    async deleteAccount(){ if(auth.currentUser) await AU.deleteUser(auth.currentUser); }
  };
  return api;
}

function contextOf(text, wrong){
  const sentences = text.split(/(?<=[.!?\n])/);
  const s = (sentences.find(x=>x.includes(wrong)) || "").trim();
  if(!s) return "";
  let ctx = s.replace(wrong, "____");
  if(ctx.length > 40){ const i = ctx.indexOf("____"); ctx = ctx.slice(Math.max(0,i-18), i+22).trim(); }
  return ctx;
}
/* ===== AI 빨간펜 선생님 (공부방 빨간펜과 같은 워커 · 같은 방식) =====
   목표 글자 수를 채우면 부를 수 있어요 → 틀린 곳을 노란 형광펜으로 칠해요 → 스스로 고치거나 정답을 보고 고쳐요.

const GRADES = [[-2,"5세"],[-1,"6세"],[0,"7세"],[1,"초1"],[2,"초2"],[3,"초3"],[4,"초4"],[5,"초5"],[6,"초6"],[7,"중1"],[8,"중2"],[9,"중3"],[10,"고1"],[11,"고2"],[12,"고3"]];
const hasGrade = g => g!==undefined && g!==null && g!=="" && !Number.isNaN(Number(g));
const gradeName = g => hasGrade(g) ? (GRADES.find(x=>x[0]===Number(g))?.[1] || "") : "";
const gradeOptions = (sel=1) => GRADES.map(([v,l])=>`<option value="${v}" ${v===Number(sel)?"selected":""}>${l}</option>`).join("");
// AI 빨간펜 워커에 보내는 학년 이름: age5~7 · grade1~6 · middle1~3 · high1~3
const gradeLevel = g => { const n=hasGrade(g)?Number(g):2; return n<=0?`age${n+7}`:n<=6?`grade${n}`:n<=9?`middle${n-6}`:`high${n-9}`; };
// 아이 일기 최소 글자 수: 학년별 기본값 (공부방과 같게 초2 60자 · 초4 150자). 부모가 우리 가족 탭에서 아이마다 바꿀 수 있어요 (profiles.diaryGoal)
const PEN_GOAL_DEFAULT = {"-2":10,"-1":20,0:30,1:40,2:60,3:100,4:150,5:200,6:250,7:300,8:300,9:300,10:400,11:400,12:400};
const penGoalDefault = p => (hasGrade(p?.grade) && PEN_GOAL_DEFAULT[Number(p.grade)]) || 60;
const penGoalOf = p => Number(p?.diaryGoal) || penGoalDefault(p);
const penAuto = g => (hasGrade(g)?Number(g):2) <= 2;   // 7세 이하 · 초1 · 초2는 빨간펜이 바로 고쳐 줘요

const PEN_ENDS = /[.?!…~。)"'”’\]]$|\p{Extended_Pictographic}$/u;
const PEN_HOW = {self:"스스로 고쳤어요", hint:"정답 보고 고쳤어요", ai:"AI 빨간펜이 고쳐 줬어요", other:"다른 말로 고쳤어요", kept:"그대로 두었어요", left:"그대로예요"};

// 틀린 말이 글 어디에 있는지 (고친 말 안에 틀린 말이 들어 있는 경우는 건너뛰어요)
function penAt(er,text){
  const off=er.right.indexOf(er.wrong); let i=text.indexOf(er.wrong);
  while(i>=0){ if(off<0 || !text.startsWith(er.right,i-off)) return i; i=text.indexOf(er.wrong,i+1); }
  return -1;
}
const penLeft = (er,text) => !er.kept && penAt(er,text)>=0;
// 줄 끝(문장 끝)에 마침표가 없는 곳: 빨간펜이 놓쳐도 꼭 잡혀요
function penPeriod(text,known){
  const out=[]; let pos=0;
  for(const line of text.split("\n")){
    const body=line.replace(/\s+$/,""), end=pos+body.length; pos+=line.length+1;
    if(countChars(body)<4 || PEN_ENDS.test(body)) continue;
    if([...known,...out].some(er=>{ const i=penAt(er,text); return i>=0 && i+er.wrong.length===end; })) continue;
    const words=[...body.matchAll(/\S+/g)]; let tail="";
    for(let n=1;n<=words.length;n++){ const t=body.slice(words[words.length-n].index); if(text.indexOf(t)===end-t.length && text.lastIndexOf(t)===end-t.length){ tail=t; break; } }
    if(!tail) continue;
    out.push({wrong:tail,right:tail+".",kind:"문장부호",hint:"문장이 끝났어요. 끝에 무엇을 찍어야 할까요?",
      why:"문장이 끝나면 마침표(.)를 찍어요. 묻는 말이면 물음표(?), 놀란 말이면 느낌표(!)예요."});
  }
  return out;
}
// 쉼표 · 마침표 · 물음표 · 느낌표 바로 뒤에 글자가 붙어 있으면 한 칸 띄어요 (1,000 · 3.5 는 그대로)
function penSpace(text,known){
  const out=[];
  for(const m of text.matchAll(/[,.!?](?=[^\s.,!?)"'”’~…])/g)){
    const i=m.index, c=m[0], prev=text[i-1]||"", rest=text.slice(i+1);
    if(c==="," && /\d/.test(prev) && /^\d{3}(?!\d)/.test(rest)) continue;
    if(c==="." && /\d/.test(prev) && /^\d/.test(rest)) continue;
    const start=Math.max(text.lastIndexOf(" ",i)+1, text.lastIndexOf("\n",i)+1);
    const e1=text.slice(i).search(/\s/), end=e1<0?text.length:i+e1, wrong=text.slice(start,end);
    if(!wrong || text.indexOf(wrong)!==text.lastIndexOf(wrong)) continue;
    if([...known,...out].some(er=>{ const j=penAt(er,text); return j>=0 && j<end && j+er.wrong.length>start; })) continue;
    const cut=i-start+1;
    out.push({wrong,right:wrong.slice(0,cut)+" "+wrong.slice(cut),kind:"띄어쓰기",hint:"문장 부호 뒤에 글자가 딱 붙어 있어요. 어디를 한 칸 띄우면 될까요?",why:"쉼표(,)나 마침표(.) 뒤에는 한 칸 띄어 써요."});
  }
  return out;
}
// 어떻게 고쳤는지: ai(빨간펜이 고쳐 줌) · hint(정답 보고) · self(스스로) · other(다른 말로) · kept(그대로 두기) · left(아직)
function penHow(er,text){
  if(penAt(er,text)>=0) return er.kept?"kept":"left";
  return er.applied ? (er.auto?"ai":"hint") : !text.includes(er.right) ? "other" : er.shown ? "hint" : "self";
}
// 일기에 저장하는 모양(aiResult): 부모 화면 · 받아쓰기 퀴즈 · 예전 일기 가져오기와 같은 모양
function penResult(d){
  const p=d.pen;
  return {praise:p.praise||"", feedback:p.cheer||"", checks:p.checks||1, original:p.original||"", auto:!!p.auto, checkedAt:Date.now(),
    corrections:p.errors.map(er=>({wrong:er.wrong,right:er.right,explain:er.why||"",hint:er.hint||"",kind:er.kind||"",how:penHow(er,d.text)}))};
}
function penFromResult(r){
  if(!r) return null;
  return {praise:r.praise||"", cheer:r.feedback||"", checks:r.checks||1, original:r.original||"", auto:!!r.auto,
    errors:(r.corrections||[]).map(c=>({wrong:c.wrong,right:c.right,why:c.explain||"",hint:c.hint||"",kind:c.kind||"",
      shown:c.how==="hint"||c.how==="kept", applied:c.how==="ai"||c.how==="hint", auto:c.how==="ai", kept:c.how==="kept"}))};
}
async function callPen(text){
  if(DEMO){
    await new Promise(r=>setTimeout(r,700));
    return { errors:DEMO_DICT.filter(([w])=>text.includes(w)).map(([w,r,e])=>({wrong:w,right:r,kind:"맞춤법",hint:"소리 내어 읽어 보고, 바르게 쓰는 말을 떠올려 볼까요?",why:e})),
      praise:"오늘 있었던 일이 생생하게 느껴지는 일기예요!", cheer:"조금만 고치면 더 반짝이는 일기가 돼요!" };
  }
  let last;
  for(let i=0;i<2;i++){   // 선생님이 가끔 바빠서 못 받을 때가 있어요: 한 번 더 불러요
    try{
      const r=await fetch(SPELL_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text,level:gradeLevel(S.me.grade),name:S.me.name})});
      if(r.ok) return await r.json();
      last=new Error("빨간펜 "+r.status);
    }catch(e){ last=e; }
  }
  throw last;
}

/* 퀴즈 오답 보기 만들기: 헷갈리기 쉬운 글자를 바꿔 봐요 */
function variants(word){
  const out = new Set();
  const pairs = [["되","돼"],["데","대"],["게","께"],["거","꺼"],["세","새"],["웬","왠"],["안","않"],["로서","로써"],["히","이"],["며칠","몇일"],["며","몇"],["됐","됬"]];
  for(const [a,b] of pairs){ if(word.includes(a)) out.add(word.replace(a,b)); if(word.includes(b)) out.add(word.replace(b,a)); }
  const swap = {1:5,5:1,3:7,7:3,10:15,15:10,11:10};
  for(let i=0;i<word.length;i++){
    const c = word.charCodeAt(i) - 0xAC00; if(c<0 || c>11171) continue;
    const jung = Math.floor((c%588)/28);
    if(swap[jung]!==undefined) out.add(word.slice(0,i) + String.fromCharCode(0xAC00 + c + (swap[jung]-jung)*28) + word.slice(i+1));
  }
  if(word.includes(" ")) out.add(word.replace(" ","")); 
  out.delete(word);
  return [...out];
}

/* ---------- 첫 화면: 4분할형 (컴퓨터 · 아이패드 가로는 한 화면에 네 칸, 휴대폰은 세로로 한 칸씩) ---------- */
function viewHomeQuad(){
  return `<div class="quad">${quadMini()}${quadNews()}${quadSticker()}${quadGrowth()}</div>`;
}
// 1. 미니멀: 오늘 날짜, 누가 썼는지, 큰 쓰기 버튼
function quadMini(){
  const t=todayStr(), ps=sortedProfiles();
  // 글자 대신 표시: 썼으면 ✓ 도장, 쓰는 중이면 ✎, 아직이면 흐리게
  const who=ps.map(p=>{ const d=findDiary(p.id,t), s=d?.status==="submitted", lab=s?"썼어요":d?"쓰는 중":"아직";
    return `<li class="${s?"":"no"}" title="${esc(p.name)} ${lab}"><span class="qm-av">${av(p,36)}${s||d?`<i class="${s?"ok":"ing"}">${s?"✓":"✎"}</i>`:""}</span><b>${esc(p.name)}</b><span class="sr">${lab}</span></li>`; }).join("");
  return `<section class="block q-cell q-mini" aria-labelledby="h-qm">
    <h2 id="h-qm" class="today-date">${fmtLong(t)}</h2>
    <ul class="qm-who">${who}</ul>${homeCta(findDiary(S.me.id,t))}</section>`;
}
// 2. 교환일기: 나에게 온 댓글 · 답글과 가족의 새 일기
function quadNews(){
  const vis=new Map(visibleDiaries().map(d=>[d.id,d]));
  const items=[];
  S.comments.forEach(c=>{ const d=vis.get(c.diaryId); if(!d || c.deleted || c.profileId===S.me.id) return;
    const par=c.parentId&&S.comments.find(x=>x.id===c.parentId), owner=prof(d.profileId);
    const what = par&&par.profileId===S.me.id ? "내 댓글에 답글" : d.profileId===S.me.id ? "내 일기에 댓글" : `${owner?.name||""} 일기에 댓글`;
    items.push({ts:c.createdAt||0,p:prof(c.profileId),what,text:c.text,id:d.id}); });
  S.diaries.forEach(d=>{ if(d.status!=="submitted" || d.profileId===S.me.id) return;
    items.push({ts:d.updatedAt||d.createdAt||0,p:prof(d.profileId),what:"새 일기",text:d.title||"제목 없는 일기",id:d.id}); });
  items.sort((a,b)=>b.ts-a.ts);
  const list=items.slice(0,12).map(x=>`<li><button class="qn" data-act="open-diary" data-id="${x.id}">${av(x.p,32)}<span class="qn-t"><span class="qn-h"><b>${esc(x.p?.name||"")}</b>${esc(x.what)}<time>${relTime(x.ts)}</time></span><span class="qn-x">${esc(x.text)}</span></span></button></li>`).join("");
  const fresh=items.filter(x=>Date.now()-x.ts<864e5).length;
  return `<section class="block q-cell" aria-labelledby="h-qn"><div class="block-h"><h2 id="h-qn">교환일기</h2><span class="muted">${fresh?`오늘 새 소식 ${fresh}개`:"최근 소식"}</span></div>
    <div class="q-body">${list?`<ul class="qn-list">${list}</ul>`:`<p class="empty">아직 새 소식이 없어요. 가족 일기에 먼저 댓글을 남겨 보세요.</p>`}</div></section>`;
}
// 3. 칭찬 스티커판: 이번 달 일기 쓴 날마다 별 스티커, 연속 기록
function streakOf(pid){ let d=todayStr(); if(!submittedOn(pid,d)) d=addDays(d,-1); let n=0; while(submittedOn(pid,d)){ n++; d=addDays(d,-1); } return n; }
function quadSticker(){
  const t=todayStr(), month=t.slice(0,7), [yy,mm]=month.split("-").map(Number), days=new Date(yy,mm,0).getDate();
  const rows=sortedProfiles().map(p=>{ const c=p.color||"#1F2A44", s=streakOf(p.id);
    const st=[...Array(days)].map((_,i)=>{ const d=`${month}-${pad(i+1)}`, on=submittedOn(p.id,d);
      return `<i class="${on?"on":d>t?"fut":""}" title="${mm}월 ${i+1}일${on?" 썼어요":""}">${on?"★":""}</i>`; }).join("");
    const n=[...Array(days)].filter((_,i)=>submittedOn(p.id,`${month}-${pad(i+1)}`)).length;
    return `<div class="qs-row" style="--pc:${c};--pt:${onColor(c)}"><span class="qs-who" title="${esc(p.name)}">${av(p,20)}<small>${s>1?`🔥${s}`:`★${n}`}</small></span><div class="qs-st" style="--n:${days}" aria-label="${esc(p.name)} ${mm}월 스티커 ${n}개${s>1?`, ${s}일 연속`:""}">${st}</div></div>`; }).join("");
  return `<section class="block q-cell" aria-labelledby="h-qs"><div class="block-h"><h2 id="h-qs">칭찬 스티커판</h2><span class="muted">${mm}월 ★</span></div>
    <div class="q-body"><div class="qs-list">${rows}</div></div></section>`;
}
// 4. 성장 기록: 이번 달 일기 수, 평균 글자 수, 글 길이 변화, 자주 틀린 낱말
function quadGrowth(){
  const kids=sortedProfiles().filter(p=>p.type==="child"), pool=kids.length?kids:sortedProfiles();
  const p=pool.find(x=>x.id===S.growId)||pool[0]; if(!p) return "";
  const month=todayStr().slice(0,7);
  const all=S.diaries.filter(d=>d.profileId===p.id && d.status==="submitted").sort((a,b)=>a.date.localeCompare(b.date));
  const mon=all.filter(d=>d.date.startsWith(month));
  const avg=mon.length?Math.round(mon.reduce((s,d)=>s+(d.text||"").length,0)/mon.length):0;
  const ws=S.quizWords.filter(w=>w.profileId===p.id);
  const learned=ws.filter(w=>(w.correctStreak||0)>=3).length;
  const pts=all.slice(-12).map(d=>(d.text||"").length);
  let chart=`<p style="margin:0">2편부터 그려져요</p>`;
  if(pts.length>1){ const mx=Math.max(...pts,1);
    const xy=pts.map((v,i)=>`${(i/(pts.length-1)*300).toFixed(1)},${(56-v/mx*50).toFixed(1)}`).join(" ");
    chart=`<svg viewBox="0 0 300 60" preserveAspectRatio="none" role="img" aria-label="최근 일기 ${pts.length}편의 글자 수: ${pts.join(", ")}"><polyline points="${xy}" fill="none" stroke="var(--sky)" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`; }
  const wrong=ws.filter(w=>(w.correctStreak||0)<3).sort((a,b)=>(b.wrongCount||1)-(a.wrongCount||1)).slice(0,4);
  // 누구 기록인지 고르는 단추는 제목 줄 오른쪽에 작게
  const chips=pool.length>1?`<div class="qg-who" role="group" aria-label="누구의 기록">${pool.map(x=>`<button class="${x.id===p.id?"on":""}" data-act="grow" data-v="${x.id}" aria-pressed="${x.id===p.id}" title="${esc(x.name)}">${av(x,26)}</button>`).join("")}</div>`:"";
  return `<section class="block q-cell" aria-labelledby="h-qg"><div class="block-h"><h2 id="h-qg">성장 기록 <small class="muted">${esc(p.name)}</small></h2>${chips}</div>
    <div class="q-body">
      <div class="qg-stats"><div title="이번 달 일기">📔<b>${mon.length}편</b></div><div title="평균 글자 수">✏️<b>${avg}자</b></div><div title="${p.type==="child"?"익힌 낱말":"모든 일기"}">${p.type==="child"?"🌱":"📚"}<b>${p.type==="child"?learned:all.length}${p.type==="child"?"개":"편"}</b></div></div>
      <div class="qg-chart">📈 글 길이 (최근 ${pts.length}편)${chart}</div>
      ${p.type==="child"?`<div class="qg-words" aria-label="자주 틀린 낱말"><em>틀린 낱말</em>${wrong.length?wrong.map(w=>`<span>${esc(w.wrong)}→${esc(w.right)}</span>`).join(""):"없어요 👍"}</div>`:""}
    </div></section>`;
}

/* ---------- 일기 목록 ---------- */
function visibleDiaries(){ return S.diaries.filter(d=>d.status==="submitted" || d.profileId===S.me.id); }
function popularTags(){
  const m=new Map(); visibleDiaries().forEach(d=>(d.tags||[]).forEach(t=>m.set(t,(m.get(t)||0)+1)));
  return [...m.entries()].sort((a,b)=>b[1]-a[1]);
}
function filteredDiaries(){
  let list=visibleDiaries();
  if(S.filter!=="all") list=list.filter(d=>d.profileId===S.filter);
  if(S.tag) list=list.filter(d=>(d.tags||[]).includes(S.tag));
  const q=S.search.trim().toLowerCase().replace(/^#/,"");
  if(q) list=list.filter(d=>[d.title,d.text,d.location?.name,...(d.tags||[])].some(x=>String(x||"").toLowerCase().includes(q)));
  return list.sort((a,b)=>b.date.localeCompare(a.date)||(b.updatedAt||0)-(a.updatedAt||0));
}
function dcard(d){

/* ---------- 일기 PDF로 저장 (A4 · 컬러 · 구성 10가지) ----------
   새 라이브러리 없이 브라우저의 '인쇄 → PDF로 저장'을 써요. 기기 안에서 만들고 어디에도 보내지 않아요.
   표지 한 장 + 고른 구성대로 일기 쪽. 종이 일기책은 출시 예정 */
// [키, 이름, 설명, 가로 A4인지]
const PDF_LAYOUTS = [
  ["basic","기본","일기마다 한 장 · 글 아래 사진",false],
  ["day","하루 모음","그날 가족 일기를 한 장에",false],
  ["top","위 사진 · 아래 글","사진을 크게, 글은 가로로",false],
  ["topv","위 사진 · 세로 글","사진 아래 글을 세로쓰기로",false],
  ["left","왼쪽 사진 · 오른쪽 글","A4 가로",true],
  ["right","왼쪽 글 · 오른쪽 사진","A4 가로",true],
  ["picture","사진 + 원고지","위 사진 한 장 · 아래 원고지 칸",false],
  ["grid","원고지","글만 원고지 칸에",false],
  ["two","두 편씩","한 장에 일기 두 편",false],
  ["album","앨범","사진 가득 · 짧은 글",false]
];
// 구성 미리보기 (사진 = 색 네모, 글 = 줄)
function pdfThumb(k){
  const land=PDF_LAYOUTS.find(x=>x[0]===k)?.[3], W=land?56:40, H=land?40:56;
  const ph=(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="var(--sky)" opacity=".55"/>`;
  const ln=(x,y,w,n,gap=4)=>Array.from({length:n},(_,i)=>`<line x1="${x}" y1="${y+i*gap}" x2="${x+w}" y2="${y+i*gap}" stroke="var(--ink3)" stroke-width="1.2"/>`).join("");
  const vl=(x,y,h,n)=>Array.from({length:n},(_,i)=>`<line x1="${x-i*4}" y1="${y}" x2="${x-i*4}" y2="${y+h}" stroke="var(--ink3)" stroke-width="1.2"/>`).join("");
  const gr=(x,y,c,r,s)=>{ let o=""; for(let i=0;i<=c;i++) o+=`<line x1="${x+i*s}" y1="${y}" x2="${x+i*s}" y2="${y+r*s}" stroke="var(--coral)" stroke-width=".7"/>`; for(let j=0;j<=r;j++) o+=`<line x1="${x}" y1="${y+j*s}" x2="${x+c*s}" y2="${y+j*s}" stroke="var(--coral)" stroke-width=".7"/>`; return o; };
  const body={
    basic: ln(6,10,28,6)+ph(6,36,28,14),
    day: `<rect x="5" y="5" width="30" height="14" rx="2" fill="none" stroke="var(--coral)"/><rect x="5" y="21" width="30" height="14" rx="2" fill="none" stroke="var(--sage)"/><rect x="5" y="37" width="30" height="14" rx="2" fill="none" stroke="var(--butter)"/>`+ln(8,10,24,2)+ln(8,26,24,2)+ln(8,42,24,2),
    top: ph(5,5,30,22)+ln(6,32,28,5),
    topv: ph(5,5,30,22)+vl(33,30,21,7),
    left: ph(4,5,22,30)+ln(30,9,22,7),
    right: ln(4,9,22,7)+ph(30,5,22,30),
    picture: ph(5,5,30,20)+gr(5,29,6,4,5),
    grid: gr(5,6,6,9,5),
    two: ln(6,8,28,4)+`<line x1="4" y1="28" x2="36" y2="28" stroke="var(--coral)" stroke-dasharray="2 2"/>`+ln(6,34,28,4),
    album: ph(4,4,15,15)+ph(21,4,15,15)+ph(4,21,32,20)+ln(8,46,24,2)
  }[k]||"";
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><rect x=".5" y=".5" width="${W-1}" height="${H-1}" rx="3" fill="var(--surface)" stroke="var(--line)"/>${body}</svg>`;
}
