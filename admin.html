<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>아이아이노트 운영 현황</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 운영자 현황판: 가족 · 구성원 · 일기 수만 세요. 일기 내용은 한 글자도 받아 오지 않아요 (파이어베이스 '개수 세기'만 사용) */
/* 글씨: 온글잎 윤탱체 (사용자 요청), 없는 기호는 Pretendard 로 */
@font-face{font-family:'OwnglyphYuntaeng';src:url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2608211801@font-160/font-160/온글잎 윤탱체.woff2') format('woff2');font-weight:400;font-display:swap}
:root{--bg:#FBF6EE;--paper:#FFFDF9;--soft:#F6EFE3;--ink:#1F2A44;--sub:#767E91;--line:#E7DDCD;--grid:rgba(31,42,68,.045);--accent:#EF6F53;--accent-ink:#B8452D;--accent-soft:#FCE6DF;--ok:#3F7F70;--ok-soft:#DFEEE9;--butter:#F4BE45;--butter-soft:#FCF0CF;--sky:#6F9BD8;--sky-soft:#E3ECF8;--warn:#B8452D;--sun:#C9503A;--sat:#4A74B5;--g0:#EFE7DA;--g1:#C6E3B5;--g2:#8CCB7E;--g3:#4FA25A;--g4:#2E6F3C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141A28;--paper:#1B2336;--soft:#222B40;--ink:#F2EDE3;--sub:#9CA2B0;--line:#2B3550;--grid:rgba(242,237,227,.035);--accent:#F07C62;--accent-ink:#F59C86;--accent-soft:#3A2A2A;--ok:#8CC2B4;--ok-soft:#1E3430;--butter:#E8B84A;--butter-soft:#352F20;--sky:#8FB3E6;--sky-soft:#1F2C44;--warn:#F59C86;--sun:#F59C86;--sat:#8FB3E6;--g0:#263049;--g1:#2C4A33;--g2:#3F7A48;--g3:#5FAE68;--g4:#9BDD8F}}
:root[data-theme="dark"]{--bg:#141A28;--paper:#1B2336;--soft:#222B40;--ink:#F2EDE3;--sub:#9CA2B0;--line:#2B3550;--grid:rgba(242,237,227,.035);--accent:#F07C62;--accent-ink:#F59C86;--accent-soft:#3A2A2A;--ok:#8CC2B4;--ok-soft:#1E3430;--butter:#E8B84A;--butter-soft:#352F20;--sky:#8FB3E6;--sky-soft:#1F2C44;--warn:#F59C86;--sun:#F59C86;--sat:#8FB3E6;--g0:#263049;--g1:#2C4A33;--g2:#3F7A48;--g3:#5FAE68;--g4:#9BDD8F}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;color:var(--ink);font-family:'OwnglyphYuntaeng',"Pretendard Variable",Pretendard,system-ui,"Malgun Gothic",sans-serif;line-height:1.55;font-size:18px;word-break:keep-all}
.wrap{max-width:1040px;margin:0 auto;padding:22px 16px 56px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-bottom:18px}
h1{font-size:30px;margin:0;flex:1;min-width:10em;font-weight:400;letter-spacing:-.01em}
h2{font-size:23px;margin:0 0 12px;font-weight:400;display:flex;align-items:center;gap:8px}
b,strong,th{font-weight:400}
.sub{color:var(--sub);font-size:17px}
.when{color:var(--sub);font-size:16px;background:var(--paper);border:1.5px dashed var(--line);border-radius:999px;padding:4px 12px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:0;border-radius:999px;padding:10px 20px;background:var(--ink);color:var(--paper);font-size:19px}
.pill{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 14px;font-size:17px;transition:background .15s,border-color .15s}
.pill:hover{background:var(--soft);border-color:var(--sub)}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:20px;padding:18px 20px;margin-bottom:16px;box-shadow:0 2px 0 var(--line)}
.login{max-width:420px;margin:12vh auto 0;text-align:center}
.login .btn{width:100%;margin-top:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.g-logo{width:24px;height:24px;flex:none;background:#fff;border-radius:50%;padding:3px;box-sizing:border-box}
.alert{color:var(--warn);font-size:16px;margin:10px 0 0}
/* 💌 문의함 */
.sp-new{display:inline-block;margin-left:6px;padding:1px 9px;border-radius:10px;background:#E4507F;color:#fff;font-size:14px}
.sp-list{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.sp-list button{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:baseline;width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px;background:none;font:inherit;text-align:left;cursor:pointer}
.sp-list em{grid-column:1/-1;font-style:normal;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-list small{grid-column:1/-1;font-size:13px;opacity:.7}
.sp-msgs{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto;margin:10px 0}
.sp{margin:0;max-width:80%;display:flex;flex-direction:column;gap:2px}
.sp span{padding:8px 12px;border-radius:14px;background:var(--line);white-space:pre-line}
.sp.op{align-self:flex-end;text-align:right}
.sp.op span{background:#5A2E45;color:#fff}
.sp.rep span{background:#FFE1E1;border:1.5px solid #E4507F}
.sp-rep{color:#C2366A;font-size:14px}
.sp small{font-size:12px;opacity:.7}
#sp-form{display:flex;flex-direction:column;gap:8px}
.nt-form{display:flex;flex-direction:column;gap:8px}
.nt-form textarea,.nt-form input,.nt-form select{font:inherit;padding:8px 10px;border-radius:12px;border:1.5px solid var(--line)}
.nt-row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end}
.nt-row label{display:flex;flex-direction:column;gap:4px;font-size:13px}
#sp-form textarea{font:inherit;padding:10px;border-radius:12px;border:1.5px solid var(--line)}
/* 숫자 칸: 무리마다 위쪽 색 띠 (방문 = 하늘, 가족 · 사람 = 초록, 일기 = 코랄, AI = 버터) */
.group-h{font-size:18px;color:var(--sub);margin:4px 2px 8px;display:flex;align-items:center;gap:8px}
.group-h::after{content:"";flex:1;height:1.5px;background:var(--line)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.tile{position:relative;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:14px 14px 12px;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:var(--c,var(--line))}
.tile b{display:block;font-size:36px;line-height:1.1;color:var(--ink)}
.tile span{color:var(--sub);font-size:17px}
.tile i{font-style:normal;position:absolute;right:12px;top:12px;font-size:18px;opacity:.85}
.t-visit{--c:var(--sky)}.t-fam{--c:var(--ok)}.t-diary{--c:var(--accent)}.t-ai{--c:var(--butter)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:19px}
th,td{border-bottom:1.5px dashed var(--line);padding:7px 10px;text-align:center;white-space:nowrap}
th{color:var(--sub);font-size:17px;border-bottom:1.5px solid var(--line)}
td.l,th.l{text-align:left}
tr.fam{cursor:pointer}
tr.fam:hover td{background:var(--soft)}
tr.mem td{background:var(--soft);font-size:16px}
tr.mem td.l{padding-left:26px}
.z{color:var(--sub);opacity:.7}
.good{color:var(--ok)}
.bar{display:inline-block;height:9px;border-radius:99px;background:var(--ok);vertical-align:middle;margin-right:6px;min-width:2px}
.note{font-size:16px;color:var(--sub);margin:10px 0 0}
pre{background:var(--soft);border-radius:12px;padding:12px;overflow-x:auto;font-family:Consolas,"D2Coding",monospace;font-size:12.5px;line-height:1.5;white-space:pre}
a{color:var(--accent-ink)}
/* 대문 접속 현황 */
.vsum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 14px}
.vsum div{background:var(--soft);border-radius:14px;padding:8px 12px}
.vsum b{display:block;font-size:26px;line-height:1.1}
.vsum span{font-size:17px;color:var(--sub)}
.vsum .hot{background:var(--sky-soft)}
.visit td.num{font-variant-numeric:tabular-nums;width:18%}
.visit .track{display:flex;align-items:center;gap:8px}
.visit .track s{flex:1;max-width:260px;height:10px;border-radius:99px;background:var(--soft);text-decoration:none;overflow:hidden}
.visit .track s i{display:block;height:100%;border-radius:99px;background:var(--sky)}
.visit .track em{font-style:normal;min-width:2ch}
.visit tr.today td{background:var(--sky-soft)}
.visit tr.today td:first-child{border-radius:10px 0 0 10px}
.visit tr.today td:last-child{border-radius:0 10px 10px 0}
.visit tr.empty td{color:var(--sub)}
.visit .d-sun{color:var(--sun)}.visit .d-sat{color:var(--sat)}
.visit .tag-today{font-size:13px;background:var(--sky);color:var(--paper);border-radius:99px;padding:0 7px;margin-left:4px;vertical-align:2px}
.more{display:block;width:100%;margin-top:10px;border:1.5px dashed var(--line);background:transparent;border-radius:12px;padding:7px;font-size:17px;color:var(--sub)}
.more:hover{background:var(--soft);color:var(--ink)}
/* 사람 · 가족 줄: 넓은 화면은 칸 5개 + 오른쪽 접속 잔디 */
@media (min-width:900px){.tiles.people{grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,1.9fr)}}
.tiles.people .grass{grid-column:span 2}
@media (min-width:900px){.tiles.people .grass{grid-column:auto}}
.acct-btn{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;text-align:left;font:inherit;color:inherit;cursor:pointer}
.acct-btn:hover{background:var(--soft)}
.acct-btn em{font-style:normal;display:block;font-size:15px;color:var(--ok)}
.grass .g-h{font-size:17px;margin:0 0 8px;padding-right:24px}
.grass .g-h span{font-size:14px;color:var(--sub);margin-left:4px}
.g-grid{display:grid;grid-template-rows:repeat(7,11px);grid-auto-flow:column;grid-auto-columns:11px;gap:3px;justify-content:center}
.g-grid i,.g-scale i{position:static;display:block;width:11px;height:11px;border-radius:3px;background:var(--g0);opacity:1;font-size:0}
.g-scale i{display:inline-block;width:9px;height:9px;vertical-align:-1px;margin:0 1px}
.grass i.g0{background:var(--g0)}.grass i.g1{background:var(--g1)}.grass i.g2{background:var(--g2)}.grass i.g3{background:var(--g3)}.grass i.g4{background:var(--g4)}
.grass i.g-f{background:transparent;outline:1px dashed var(--line);outline-offset:-1px}
.grass i.g-t{box-shadow:0 0 0 1.5px var(--ink)}
.g-leg{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:6px;font-size:13px;color:var(--sub)}
.acct{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;background:var(--paper);border:1.5px dashed var(--ok);border-radius:16px;padding:12px}
.acct[hidden]{display:none}
.acct>div{background:var(--ok-soft);border-radius:12px;padding:8px 12px;display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:center}
.acct>div i{font-style:normal;grid-row:span 2;font-size:20px}
.acct>div b{font-size:26px;line-height:1.1}
.acct>div span{font-size:16px;color:var(--sub)}
.acct>div.unk{background:var(--soft)}
.acct .note{grid-column:1/-1;margin:2px 2px 0}
@media (max-width:560px){.vsum{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:25px}.visit .track s{max-width:110px}}
</style>
</head>

<script type="module">
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDAA9awvX3nmdY41Tgvy0KJDkEfxt7dxpM",
  authDomain: "iinote.firebaseapp.com",
  projectId: "iinote",
  storageBucket: "iinote.firebasestorage.app",
  messagingSenderId: "412097553357",
  appId: "1:412097553357:web:ca64a3b887316f79ba5a84"
};
const ADMIN_EMAIL = "bellachord@gmail.com";   // 이 계정만 들어와요 (파이어베이스 규칙에서도 같은 계정만 허락)
const V = "10.12.2";
const A = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
const AU = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
const F = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
const app = A.initializeApp(FIREBASE_CONFIG), auth = AU.getAuth(app), db = F.getFirestore(app);

const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const dayStr = t => `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;
const daysAgo = n => { const t=new Date(); t.setDate(t.getDate()-n); return dayStr(t); };
// 학년 이름 (앱과 같은 규칙: -2~0 = 5~7세, 1~6 = 초1~6, 7~9 = 중1~3, 10~12 = 고1~3)
const gradeName = g => { if(g===undefined || g===null || g==="") return ""; const n=Number(g); return n<=0?`${n+7}세`:n<=6?`초${n}`:n<=9?`중${n-6}`:`고${n-9}`; };
const fmtDate = ms => ms ? new Date(ms).toLocaleDateString("ko-KR",{year:"numeric",month:"short",day:"numeric"}) : "-";
// 개수만 세요: 문서 내용은 받아 오지 않아요
const count = async q => (await F.getCountFromServer(q)).data().count;
// AI 사용량: 다홍펜 워커가 달마다 세어 둔 횟수 · 토큰 (GET /usage). 아이 이름은 보여 주지 않고 iinote / 공부방으로만 나눠요
const USAGE_API = "https://family-spell.bellachord.workers.dev/usage";
// Claude Opus 5 요금 (100만 토큰당 달러): 입력 5 · 출력 25 · 캐시 읽기 0.5 · 캐시 쓰기 6.25. 환율은 대략으로
const PRICE = { input:5, output:25, cacheRead:0.5, cacheWrite:6.25 }, KRW = 1400;
// 음성 인식(Workers AI Whisper)은 3분 녹음 한 번에 약 0.0015달러, 하루 무료 범위(약 70번) 안이면 0원
const STT_USD = 0.0015;
const usd = m => ((m.input||0)*PRICE.input + (m.output||0)*PRICE.output + (m.cacheRead||0)*PRICE.cacheRead + (m.cacheWrite||0)*PRICE.cacheWrite)/1e6;
const won = d => Math.round(d*KRW).toLocaleString("ko-KR")+"원";
const ACCT_KINDS = [["google","🟢","구글"],["kakao","💛","카카오"],["both","🔗","구글 + 카카오 연결"],["kid","🧒","아이 기기 연결"]];
const AI_KINDS = [["spell","다홍펜"],["similar","비슷한 낱말 퀴즈"],["report","AI 총평"],["transcribe","목소리 → 글"],["talk","이야기 일기"]];

// 관리자 계정이 숫자를 셀 수 있게 하는 파이어베이스 규칙 (콘솔 > Firestore > 규칙에 이미 있는 match 들 옆에 추가)
const RULES = `// 아이아이노트 운영 현황판 (bellachord 계정만 · 숫자 세기용)
function isIinoteAdmin() {
  return request.auth != null && request.auth.token.email == "${ADMIN_EMAIL}"
    && request.auth.token.email_verified == true;
}
// 날짜별 접속 현황: 누구나 숫자만 1씩 더하고, 읽기는 운영자만
function statStep(k) {
  return request.resource.data.get(k, 0) == resource.data.get(k, 0)
    || request.resource.data.get(k, 0) == resource.data.get(k, 0) + 1;
}
match /stats/{day} {
  allow read: if isIinoteAdmin();
  allow create: if day.matches('^20[0-9]{2}-[0-9]{2}-[0-9]{2}$')
    && request.resource.data.keys().hasOnly(['views', 'visitors', 'members'])
    && request.resource.data.get('views', 0) <= 1 && request.resource.data.get('visitors', 0) <= 1
    && request.resource.data.get('members', 0) <= 1;
  allow update: if request.resource.data.keys().hasOnly(['views', 'visitors', 'members'])
    && statStep('views') && statStep('visitors') && statStep('members');
}
match /users/{uid} { allow list: if isIinoteAdmin(); }
match /groups/{gid} {
  allow read: if isIinoteAdmin();
  match /profiles/{pid} { allow read: if isIinoteAdmin(); }
  match /diaries/{did} { allow list: if isIinoteAdmin(); }
}`;

function loginHTML(msg=""){
  return `<div class="card login"><h1>📊 아이아이노트 운영 현황</h1>
    <p class="sub">운영자 구글 계정으로 로그인하세요. 일기 내용은 보이지 않고, 가족 수와 일기 수만 세요.</p>
    <button class="btn" data-act="login"><svg class="g-logo" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>구글 계정으로 로그인</button>${msg?`<p class="alert">${esc(msg)}</p>`:""}</div>`;
}
const errText = e => { const m={"auth/unauthorized-domain":"이 주소가 Firebase 승인된 도메인에 없어요","auth/popup-blocked":"팝업이 막혔어요","auth/network-request-failed":"인터넷 연결을 확인해 주세요"}[e?.code];
  return (m||"로그인하지 못했어요")+` (${e?.code||e?.message||"알 수 없는 오류"})`; };

async function load(){
  $app.innerHTML = `<p class="sub">세는 중…</p>`;
  const today=dayStr(new Date()), d7=daysAgo(6), d30=daysAgo(29);
  let groups;
  try{ groups=(await F.getDocs(F.collection(db,"groups"))).docs.map(d=>({id:d.id,...d.data()})); }
  catch(e){ return showRuleHelp(e); }
  let users="-"; try{ users=await count(F.collection(db,"users")); }catch(e){}
  // 계정 종류별 수 (앱이 들어올 때 users.kind 에 적어 둬요. 예전 계정은 다음에 앱을 열 때 채워져요)
  let kinds=null; try{ const uc=F.collection(db,"users");
    kinds=Object.fromEntries(await Promise.all(ACCT_KINDS.map(async([k])=>[k,await count(F.query(uc,F.where("kind","==",k)))]))); }catch(e){ console.warn(e); }
  let usage=null; try{ usage=await (await fetch(USAGE_API,{cache:"no-store"})).json(); }catch(e){}
  // 날짜별 접속 현황 (접속 잔디 13주 + 표 30일): 규칙이 아직 없으면 null
  const from=[d30,grassDays()[0]].sort()[0];
  let stats=null; try{ stats=(await F.getDocs(F.query(F.collection(db,"stats"),F.where(F.documentId(),">=",from)))).docs.map(d=>({day:d.id,...d.data()})); }catch(e){ console.warn(e); }
  const idxErrs=new Set();
  const fams=await Promise.all(groups.map(async g=>{
    const dcol=F.collection(db,"groups",g.id,"diaries");
    const [profiles,total,today_,w,m]=await Promise.all([
      F.getDocs(F.collection(db,"groups",g.id,"profiles")).then(s=>s.docs.map(d=>{ const p=d.data(); return {id:d.id,type:p.type,grade:p.grade,linked:!!p.uid}; /* 이름은 쓰지 않아요 */ })),
      count(dcol), count(F.query(dcol,F.where("date","==",today))),
      count(F.query(dcol,F.where("date",">=",d7))), count(F.query(dcol,F.where("date",">=",d30)))]);
    const members=await Promise.all(profiles.map(async p=>{
      const mine=F.query(dcol,F.where("profileId","==",p.id));
      const [all,sub,pen]=await Promise.all([count(mine), count(F.query(dcol,F.where("profileId","==",p.id),F.where("status","==","submitted"))),
        p.type==="child"?count(F.query(dcol,F.where("profileId","==",p.id),F.where("aiChecked","==",true))):Promise.resolve(null)]);
      // 사람별 최근 7일: 파이어베이스 색인이 한 번 필요해요 (없으면 만들 수 있는 링크를 보여 줘요)
      let week=null; try{ week=await count(F.query(dcol,F.where("profileId","==",p.id),F.where("date",">=",d7))); }catch(e){ const u=String(e.message||"").match(/https:\/\/console\.firebase\.google\.com\S+/); if(u) idxErrs.add(u[0]); }
      return {...p,all,sub,pen,week};
    }));
    return {...g,members,total,today:today_,w,m};
  }));
  render(fams,users,[...idxErrs],usage,stats,kinds);
}

// 접속 잔디: 13주(일~토 한 줄씩), 이번 주가 맨 오른쪽. 앞으로 올 날은 빈칸
const GRASS_WEEKS = 13;
function grassDays(){ const t=new Date(); t.setHours(0,0,0,0); t.setDate(t.getDate()-t.getDay()-7*(GRASS_WEEKS-1));
  return [...Array(GRASS_WEEKS*7)].map((_,i)=>{ const d=new Date(t); d.setDate(t.getDate()+i); return dayStr(d); }); }
function grassTile(stats){
  if(!stats) return "";
  const by=Object.fromEntries(stats.map(s=>[s.day,s])), days=grassDays(), today=dayStr(new Date());
  const max=Math.max(1,...days.map(d=>by[d]?.visitors||0));
  const lv=n=>!n?0:n/max<=.25?1:n/max<=.5?2:n/max<=.75?3:4;
  const cells=days.map(d=>{ if(d>today) return `<i class="g-f"></i>`; const x=by[d]||{}, n=x.visitors||0;
    return `<i class="g${lv(n)}${d===today?" g-t":""}" title="${d.slice(5).replace("-","/")} 방문 ${n} · 로그인 ${x.members||0} · 열림 ${x.views||0}"></i>`; }).join("");
  const on=days.filter(d=>d<=today&&(by[d]?.visitors||0)>0).length;
  return `<div class="tile grass t-visit"><i>🌱</i><div class="g-h">접속 잔디 <span>${GRASS_WEEKS}주 중 ${on}일</span></div>
    <div class="g-grid">${cells}</div>
    <div class="g-leg"><span>${days[0].slice(5).replace("-","/")}</span><span class="g-scale">적음 <i class="g0"></i><i class="g1"></i><i class="g2"></i><i class="g3"></i><i class="g4"></i> 많음</span><span>오늘</span></div></div>`;
}
// 계정 종류별로 나눠 보기 (가입한 계정 칸을 누르면 열려요)
function acctPanel(users,kinds){
  if(!kinds) return `<div class="acct" id="acct" hidden><p class="z">종류별 수를 세지 못했어요.</p></div>`;
  const known=ACCT_KINDS.reduce((s,[k])=>s+(kinds[k]||0),0), unknown=Math.max(0,(+users||0)-known);
  return `<div class="acct" id="acct" hidden>
    ${ACCT_KINDS.map(([k,icon,label])=>`<div><i>${icon}</i><b>${kinds[k]||0}</b><span>${label}</span></div>`).join("")}
    ${unknown?`<div class="unk"><i>❔</i><b>${unknown}</b><span>아직 모름</span></div>`:""}
    <p class="note">아이 기기 연결은 휴대폰 연결 링크 · 공부방 일기 단추로 들어온 익명 계정이에요. 새 기기 · 새 브라우저에서 열 때마다 하나씩 생겨서 사람 수보다 많을 수 있어요.${unknown?" ‘아직 모름’은 이번 업데이트 전에 만든 계정이고, 그 기기에서 앱을 한 번 열면 종류가 채워져요.":""}</p></div>`;
}

// 날짜별 대문 접속 현황 (최근 30일, 새 날짜가 위로)
function visitCard(stats){
  if(!stats) return `<div class="card"><h2>📈 대문 접속 현황</h2><p class="alert">날짜별 접속 현황을 보려면 Firestore 규칙에 <b>stats</b> 부분을 한 번 추가해 주세요 (아래 규칙 안내의 '날짜별 접속 현황' 줄).</p><pre>${esc(RULES.split("match /users")[0])}</pre></div>`;
  const by=Object.fromEntries(stats.map(s=>[s.day,s])), days=[...Array(30)].map((_,i)=>daysAgo(i));
  const v=d=>by[d]||{}, max=Math.max(1,...days.map(d=>v(d).visitors||0));
  const sum=(n,k)=>days.slice(0,n).reduce((s,d)=>s+(v(d)[k]||0),0);
  const wd=d=>new Date(d+"T00:00").getDay();
  const n0=n=>n||'<span class="z">0</span>';
  const row=(d,i)=>{ const x=v(d), w=wd(d), n=x.visitors||0;
    return `<tr class="${i===0?"today":""}${!n&&!x.views?" empty":""}"><td class="l"><span class="${w===0?"d-sun":w===6?"d-sat":""}">${d.slice(5).replace("-","/")} (${"일월화수목금토"[w]})</span>${i===0?'<span class="tag-today">오늘</span>':""}</td>
    <td class="l"><span class="track"><s><i style="width:${Math.round(n/max*100)}%"></i></s><em>${n0(n)}</em></span></td><td class="num">${n0(x.members)}</td><td class="num">${n0(x.views)}</td></tr>`; };
  // 최근 7일만 보이고, 나머지 23일은 '펼쳐 보기'로 (같은 표 안이라 칸이 어긋나지 않아요)
  return `<div class="card visit"><h2>📈 대문 접속 현황</h2>
    <div class="vsum"><div class="hot"><b>${v(days[0]).visitors||0}</b><span>오늘 방문자</span></div><div><b>${v(days[1]).visitors||0}</b><span>어제</span></div><div><b>${sum(7,"visitors")}</b><span>최근 7일</span></div><div><b>${sum(30,"visitors")}</b><span>최근 30일</span></div></div>
    <div class="scroll"><table><thead><tr><th class="l">날짜</th><th class="l">방문자 (기기)</th><th>로그인해서 쓴 기기</th><th>페이지 열림</th></tr></thead>
      <tbody>${days.slice(0,7).map(row).join("")}</tbody><tbody id="visit-more" hidden>${days.slice(7).map((d,i)=>row(d,i+7)).join("")}</tbody></table></div>
    <button class="more" data-act="visit-more">▾ 이전 23일 펼쳐 보기</button>
    <p class="note">방문자는 그날 처음 들어온 기기 수예요 (같은 기기는 하루 한 번만 세요). 페이지 열림은 새로고침을 포함한 횟수예요. 누가 들어왔는지는 남기지 않고 날짜별 숫자만 세요.</p></div>`;
}
// AI 사용 횟수와 예상 금액 (이번 달 + 지난 두 달)
function aiCard(usage){
  const months=(usage?.months||[]);
  if(!months.length) return `<div class="card"><h2>🤖 AI 사용량 · 예상 금액</h2><p class="z">사용량을 불러오지 못했어요.</p></div>`;
  const calls=m=>AI_KINDS.reduce((s,[k])=>s+(m[k]||0),0);
  const cost=m=>usd(m)+(m.transcribe||0)*STT_USD;
  const rows=months.map(m=>{ const iinote=(m.who||{}).iinote||0, all=calls(m);
    return `<tr><td class="l"><b>${esc(m.month)}</b></td>${AI_KINDS.map(([k])=>`<td>${m[k]||'<span class="z">0</span>'}</td>`).join("")}
      <td><b>${all}</b><br><span class="sub">iinote ${iinote} · 공부방 ${Math.max(0,all-iinote)}</span></td>
      <td class="sub">${Math.round((m.input||0)/1000).toLocaleString()}k / ${Math.round((m.output||0)/1000).toLocaleString()}k</td>
      <td><b>${won(cost(m))}</b><br><span class="sub">$${cost(m).toFixed(2)}</span></td></tr>`; }).join("");
  return `<div class="card"><h2>🤖 AI 사용량 · 예상 금액</h2><div class="scroll"><table>
    <tr><th class="l">달</th>${AI_KINDS.map(([,l])=>`<th>${l}</th>`).join("")}<th>합계 횟수</th><th>토큰 (입력 / 출력)</th><th>예상 금액</th></tr>${rows}</table></div>
    <p class="note">모델 ${esc(usage.model||"")} · 100만 토큰당 입력 $${PRICE.input} · 출력 $${PRICE.output}, 1달러 ≈ ${KRW.toLocaleString()}원으로 어림한 금액이에요. 정확한 청구액은 Anthropic 콘솔(Billing)에서 확인하세요. 횟수는 공부방 · 예전 일기장 사용도 함께 세요 (아이 이름은 보이지 않아요).</p></div>`;
}

function render(fams,users,idx,usage,stats,kinds){
  const sum=k=>fams.reduce((s,f)=>s+f[k],0), ms=fams.flatMap(f=>f.members);
  const kids=ms.filter(p=>p.type==="child"), maxW=Math.max(1,...fams.map(f=>f.w));
  const active=fams.filter(f=>f.w>0).length;
  // 이름은 보여 주지 않아요: 가족은 만든 차례대로 번호, 사람은 보호자 · 아이(학년)로만
  fams.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).forEach((f,i)=>{ f.no=i+1; });
  const rows=fams.sort((a,b)=>b.w-a.w||b.total-a.total).map((f,i)=>`
    <tr class="fam" data-act="toggle" data-v="${i}"><td class="l"><b>가족 ${f.no}</b> <span class="sub">▾</span></td><td>${fmtDate(f.createdAt)}</td>
      <td>${f.members.filter(p=>p.type!=="child").length} · ${f.members.filter(p=>p.type==="child").length}</td>
      <td>${f.today||'<span class="z">0</span>'}</td><td class="l"><span class="bar" style="width:${Math.round(f.w/maxW*60)}px"></span>${f.w}</td><td>${f.m}</td><td>${f.total}</td></tr>
    ${f.members.map(p=>`<tr class="mem" data-g="${i}" hidden><td class="l">${p.type==="child"?`아이 <span class="sub">${gradeName(p.grade)}${p.linked?" · 자기 기기":""}</span>`:"보호자"}</td>
      <td></td><td></td><td></td><td>${p.week==null?'<span class="z">?</span>':p.week?`<span class="good">${p.week}</span>`:'<span class="z">0</span>'}</td>
      <td class="sub">${p.pen!=null?`다홍펜 ${p.pen}`:""}</td><td>${p.sub}${p.all>p.sub?` <span class="sub">(+쓰는 중 ${p.all-p.sub})</span>`:""}</td></tr>`).join("")}`).join("");
  const tile=(cls,icon,n,label)=>`<div class="tile ${cls}"><i>${icon}</i><b>${n}</b><span>${label}</span></div>`;
  const m0=usage?.months?.[0];
  $app.innerHTML = `<header><h1>📊 아이아이노트 운영 현황</h1><span class="when">${new Date().toLocaleString("ko-KR",{month:"long",day:"numeric",weekday:"short",hour:"2-digit",minute:"2-digit"})}</span>
      <button class="pill" data-act="reload">🔄 새로고침</button><button class="pill" data-act="logout">로그아웃</button></header>
    <div class="card" id="inbox"><h2>💌 문의함</h2><p class="sub">불러오는 중…</p></div>
    <div class="card" id="notice"><h2>📢 전체 공지 띠</h2><p class="sub">불러오는 중…</p></div>
    <div class="group-h">👨‍👩‍👧 사람 · 가족</div>
    <div class="tiles people">
      ${stats?tile("t-visit","🚪",(stats.find(x=>x.day===dayStr(new Date()))||{}).visitors||0,"오늘 방문자"):""}
      ${tile("t-fam","🏠",fams.length,"가족")}
      ${tile("t-fam","✍️",active,"이번 주 쓴 가족")}
      <button class="tile t-fam acct-btn" data-act="acct" aria-expanded="false"><i>🔑</i><b>${users}</b><span>로그인 계정 <em>▾ 나눠 보기</em></span></button>
      ${tile("t-fam","🧑‍🧒",`${ms.length-kids.length} · ${kids.length}`,"보호자 · 아이 프로필")}
      ${grassTile(stats)}
      ${acctPanel(users,kinds)}
    </div>
    <div class="group-h">📒 일기 · AI</div>
    <div class="tiles">
      ${tile("t-diary","📝",sum("today"),"오늘 일기")}
      ${tile("t-diary","🗓",sum("w"),"최근 7일 일기")}
      ${tile("t-diary","📚",sum("m"),"최근 30일 일기")}
      ${tile("t-diary","👩‍🏫",kids.reduce((s,p)=>s+(p.pen||0),0),"다홍펜 받은 아이 일기")}
      ${m0?tile("t-ai","🤖",AI_KINDS.reduce((s,[k])=>s+(m0[k]||0),0),"이번 달 AI 사용 횟수")+tile("t-ai","💰",won(usd(m0)+(m0.transcribe||0)*STT_USD),"이번 달 AI 예상 금액"):""}
    </div>
    ${visitCard(stats)}
    ${aiCard(usage)}
    <div class="card"><h2>🏡 가족별</h2><div class="scroll"><table>
      <tr><th class="l">가족 (누르면 사람별)</th><th>만든 날</th><th>보호자 · 아이</th><th>오늘</th><th class="l">최근 7일</th><th>30일</th><th>전체</th></tr>${rows||'<tr><td colspan="7" class="z">아직 가족이 없어요</td></tr>'}
    </table></div>
    <p class="note">일기 수는 쓰는 중(임시 저장)을 포함해요. 사람별 ‘전체’는 제출한 일기 수예요. 이 화면은 이름과 일기 내용을 보여 주지 않고 숫자만 세요.</p>
    ${idx.length?`<p class="alert">사람별 최근 7일(?)을 세려면 파이어베이스 색인이 한 번 필요해요. <a href="${esc(idx[0])}" target="_blank" rel="noopener">여기를 눌러 색인 만들기</a> → 몇 분 뒤 새로고침.</p>`:""}</div>`;
  loadInbox(inboxUid); loadNotice();
}
/* ---------- 📢 전체 공지 띠 (2026-10-07) ----------
   여기서 쓰면 모든 가족의 웹 · 앱 화면 위에 띠로 보여요 (서버 함수 noticeSet · noticeGet). 비우고 저장하면 내려가요.
   가족이 ✕ 로 닫으면 그 기기에서는 그 공지가 다시 안 보여요 (새로 쓰면 다시 보여요) */
async function callFn(name,data){ const FN=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-functions.js`); return (await FN.httpsCallable(FN.getFunctions(app,"asia-northeast3"),name)(data||{})).data; }
async function loadNotice(set){
  const el=document.getElementById("notice"); if(!el) return;
  try{
    const r=set?await callFn("noticeSet",set):await callFn("noticeGet"), n=r.notice;
    const ds=n?.until?new Date(n.until+9*36e5).toISOString().slice(0,10):"";
    el.innerHTML=`<h2>📢 전체 공지 띠 ${n?'<span class="sp-new">지금 보이는 중</span>':'<span class="sub">지금은 없음</span>'}</h2>
      <form id="nt-form" class="nt-form">
        <label class="sub" for="nt-t">공지 (200자까지 · 비우고 저장하면 내려가요)</label><textarea id="nt-t" name="text" rows="2" maxlength="200" placeholder="예: 10월 10일 밤 10시에 잠깐 점검해요">${esc(n?.text||"")}</textarea>
        <div class="nt-row"><label>모양 <select name="tone">${[["info","📢 알림"],["new","✨ 새 기능"],["warn","⚠️ 주의"]].map(([k,l])=>`<option value="${k}" ${n?.tone===k?"selected":""}>${l}</option>`).join("")}</select></label>
          <label>링크(선택) <input name="link" type="url" value="${esc(n?.link||"")}" placeholder="https://"></label>
          <label>내리는 날(선택) <input name="until" type="date" value="${ds}"></label>
          <button class="pill">저장</button></div></form>`;
  }catch(e){ el.innerHTML=`<h2>📢 전체 공지 띠</h2><p class="alert">불러오지 못했어요 (${esc(e.message||e.code||"")})</p>`; }
}
document.addEventListener("submit", e=>{ if(e.target.id!=="nt-form") return; e.preventDefault(); const f=e.target;
  const until=f.until.value?new Date(f.until.value+"T23:59:59+09:00").getTime():0;
  f.querySelector("button").disabled=true; loadNotice({text:f.text.value.trim(),tone:f.tone.value,link:f.link.value.trim(),until}); });

/* ---------- 💌 문의함 (2026-10-05) ----------
   웹 · 앱의 '챗봇 상담'(상담 · 🚩 신고)으로 온 문의를 보고 답장해요. 서버 함수 supportAdmin(운영자만)으로만 읽고 써요 (iinote-app/firebase/functions).
   답장을 보내면 그 사람 휴대폰으로 푸시가 가요 */
let inboxUid=null, threads=[];
const when=t=>t?new Date(t).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):"";
async function callAdmin(data){ const FN=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-functions.js`); return (await FN.httpsCallable(FN.getFunctions(app,"asia-northeast3"),"supportAdmin")(data||{})).data; }
async function loadInbox(uid,reply){
  const el=document.getElementById("inbox"); if(!el) return; inboxUid=uid||null;
  try{
    const r=await callAdmin(uid?(reply?{uid,text:reply}:{uid}):{});
    if(uid){ const t=threads.find(x=>x.uid===uid)||{};
      el.innerHTML=`<h2>💌 ${esc(t.name||"사용자")} <span class="sub">${esc(t.family||"")}</span> <button class="pill" data-act="inbox">← 문의함</button></h2>
        <div class="sp-msgs">${(r.msgs||[]).map(m=>`<p class="sp ${m.from==="op"?"op":"user"}${m.report?" rep":""}"><span>${esc(m.text)}</span><small>${m.from==="op"?"운영자 · ":""}${when(m.at)}</small></p>`).join("")}</div>
        <form id="sp-form"><label class="sub" for="sp-t">답장 (보내면 그 사람 휴대폰으로 알림이 가요)</label><textarea id="sp-t" name="t" rows="3" required></textarea><button class="pill">답장 보내기</button></form>`;
      const box=el.querySelector(".sp-msgs"); if(box) box.scrollTop=box.scrollHeight;
    } else { threads=r.threads||[]; const n=threads.reduce((s,x)=>s+(x.unreadOp||0),0);
      el.innerHTML=`<h2>💌 문의함 ${n?`<span class="sp-new">새 문의 ${n}</span>`:""}</h2>${threads.length?`<ul class="sp-list">${threads.map(x=>`<li><button data-act="inbox-open" data-v="${esc(x.uid)}"><b>${x.reports?`<span class="sp-rep">🚩 ${x.reports}</span> `:""}${esc(x.name||"사용자")}</b><span class="sub">${esc(x.family||"")}</span>${x.unreadOp?`<span class="sp-new">${x.unreadOp}</span>`:""}<em>${esc(x.last||"")}</em><small>${when(x.updatedAt)}</small></button></li>`).join("")}</ul>`:`<p class="sub">아직 문의가 없어요.</p>`}`;
    }
  }catch(e){ console.warn("문의함",e); el.innerHTML=`<h2>💌 문의함</h2><p class="alert">문의함을 불러오지 못했어요 (${esc(e.message||e.code||"")})</p>`; }
}
document.addEventListener("submit", e=>{ if(e.target.id!=="sp-form") return; e.preventDefault(); const t=e.target.t.value.trim(); if(!t) return; e.target.querySelector("button").disabled=true; loadInbox(inboxUid,t); });

function showRuleHelp(e){
  $app.innerHTML = `<div class="card"><h2>🔒 파이어베이스 규칙을 한 번 추가해 주세요</h2>
    <p>운영자 계정이 가족 수와 일기 수를 셀 수 있게 허락하는 규칙이 아직 없어요 <span class="sub">(${esc(e.code||e.message)})</span>.</p>
    <p class="sub">파이어베이스 콘솔 → iinote → Firestore Database → 규칙 → <b>match /databases/{database}/documents { … }</b> 안쪽, 이미 있는 match 들 옆에 아래를 붙여 넣고 [게시]를 누르세요. 기존 규칙은 그대로 두면 돼요.</p>
    <pre>${esc(RULES)}</pre>
    <p class="note">이 규칙은 bellachord 계정에게만 목록 읽기를 허락해요. 이 화면은 그중 '개수 세기'만 써서 일기 내용은 받아 오지 않아요.</p>
    <button class="pill" data-act="reload">🔄 다시 해 보기</button> <button class="pill" data-act="logout">로그아웃</button></div>`;
}

document.addEventListener("click", async e => {
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act;
  if(act==="login"){ const p=new AU.GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"});
    try{ await AU.signInWithPopup(auth,p); }catch(err){ if(err.code!=="auth/popup-closed-by-user" && err.code!=="auth/cancelled-popup-request") $app.innerHTML=loginHTML(errText(err)); } }
  if(act==="logout"){ await AU.signOut(auth); }
  if(act==="reload") load();
  if(act==="acct"){ const p=document.getElementById("acct"); p.hidden=!p.hidden; b.setAttribute("aria-expanded",!p.hidden); b.querySelector("em").textContent=p.hidden?"▾ 나눠 보기":"▴ 접기"; }
  if(act==="visit-more"){ const t=document.getElementById("visit-more"); t.hidden=!t.hidden; b.textContent=t.hidden?"▾ 이전 23일 펼쳐 보기":"▴ 접기 (최근 7일만)"; }
  if(act==="inbox") loadInbox(null);
  if(act==="inbox-open") loadInbox(b.dataset.v);
  if(act==="toggle") document.querySelectorAll(`tr.mem[data-g="${b.dataset.v}"]`).forEach(r=>r.hidden=!r.hidden);
});
let msg="";
AU.onAuthStateChanged(auth, async u => {
  if(!u){ $app.innerHTML=loginHTML(msg); msg=""; return; }
  if(u.email!==ADMIN_EMAIL){ msg=`운영자 계정이 아니에요: ${u.email||"이메일 없음"} (admin/not-allowed)`; const m=msg; await AU.signOut(auth); $app.innerHTML=loginHTML(m); return; }
  load();
});
</script>
</body>
</html>
